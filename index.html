/* ============ A4 원페이지 스마트 인쇄 스튜디오 ============ */
const SIZE = { portrait:{ w:196, h:281 }, landscape:{ w:283, h:194 } };
const P = { max:11, min:6.2 };
const mm = v => v * 96 / 25.4;
const PR = { view:"", studentId:"", fit:null, page:"portrait" };
const stamp = () => new Date().toLocaleDateString("ko-KR", { year:"numeric", month:"2-digit", day:"2-digit" });
const qNote = () => S.q.trim() && PR.view !== "student_one" ? `필터: ${S.q.trim()}` : "";

const defaultPageOf = v => v === "roster" ? "landscape" : "portrait";

function paperTT(entries, opts = {}){
  const maxP = Math.min(9, Math.max(7, ...entries.map(e => e.period || 0)));
  const grid = new Map();
  for(const e of entries){
    const k = `${e.day}|${e.period}`;
    if(!grid.has(k)) grid.set(k, []);
    grid.get(k).push(e);
  }
  const one = e => {
    const own = e.room && e.grade && e.ban && e.room === `${e.grade}학년 ${e.ban}반`;
    const meta = [
      e.slot && !SPECIAL[e.subject] ? `[${e.slot}]` : "",
      opts.bans ? (e.bans.length ? e.bans : (e.ban ? [e.ban] : [])).map(b => `${e.grade}-${b}`).join("·") + "반" : "",
      e.bans.length && e.ban && !opts.bans ? `${splitNo(e)}분반` : "",
      S.print.teacher && !opts.noTeacher ? e.teacher : "",
      S.print.room && !own && !opts.noRoom ? e.room : ""
    ].filter(Boolean).join(" · ");
    return `<span class="pe"><b>${esc(e.subject)}</b>${meta ? `<i>${esc(meta)}</i>` : ""}</span>`;
  };
  const head = `<div class="h">교시</div>` + Array.from({ length:maxP }, (_, i) => `<div class="p">${i + 1}</div>`).join("");
  const cols = DAYS.map(d => `<div class="h">${d}</div>` + Array.from({ length:maxP }, (_, i) => {
    const list = grid.get(`${d}|${i + 1}`) || [];
    return `<div class="c">${list.map(one).join("")}</div>`;
  }).join("")).join("");
  return `<div class="ptt" style="grid-template-rows:auto repeat(${maxP},minmax(var(--pr,14mm),auto))">${head}${cols}</div>`;
}

    const entries = studentEntries(s);

      <table><colgroup><col style="width:9mm"><col style="width:16mm"><col style="width:18mm">

      <thead><tr><th>연번</th><th>학번</th><th>이름</th>${hd.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${c.roster.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.id)}</td><td>${esc(s.name)}</td>
        ${hd.map(() => "<td></td>").join("")}</tr>`).join("")
        || `<tr><td colspan="${hd.length + 3}" class="pn">수강생 없음</td></tr>`}</tbody></table>${foot}</div>`;
  }

  if(v === "klass"){

    return `<div class="paper"><h1>${g}학년 ${b}반 주간 시간표</h1>
      <p class="ps">재적 ${list.length}명</p>

  if(v === "teacher"){

    return `<div class="paper"><h1>${esc(S.teacher)} 선생님 주간 시간표</h1>
      <p class="ps">주간 ${entries.length}시간</p>

  }

  if(v === "room"){
    const entries = M.lessons.filter(r => r.room === S.room);
    return `<div class="paper"><h1>${esc(S.room)} 사용 시간표</h1>
      <p class="ps">주간 ${entries.length}시간</p>
      ${paperTT(entries, { bans:true, noRoom:true })}${foot}</div>`;
  }

  const rows = courseRows(S.grade);
  return `<div class="paper"><h1>${gLabel(S.grade)} 선택과목 개설 강좌표</h1>
    <p class="ps">총 ${rows.length}개 강좌 · 연인원 ${rows.reduce((a, c) => a + c.count, 0)}명</p>
    <table><colgroup><col style="width:14mm"><col>
      ${S.print.teacher ? '<col style="width:26mm">' : ""}${S.print.room ? '<col style="width:34mm">' : ""}
      ${S.print.count ? '<col style="width:14mm">' : ""}</colgroup>
    <thead><tr><th>슬롯</th><th>과목명</th>${S.print.teacher ? "<th>교사</th>" : ""}
      ${S.print.room ? "<th>장소</th>" : ""}${S.print.count ? "<th>인원</th>" : ""}</tr></thead>
    <tbody>${rows.map(c => `<tr><td>${esc(c.slot)}</td><td class="l">${esc(c.subject)}</td>
      ${S.print.teacher ? `<td>${esc(c.teacher || "-")}</td>` : ""}
      ${S.print.room ? `<td>${esc(c.room || "-")}</td>` : ""}
      ${S.print.count ? `<td>${c.count}</td>` : ""}</tr>`).join("")}</tbody></table>${foot}</div>`;
}

function fitPaper(stage, size){
  const paper = stage.querySelector(".paper");
  const limH = mm(size.h) - 2, limW = mm(size.w);
  paper.style.width = `${size.w}mm`;
  paper.style.removeProperty("--pr");
  paper.style.removeProperty("--pp");
  paper.style.transform = "none";

  const at = s => { paper.style.setProperty("--pf", `${s}pt`); return paper.getBoundingClientRect().height; };
  const best = () => {
    if(at(P.max) <= limH) return P.max;
    let lo = P.min, hi = P.max;
    for(let i = 0; i < 12; i++){ const mid = (lo + hi) / 2; if(at(mid) <= limH) lo = mid; else hi = mid; }
    return Math.floor(lo * 100) / 100;
  };
  const settle = () => {
    let font = best();
    at(font);
    for(let i = 0; i < 40 && paper.getBoundingClientRect().height > limH && font > P.min; i++){
      font = Math.max(P.min, Math.round((font - 0.05) * 100) / 100);
      at(font);
    }
    return font;
  };
  let font = settle();
  if(paper.getBoundingClientRect().height > limH){
    paper.style.setProperty("--pp", "0.5px");
    font = settle();
  }
  let h = paper.getBoundingClientRect().height;
  const wide = paper.scrollWidth > limW + 1 ? limW / paper.scrollWidth : 1;
  let scale = Math.min(1, wide, limH / h);

  if(scale >= 1){
    let count = paper.querySelectorAll("tbody tr").length;
    if(!count){
      const tt = paper.querySelector(".ptt");
      count = tt ? Math.max(1, tt.style.gridTemplateRows.match(/repeat\((\d+)/)?.[1] || 7) : 1;
    }
    const cap = mm(paper.querySelector(".ptt") ? 42 : 18);
    let lo = 0, hi = Math.min(limH / Math.max(count, 1), cap);
    for(let i = 0; i < 12; i++){
      const mid = (lo + hi) / 2;
      paper.style.setProperty("--pr", `${mid}px`);
      if(paper.getBoundingClientRect().height <= limH) lo = mid; else hi = mid;
    }
    paper.style.setProperty("--pr", `${Math.floor(lo * 100) / 100}px`);
    h = paper.getBoundingClientRect().height;
    scale = Math.min(1, limH / h);
  }
  if(scale < 1) scale *= 0.998;
  paper.style.transform = `scale(${scale})`;
  return { font, scale, pt:font * scale };
}

function buildPaper(){
  $("#pageRule").textContent = `@page{size:A4 ${PR.page};margin:7mm}`;
  const stage = $("#stage"), prev = stage.style.transform;
  const size = SIZE[PR.page];
  stage.style.width = `${size.w}mm`;
  stage.style.height = `${size.h}mm`;
  stage.style.transform = "none";
  stage.innerHTML = paperHTML(PR.view);
  PR.fit = fitPaper(stage, size);
  stage.style.transform = prev;

  const pt = PR.fit.pt, tight = pt < 7.4;
  const el = $("#fit");
  el.className = `fit${tight ? " tight" : ""}`;
  el.textContent = !tight
    ? `A4 ${PR.page === "landscape" ? "가로" : "세로"} 1장 자동 맞춤 완료 · 글자 크기 ${pt.toFixed(1)}pt`
    : `글자 크기 ${pt.toFixed(1)}pt (다소 작음 — 용지 방향을 바꾸거나 표시 항목을 줄여 보세요)`;
}

function scaleView(){
  const view = $("#pview"), stage = $("#stage"), size = SIZE[PR.page];
  const w = view.clientWidth - 28;
  const room2 = Math.max(260, innerHeight * 0.86 - 190);
  const s = Math.max(0.15, Math.min(1, w / mm(size.w), room2 / mm(size.h)));
  stage.style.transform = `scale(${s})`;
  stage.style.marginLeft = `${Math.max(0, (w - mm(size.w) * s) / 2)}px`;
  view.style.height = `${mm(size.h) * s + 28}px`;
}

function renderPrintOpts(){
  const items = [];
  if(PR.view !== "roster" && PR.view !== "teacher") items.push(chkInput("담당 교사 표시", "print", "teacher"));
  if(PR.view !== "room") items.push(chkInput("수업 장소 표시", "print", "room"));
  if(PR.view === "roster" || PR.view === "course") items.push(chkInput("수강 인원 표시", "print", "count"));

  $("#pset").innerHTML = `
    <div class="pset-group">
      <div class="pset-label">용지 방향</div>
      <div class="seg" style="width:100%">
        <button type="button" style="flex:1" data-po="portrait" aria-pressed="${PR.page === "portrait"}">세로</button>
        <button type="button" style="flex:1" data-po="landscape" aria-pressed="${PR.page === "landscape"}">가로</button>
      </div>
    </div>
    ${items.length ? `<div class="pset-group"><div class="pset-label">표시 항목</div>${items.join("")}</div>` : ""}
  `;
}

const printReady = v => v === "klass" ? !!S.ban : v === "teacher" ? !!S.teacher
  : v === "room" ? !!S.room : v === "roster" ? IX.course.has(S.course) : true;

function openPrint(customView = "", studentId = ""){
  if(!loaded) return;
  const targetView = customView || S.view;
  if(targetView !== "student_one" && (!VIEWS[targetView]?.paper || !printReady(targetView))){
    toast(targetView === "roster" ? "인쇄할 강좌를 먼저 선택해 주세요"
      : targetView === "klass" ? "인쇄할 학급을 먼저 선택해 주세요"
      : targetView === "room" ? "인쇄할 장소를 먼저 선택해 주세요" : "인쇄할 교사를 먼저 선택해 주세요");
    return;
  }
  if($("#ddlg").open && targetView === "student_one") $("#ddlg").close();
  PR.view = targetView;
  PR.studentId = studentId;
  PR.page = defaultPageOf(targetView);
  $("#pview").appendChild($("#stage"));
  renderPrintOpts();
  if(!$("#pdlg").open) $("#pdlg").showModal();
  buildPaper();
  scaleView();
}

function doPrint(){
  const stage = $("#stage");
  $("#pdlg").close();
  $("#proot").appendChild(stage);
  stage.style.transform = "none";
  stage.style.marginLeft = "0";
  printing = true;
  document.body.classList.add("pr");
  clearTimeout(printTimer);
  printTimer = setTimeout(endPrint, 4000);
  print();
}

function endPrint(){
  clearTimeout(printTimer);
  if(!printing) return;
  printing = false;
  document.body.classList.remove("pr");
  if($("#pdlg").open){ $("#pview").appendChild($("#stage")); scaleView(); }
}
addEventListener("afterprint", endPrint);
addEventListener("beforeprint", () => {
  if(printing || !loaded) return;
  const open = $("#pdlg").open;
  if(!open){
    if($("#ddlg").open && DET.kind === "student"){
      PR.view = "student_one"; PR.studentId = DET.id; PR.page = "portrait";
    }else if(VIEWS[S.view]?.paper && printReady(S.view)){
      PR.view = S.view; PR.page = defaultPageOf(S.view);
    }else return;
  }
  $("#proot").appendChild($("#stage"));
  $("#stage").style.transform = "none";
  $("#stage").style.marginLeft = "0";
  try{ if(!open) buildPaper(); }catch{ return; }
  printing = true;
  document.body.classList.add("pr");
  clearTimeout(printTimer);
  printTimer = setTimeout(endPrint, 4000);
});

/* ============ 통합 빠른 이동 팔레트 (Ctrl+K) ============ */
let cmdItems = [], cmdIdx = 0;

function openCmd(){
  $("#kq").value = "";
  cmdIdx = 0;
  renderCmd();
  if(!$("#kdlg").open) $("#kdlg").showModal();
  $("#kq").focus();
}

function renderCmd(){
  const qStr = $("#kq").value;
  const qList = parseTerms(qStr);
  cmdItems = [];

  const pushGroup = (group, arr) => {
    for(const item of arr) cmdItems.push({ group, ...item });
  };

  if(!qList.length){
    pushGroup("화면 바로가기", VK.map((k, i) => ({
      title: `${VIEWS[k].label} 화면으로 이동`, sub: `단축키 ${i + 1}`, act: () => go(k)
    })));
  }else{
    /* 학급 매칭 (예: 2-3, 2학년 3반) */
    const classHits = [];
    for(const [g, set] of IX.classes.entries()){
      for(const b of [...set].sort((x, y) => x - y)){
        if(matchQuery(qList, `${g}-${b}`, `${g}학년 ${b}반`, `${g}학년${b}반`))
          classHits.push({ title:`${g}학년 ${b}반 시간표`, sub:"학급", act:() => toClass(`${g}-${b}`) });
      }
    }
    pushGroup("학급", classHits.slice(0, 5));

    /* 교사 */
    pushGroup("교사", IX.teachers.filter(t => matchQuery(qList, t)).slice(0, 6).map(t => ({
      title: `${t} 선생님`, sub: "교사 시간표", act: () => toTeacher(t)
    })));

    /* 장소 */
    pushGroup("수업 장소", IX.rooms.filter(r => matchQuery(qList, r)).slice(0, 5).map(r => ({
      title: r, sub: "장소 사용 시간표", act: () => toRoom(r)
    })));

    /* 강좌 */
    pushGroup("개설 강좌", M.courses.filter(c => matchQuery(qList, c.slot, c.subject, c.teacher, gLabel(c.grade))).slice(0, 8).map(c => ({
      title: `[${c.slot}] ${c.subject}`, sub: `${gLabel(c.grade)} · ${c.teacher || "미정"} · ${c.count}명`, act: () => openDetail("course", c.id)
    })));

    /* 학생 */
    pushGroup("학생", M.students.filter(s => matchQuery(qList, s.id, s.name, `${s.grade}-${s.ban}`)).slice(0, 10).map(s => ({
      title: `${s.name} (${s.id})`, sub: `${s.grade}학년 ${s.ban}반 · ${s.courses.length}과목`, act: () => openDetail("student", s.id)
    })));
  }

  if(cmdIdx >= cmdItems.length) cmdIdx = 0;

  if(!cmdItems.length){
    $("#klist").innerHTML = `<p class="muted" style="padding:24px;text-align:center">일치하는 결과가 없습니다</p>`;
    return;
  }

  let curGroup = "", html = "";
  cmdItems.forEach((it, idx) => {
    if(it.group !== curGroup){
      curGroup = it.group;
      html += `<div class="cmd-group-label">${esc(curGroup)}</div>`;
    }
    html += `<button type="button" class="cmd-item${idx === cmdIdx ? " is-sel" : ""}" data-cmd-idx="${idx}">
      <span style="font-weight:700">${hl(it.title, qStr)}</span>
      <span class="cmd-item-sub">${esc(it.sub)}</span>
    </button>`;
  });
  $("#klist").innerHTML = html;
}

/* ============ 환경설정 모달 ============ */
function openSettings(){
  $("#sbody").innerHTML = `
    <div class="set-row"><span>화면 테마</span><div class="seg">${
      [["light","밝게"],["dark","어둡게"],["system","시스템 자동"]].map(([v, l]) =>
        `<button type="button" data-th="${v}" aria-pressed="${S.theme === v}">${l}</button>`).join("")}</div></div>
    <div class="set-row"><span>글자 크기</span><div class="seg">${
      [[0.92,"작게"],[1,"보통"],[1.1,"크게"],[1.22,"아주 크게"]].map(([v, l]) =>
        `<button type="button" data-fs="${v}" aria-pressed="${S.fs === v}">${l}</button>`).join("")}</div></div>
    <h3>키보드 단축키</h3>
    <div class="keys-grid">
      <div><kbd>1</kbd>~<kbd>6</kbd><span>6개 화면 전환</span></div>
      <div><kbd>/</kbd><span>현재 화면 검색</span></div>
      <div><kbd>Ctrl</kbd>+<kbd>K</kbd><span>통합 빠른 이동</span></div>
      <div><kbd>←</kbd><kbd>→</kbd><span>학년·반 / 상세 이동</span></div>
      <div><kbd>D</kbd><span>다크/라이트 전환</span></div>
      <div><kbd>P</kbd><span>A4 인쇄 미리보기</span></div>
      <div><kbd>R</kbd><span>구글 시트 새로고침</span></div>
      <div><kbd>Esc</kbd><span>검색 초기화 / 창 닫기</span></div>
    </div>
    <h3>슬롯 색상 범례</h3>
    <div class="chips">${uniq(M.courses.map(c => c.slot)).sort().map(s =>
      `<span class="chip" style="${tone(s)}"><i class="cm"></i>${esc(s)}</span>`).join("") || '<span class="muted">데이터 없음</span>'}</div>
    <h3>동작 안내</h3>
    <p style="font-size:var(--f-xs);color:var(--ink-3);line-height:1.6">
      이 워크스페이스는 연결된 6개의 구글 스프레드시트를 실시간 읽기 전용으로 조회합니다.
      원본 시트는 절대 수정되지 않으며, 데이터 변경이 필요할 경우 원본 구글 시트를 수정한 뒤 새로고침(R)하세요.
    </p>`;
  if(!$("#sdlg").open) $("#sdlg").showModal();
}

/* ============ 네비게이션 라우터 ============ */
function toClass(key){
  const [g, b] = String(key).split("-").map(num);
  if(!g) return;
  $("#ddlg").close(); $("#kdlg").close();
  S.cg = g; S.ban = b || 0; S.view = "klass"; S.q = ""; $("#q").value = "";
  draw();
  window.scrollTo({ top:0, behavior:"instant" });
}
function toTeacher(name){
  if(!IX.teachers.includes(name)) return;
  $("#ddlg").close(); $("#kdlg").close();
  S.teacher = name; S.view = "teacher"; S.q = ""; $("#q").value = "";
  draw();
  window.scrollTo({ top:0, behavior:"instant" });
}
function toRoom(name){
  if(!IX.rooms.includes(name)) return;
  $("#ddlg").close(); $("#kdlg").close();
  S.room = name; S.view = "room"; S.q = ""; $("#q").value = "";
  draw();
  window.scrollTo({ top:0, behavior:"instant" });
}
function toSlot(key){
  const [g, slot] = String(key).split("|");
  $("#ddlg").close(); $("#kdlg").close();
  S.grade = num(g) === 3 ? 3 : 2; S.view = "course"; S.q = ""; $("#q").value = "";
  draw();
  $(`#slot-${CSS.escape(slot)}`)?.scrollIntoView({ block:"start", behavior:"smooth" });
}
function toRoster(id){
  if(!IX.course.has(id)) return;
  $("#ddlg").close(); $("#kdlg").close();
  S.course = id; S.view = "roster"; S.q = ""; $("#q").value = "";
  draw();
  window.scrollTo({ top:0, behavior:"instant" });
}

function toggleThemeQuick(){
  const isDark = document.documentElement.dataset.theme === "dark";
  S.theme = isDark ? "light" : "dark";
  applyPrefs();
  savePrefs();
  toast(S.theme === "dark" ? "어두운 테마로 전환했습니다" : "밝은 테마로 전환했습니다");
}

/* ============ 이벤트 리스너 ============ */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if(!t) return;

  if(t.dataset.cmdIdx != null){
    const item = cmdItems[num(t.dataset.cmdIdx)];
    $("#kdlg").close();
    item?.act();
    return;
  }
  if(t.dataset.v){ go(t.dataset.v); return; }
  if(t.dataset.u){ openDetail("student", t.dataset.u); return; }
  if(t.dataset.c){ openDetail("course", t.dataset.c); return; }
  if(t.dataset.rosterPick){ S.course = t.dataset.rosterPick; draw({ keep:true }); return; }
  if(t.dataset.cls){ toClass(t.dataset.cls); return; }
  if(t.dataset.t){ toTeacher(t.dataset.t); return; }
  if(t.dataset.rm){ toRoom(t.dataset.rm); return; }
  if(t.dataset.sl){ toSlot(t.dataset.sl); return; }
  if(t.dataset.g){ S.grade = num(t.dataset.g); draw(); return; }
  if(t.dataset.g0 != null){ S.grade0 = num(t.dataset.g0); draw({ keep:true }); return; }
  if(t.dataset.cg){
    S.cg = num(t.dataset.cg);
    const list = bansOf(S.cg);
    S.ban = list.includes(S.ban) ? S.ban : (list[0] || 0);
    draw();
    return;
  }
  if(t.dataset.b){ S.ban = num(t.dataset.b); draw(); return; }
  if(t.dataset.po){
    PR.page = t.dataset.po;
    renderPrintOpts();
    buildPaper();
    scaleView();
    return;
  }
  if(t.dataset.o){
    const [g, k] = t.dataset.o.split(".");
    if(typeof S[g]?.[k] === "boolean"){ S[g][k] = !S[g][k]; draw({ keep:true }); }
    return;
  }
  if(t.dataset.th){ S.theme = t.dataset.th; applyPrefs(); savePrefs(); openSettings(); return; }
  if(t.dataset.fs){ S.fs = +t.dataset.fs; applyPrefs(); savePrefs(); openSettings(); return; }

  switch(t.dataset.a){
    case "reload": reload(); break;
    case "toggle-theme": toggleThemeQuick(); break;
    case "open-cmd": openCmd(); break;
    case "open-health": fillHealthModal(); if(!$("#hdlg").open) $("#hdlg").showModal(); break;
    case "alert-x": hideWarn(); break;
    case "gap-x": gapShut = true; $("#gap").hidden = true; break;
    case "close": t.closest("dialog")?.close(); break;
    case "open-print": openPrint(); break;
    case "print": doPrint(); break;
    case "csv-students": exportStudentsCSV(); break;
    case "csv-courses": exportCoursesCSV(); break;
    case "csv-roster": exportRosterCSV(S.course); break;
    case "d-prev": moveDetail(-1); break;
    case "d-next": moveDetail(1); break;
    case "d-roster": toRoster(DET.id); break;
    case "d-print": openPrint("student_one", DET.id); break;
    case "d-csv": exportRosterCSV(DET.id); break;
    case "d-copy":
      navigator.clipboard?.writeText(detailText())
        .then(() => toast("클립보드에 복사했습니다"), () => toast("복사하지 못했습니다"));
      break;
    case "clear":
      try{ localStorage.removeItem(CACHE); }catch{}
      cachedAt = 0;
      fillHealthModal();
      toast("기기에 보관하던 오프라인 사본을 비웠습니다");
      break;
  }
});

/* 테이블 행 클릭 위임 */
document.addEventListener("click", ev => {
  if(ev.target.closest("button, a, input")) return;
  const tr = ev.target.closest("tr.row-hit");
  if(!tr) return;
  if(tr.dataset.u) openDetail("student", tr.dataset.u);
  else if(tr.dataset.c) openDetail("course", tr.dataset.c);
  else if(tr.dataset.cls) toClass(tr.dataset.cls);
});

document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.o && el.type === "checkbox"){
    const [g, k] = el.dataset.o.split(".");
    if(typeof S[g]?.[k] === "boolean"){
      S[g][k] = el.checked;
      savePrefs();
      if(g === "print"){ buildPaper(); scaleView(); } else draw({ keep:true });
    }
    return;
  }
  if(el.id === "tsel"){ S.teacher = el.value; draw(); return; }
  if(el.id === "rsel"){ S.room = el.value; draw(); return; }
  if(el.id === "csel"){ S.course = el.value; draw(); return; }
  if(el.id === "head"){ S.head = el.value; heads = []; draw({ keep:true }); return; }
  if(el.id === "cols"){
    const n = Math.max(1, Math.min(30, num(el.value) || 1));
    S.cols = n; el.value = n;
    draw({ keep:true });
  }
});

/* 검색 및 한글 IME 입력 처리 */
let qt = null, dqt = null;
const applyQ = () => { S.q = $("#q").value; draw({ keep:true }); };
const applyDirQ = () => { const el = $("#dirInput"); if(el){ S.dirQ = el.value; draw({ keep:true }); } };

document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "q"){
    clearTimeout(qt);
    if(!el.dataset.ime) qt = setTimeout(applyQ, 110);
    return;
  }
  if(el.id === "dirInput"){
    clearTimeout(dqt);
    if(!el.dataset.ime) dqt = setTimeout(applyDirQ, 90);
    return;
  }
  if(el.id === "kq"){
    cmdIdx = 0;
    renderCmd();
    return;
  }
  if(el.dataset.h != null){ heads[num(el.dataset.h)] = el.value; savePrefs(); }
});

document.addEventListener("compositionstart", ev => {
  if(ev.target.id === "q" || ev.target.id === "dirInput") ev.target.dataset.ime = "1";
});
document.addEventListener("compositionend", ev => {
  if(ev.target.id === "q"){
    delete ev.target.dataset.ime;
    clearTimeout(qt);
    applyQ();
  }else if(ev.target.id === "dirInput"){
    delete ev.target.dataset.ime;
    clearTimeout(dqt);
    applyDirQ();
  }
});

/* 다이얼로그 백드롭 클릭 닫기 */
for(const id of ["ddlg", "pdlg", "hdlg", "kdlg", "sdlg"]){
  const dlg = $("#" + id);
  dlg.addEventListener("click", ev => {
    if(ev.target !== dlg) return;
    const r = dlg.getBoundingClientRect();
    if(ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) dlg.close();
  });
}
$("#ddlg").addEventListener("close", () => { DET.kind = ""; DET.id = ""; DET.list = []; });
$("#pdlg").addEventListener("close", () => {
  $("#proot").appendChild($("#stage"));
  $("#stage").style.transform = "none";
  $("#stage").style.marginLeft = "0";
  $("#pageRule").textContent = "@page{size:A4 portrait;margin:7mm}";
});
$("#sdlg").addEventListener("close", () => draw({ keep:true }));
$("#setBtn").addEventListener("click", openSettings);

/* 전역 키보드 단축키 */
document.addEventListener("keydown", ev => {
  /* Ctrl+K / Cmd+K 통합 검색 */
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k"){
    ev.preventDefault();
    if($("#kdlg").open) $("#kdlg").close();
    else openCmd();
    return;
  }

  /* 커맨드 팔레트 내부 방향키 조작 */
  if($("#kdlg").open){
    if(ev.key === "ArrowDown"){
      ev.preventDefault();
      if(cmdItems.length){ cmdIdx = (cmdIdx + 1) % cmdItems.length; renderCmd(); $(".cmd-item.is-sel")?.scrollIntoView({ block:"nearest" }); }
      return;
    }
    if(ev.key === "ArrowUp"){
      ev.preventDefault();
      if(cmdItems.length){ cmdIdx = (cmdIdx - 1 + cmdItems.length) % cmdItems.length; renderCmd(); $(".cmd-item.is-sel")?.scrollIntoView({ block:"nearest" }); }
      return;
    }
    if(ev.key === "Enter" && cmdItems[cmdIdx]){
      ev.preventDefault();
      const target = cmdItems[cmdIdx];
      $("#kdlg").close();
      target.act();
      return;
    }
  }

  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const a = document.activeElement;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(a?.tagName || "") || a?.isContentEditable;
  const open = $$("dialog[open]").length > 0;

  if(ev.key === "Escape" && !open && S.q){
    S.q = ""; $("#q").value = ""; a?.blur?.(); draw({ keep:true }); return;
  }
  if(ev.key === "Escape" && typing && !open){
    a.blur(); return;
  }
  if(open && (ev.key === "ArrowLeft" || ev.key === "ArrowRight") && !typing && $("#ddlg").open){
    ev.preventDefault();
    moveDetail(ev.key === "ArrowLeft" ? -1 : 1);
    return;
  }
  if(typing || open) return;

  if(ev.key === "/"){ ev.preventDefault(); $("#q")?.focus(); return; }
  const n = Number(ev.key);
  if(Number.isInteger(n) && n >= 1 && n <= VK.length){ ev.preventDefault(); go(VK[n - 1]); return; }

  const k = ev.key.toLowerCase();
  if(k === "r"){ ev.preventDefault(); reload(); return; }
  if(k === "d"){ ev.preventDefault(); toggleThemeQuick(); return; }
  if(k === "p" && loaded && VIEWS[S.view]?.paper){ ev.preventDefault(); openPrint(); return; }
  if(k === "s"){ ev.preventDefault(); openSettings(); return; }

  if(ev.key === "ArrowLeft" || ev.key === "ArrowRight"){
    const d = ev.key === "ArrowLeft" ? -1 : 1;
    if(S.view === "course"){ ev.preventDefault(); S.grade = S.grade === 2 ? 3 : 2; draw(); }
    else if(S.view === "klass"){
      const list = bansOf(S.cg);
      if(!list.length) return;
      ev.preventDefault();
      const i = list.indexOf(S.ban);
      S.ban = list[(i < 0 ? 0 : i + d + list.length) % list.length];
      draw();
    }
  }
});

let rt = null;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    document.documentElement.style.setProperty("--top-h", $(".top").offsetHeight + "px");
    if($("#pdlg").open) scaleView();
  }, 150);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(S.theme === "system") applyPrefs(); });
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && Date.now() - lastLoad > CONFIG.POLL_MS) reload();
});
setInterval(() => { if(!document.hidden && !printing) reload(); }, CONFIG.POLL_MS);

/* ============ 앱 부트스트랩 ============ */
loadPrefs();
applyPrefs();
loadCache();
loading = true;
draw();
reload();
</script>
