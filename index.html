<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>선택과목 워크스페이스</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
(function(){
  try{
    var p = JSON.parse(localStorage.getItem("sk-prefs-v1") || "{}");
    var dark = p.theme === "dark" || ((!p.theme || p.theme === "system") &&
      matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    if([0.92,1,1.1,1.22].indexOf(p.fs) >= 0) document.documentElement.style.setProperty("--fs", p.fs);
  }catch(e){ document.documentElement.dataset.theme = "light"; }
})();
</script>
<style id="pageRule">@page{size:A4 portrait;margin:7mm}</style>
<style>
/* ==========================================================================
   선택과목 — 학사 시간표 & 이동수업 인텔리전스 워크스페이스
   구글 시트 6개를 읽기 전용으로 조회·검증·조판한다.
   ========================================================================== */

:root {
  color-scheme: light;
  --bg-canvas: #F3F5F9;
  --bg-surface: #FFFFFF;
  --bg-subtle: #F8FAFC;
  --bg-muted: #EEF2F6;
  --bg-hover: #F1F5F9;
  --bg-glass: rgba(255, 255, 255, 0.86);

  --ink-1: #0F172A;
  --ink-2: #475569;
  --ink-3: #64748B;
  --ink-4: #94A3B8;

  --line-1: #E2E8F0;
  --line-2: #CBD5E1;
  --line-focus: #2563EB;

  --accent: #2563EB;
  --accent-hover: #1D4ED8;
  --accent-soft: #EFF6FF;
  --accent-border: #BFDBFE;
  --accent-ink: #1E40AF;

  --ok: #10B981;
  --ok-soft: #ECFDF5;
  --ok-ink: #065F46;

  --warn: #F59E0B;
  --warn-soft: #FFFBEB;
  --warn-border: #FDE68A;
  --warn-ink: #92400E;

  --danger: #EF4444;
  --danger-soft: #FEF2F2;
  --danger-ink: #991B1B;

  /* 슬롯 컬러 조립 토큰 */
  --slot-bg-s: 5%;   --slot-bg-l: 94%;
  --slot-card-s: 0%; --slot-card-l: 97%;
  --slot-fg-s: 20%;  --slot-fg-l: 28%;
  --slot-bd-s: 12%;  --slot-bd-l: 52%;

  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 48px rgba(15, 23, 42, 0.16), 0 4px 12px rgba(15, 23, 42, 0.06);

  --fs: 1;
  --f-2xs: calc(10.5px * var(--fs));
  --f-xs: calc(11.5px * var(--fs));
  --f-sm: calc(12.5px * var(--fs));
  --f-md: calc(13.5px * var(--fs));
  --f-lg: calc(15.5px * var(--fs));
  --f-xl: calc(18px * var(--fs));

  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --r-xs: 5px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --top-h: 108px;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-canvas: #0B0F17;
  --bg-surface: #121824;
  --bg-subtle: #171F2E;
  --bg-muted: #1E293B;
  --bg-hover: #1C2638;
  --bg-glass: rgba(18, 24, 36, 0.86);

  --ink-1: #F1F5F9;
  --ink-2: #CBD5E1;
  --ink-3: #94A3B8;
  --ink-4: #64748B;

  --line-1: #1E293B;
  --line-2: #334155;
  --line-focus: #60A5FA;

  --accent: #3B82F6;
  --accent-hover: #60A5FA;
  --accent-soft: rgba(59, 130, 246, 0.15);
  --accent-border: rgba(96, 165, 250, 0.35);
  --accent-ink: #93C5FD;

  --ok: #34D399;
  --ok-soft: rgba(16, 185, 129, 0.14);
  --ok-ink: #6EE7B7;

  --warn: #FBBF24;
  --warn-soft: rgba(245, 158, 11, 0.13);
  --warn-border: rgba(245, 158, 11, 0.35);
  --warn-ink: #FCD34D;

  --danger: #F87171;
  --danger-soft: rgba(239, 68, 68, 0.14);
  --danger-ink: #FCA5A5;

  --slot-bg-s: -8%;   --slot-bg-l: 22%;
  --slot-card-s: -12%; --slot-card-l: 17%;
  --slot-fg-s: 18%;   --slot-fg-l: 80%;
  --slot-bd-s: 8%;    --slot-bd-l: 56%;

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.32);
  --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.65);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg-canvas);
  color: var(--ink-1);
  font-family: var(--sans);
  font-size: var(--f-md);
  line-height: 1.48;
  letter-spacing: -0.012em;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; font-variant-numeric: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
h1, h2, h3, h4, p, dl, dd { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--line-focus); outline-offset: 2px; border-radius: var(--r-xs); }

mark {
  background: #FEF08A;
  color: #0F172A;
  padding: 0 2px;
  border-radius: 3px;
  font-weight: 700;
}
:root[data-theme="dark"] mark {
  background: rgba(250, 204, 21, 0.32);
  color: #FEF9C3;
}

.ico {
  width: 15px;
  height: 15px;
  flex: none;
  stroke: currentColor;
  stroke-width: 1.85;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
.ico-sm { width: 13px; height: 13px; }
.ico-lg { width: 18px; height: 18px; }
.spin { animation: spin 0.85s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- 공통 버튼 & 입력 ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 11px;
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  background: var(--bg-surface);
  color: var(--ink-1);
  font-size: var(--f-sm);
  font-weight: 600;
  white-space: nowrap;
  box-shadow: var(--shadow-xs);
  transition: background 0.14s, border-color 0.14s, color 0.14s, transform 0.08s;
}
.btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--line-2); }
.btn:active:not(:disabled) { transform: translateY(0.5px); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #FFFFFF;
  box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
}
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost {
  border-color: transparent;
  background: transparent;
  box-shadow: none;
  color: var(--ink-2);
}
.btn-ghost:hover:not(:disabled) { background: var(--bg-muted); color: var(--ink-1); border-color: transparent; }
.btn-icon { width: 32px; padding: 0; }
.btn-sm { height: 27px; padding: 0 9px; font-size: var(--f-xs); border-radius: 6px; }

.fld {
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  background: var(--bg-surface);
  color: var(--ink-1);
  font-size: var(--f-sm);
  transition: border-color 0.14s, box-shadow 0.14s;
}
.fld:hover { border-color: var(--line-2); }
.fld:focus { outline: none; border-color: var(--line-focus); box-shadow: 0 0 0 3px var(--accent-soft); }

/* 세그먼트 & 토글 칩 */
.seg {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  gap: 2px;
  background: var(--bg-muted);
  border-radius: var(--r-sm);
  border: 1px solid var(--line-1);
  flex-wrap: wrap;
}
.seg button {
  height: 26px;
  padding: 0 10px;
  border-radius: 6px;
  font-size: var(--f-xs);
  font-weight: 600;
  color: var(--ink-3);
  transition: background 0.14s, color 0.14s, box-shadow 0.14s;
  white-space: nowrap;
}
.seg button:hover { color: var(--ink-1); }
.seg button[aria-pressed="true"] {
  background: var(--bg-surface);
  color: var(--ink-1);
  font-weight: 700;
  box-shadow: var(--shadow-xs);
}

.opts {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.opts button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid var(--line-1);
  background: var(--bg-surface);
  font-size: var(--f-xs);
  font-weight: 600;
  color: var(--ink-3);
  transition: all 0.14s;
}
.opts button:hover { border-color: var(--line-2); color: var(--ink-1); }
.opts button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: var(--accent-ink);
}

/* 슬롯 태그 */
.tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 19px;
  padding: 0 5px;
  border-radius: 4px;
  font-size: var(--f-2xs);
  font-weight: 800;
  letter-spacing: 0.01em;
  white-space: nowrap;
  flex: none;
  background: hsl(var(--dh, 212) calc(var(--ds, 10%) + var(--slot-bg-s)) var(--slot-bg-l));
  color: hsl(var(--dh, 212) calc(var(--ds, 10%) + var(--slot-fg-s)) var(--slot-fg-l));
  border: 1px solid hsl(var(--dh, 212) calc(var(--ds, 10%) + var(--slot-bg-s)) calc(var(--slot-bg-l) - 6%));
}
:root[data-theme="dark"] .tag {
  border-color: hsl(var(--dh, 212) calc(var(--ds, 10%) + var(--slot-bg-s)) calc(var(--slot-bg-l) + 8%));
}
.cm {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  margin-right: 5px;
  background: hsl(var(--dh, 212) calc(var(--ds, 10%) + var(--slot-bd-s)) var(--slot-bd-l));
}

/* ---- 상단 앱 헤더 ---- */
.top {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-1);
}
.bar-main {
  max-width: 1640px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  min-height: 54px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-right: 4px;
  flex: none;
}
.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #4F46E5);
  color: #fff;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
}
.brand-title {
  font-size: var(--f-lg);
  font-weight: 800;
  letter-spacing: -0.03em;
}

/* 동기화 상태 칩 */
.health-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: var(--f-2xs);
  font-weight: 600;
  border: 1px solid var(--line-1);
  background: var(--bg-surface);
  color: var(--ink-2);
  white-space: nowrap;
}
.health-pill:hover { border-color: var(--line-2); background: var(--bg-hover); }
.health-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ok);
  flex: none;
}
.health-pill.is-warn {
  background: var(--warn-soft);
  border-color: var(--warn-border);
  color: var(--warn-ink);
}
.health-pill.is-warn .health-dot { background: var(--warn); }
.health-pill.is-loading .health-dot { background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* 메인 탭 */
.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  background: var(--bg-muted);
  border: 1px solid var(--line-1);
  border-radius: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding: 0 12px;
  border-radius: 7px;
  font-size: var(--f-sm);
  font-weight: 600;
  color: var(--ink-2);
  white-space: nowrap;
  transition: all 0.14s;
}
.tabs button:hover { color: var(--ink-1); }
.tabs button[aria-current="page"] {
  background: var(--bg-surface);
  color: var(--accent);
  font-weight: 700;
  box-shadow: var(--shadow-xs);
}
.tabs .k-hint {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-4);
  opacity: 0.75;
}
.tabs button[aria-current="page"] .k-hint { color: var(--accent); opacity: 0.7; }

.grow { flex: 1; }

/* 검색 입력창 */
.search-box {
  position: relative;
  display: flex;
  align-items: center;
  width: clamp(170px, 19vw, 270px);
}
.search-box .ico-search {
  position: absolute;
  left: 10px;
  color: var(--ink-4);
  pointer-events: none;
}
.search-box input {
  width: 100%;
  padding-left: 31px;
  padding-right: 54px;
  background: var(--bg-subtle);
}
.search-box input:focus { background: var(--bg-surface); }
.search-meta {
  position: absolute;
  right: 7px;
  display: flex;
  align-items: center;
  gap: 4px;
  pointer-events: none;
}
.search-count {
  font-size: var(--f-2xs);
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 1px 5px;
  border-radius: 4px;
}
.kbd-badge {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-4);
  border: 1px solid var(--line-1);
  background: var(--bg-surface);
  padding: 1px 5px;
  border-radius: 4px;
}

/* 서브 컨텍스트 툴바 */
.bar-sub-wrap {
  border-top: 1px solid var(--line-1);
  background: var(--bg-surface);
}
.bar-sub {
  max-width: 1640px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  min-height: 44px;
  flex-wrap: wrap;
}

/* 알림 배너 */
.banner-wrap {
  max-width: 1640px;
  margin: 10px auto 0;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-radius: var(--r-sm);
  font-size: var(--f-sm);
  font-weight: 500;
  background: var(--warn-soft);
  border: 1px solid var(--warn-border);
  color: var(--warn-ink);
  box-shadow: var(--shadow-xs);
}
.banner p { flex: 1; overflow-wrap: anywhere; }

/* ---- 메인 컨테이너 ---- */
main {
  max-width: 1640px;
  margin: 0 auto;
  padding: 16px;
}

/* 요약 메트릭 바 */
.metrics {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.metric-card {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  padding: 7px 13px;
  background: var(--bg-surface);
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-xs);
  font-size: var(--f-xs);
  color: var(--ink-3);
}
.metric-card b {
  font-size: var(--f-md);
  font-weight: 800;
  color: var(--ink-1);
}

/* 스플릿 레이아웃 (교사, 장소, 명렬표용) */
.split {
  display: grid;
  grid-template-columns: 268px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.dir-panel {
  position: sticky;
  top: calc(var(--top-h) + 14px);
  background: var(--bg-surface);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-xs);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100dvh - var(--top-h) - 30px);
}
.dir-head {
  padding: 10px;
  border-bottom: 1px solid var(--line-1);
  background: var(--bg-subtle);
}
.dir-head input { width: 100%; height: 30px; font-size: var(--f-xs); }
.dir-list {
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.dir-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 7px 10px;
  border-radius: 7px;
  font-size: var(--f-sm);
  font-weight: 500;
  color: var(--ink-2);
  transition: background 0.12s, color 0.12s;
}
.dir-item:hover { background: var(--bg-hover); color: var(--ink-1); }
.dir-item.is-active {
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 700;
}
.dir-item .dir-sub {
  font-size: var(--f-2xs);
  color: var(--ink-4);
  font-weight: 600;
  flex: none;
}
.dir-item.is-active .dir-sub { color: var(--accent); }
.mobile-picker { display: none; width: 100%; }

/* 섹션 헤더 */
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 18px 0 8px;
}
.sec-head:first-child { margin-top: 0; }
.sec-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--f-md);
  font-weight: 800;
  color: var(--ink-1);
}
.sec-sub {
  font-size: var(--f-xs);
  font-weight: 600;
  color: var(--ink-3);
}

/* 카드 & 테이블 */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-xs);
  overflow: hidden;
  /* clip 은 스크롤 상자를 만들지 않아, 안쪽 표 머리줄(sticky)이 화면을 기준으로 붙는다 */
  overflow: clip;
}
.two-col {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 32rem), 1fr));
  gap: 16px;
  align-items: start;
}

table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th {
  padding: 9px 12px;
  text-align: left;
  background: var(--bg-subtle);
  color: var(--ink-3);
  font-size: var(--f-xs);
  font-weight: 700;
  border-bottom: 1px solid var(--line-1);
  white-space: nowrap;
}
.sticky-th th {
  position: sticky;
  top: var(--top-h, 0px);
  z-index: 5;
}
td {
  padding: 8px 12px;
  vertical-align: middle;
  border-bottom: 1px solid var(--line-1);
  font-size: var(--f-sm);
  overflow-wrap: anywhere;
}
.card tr:last-child td { border-bottom: 0; }
.row-hit { cursor: pointer; transition: background 0.1s; }
.row-hit:hover { background: var(--bg-hover); }
.inline-link {
  color: inherit;
  font-weight: 500;
  border-radius: 3px;
  transition: color 0.12s;
}
.inline-link:hover {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.num { text-align: right; white-space: nowrap; }
.muted { color: var(--ink-4); font-size: var(--f-xs); }

.c-s { width: 58px; }
.c-id { width: 82px; }
.c-n { width: 98px; }
.c-p { width: 124px; }
.c-r { width: 148px; }
.c-c { width: 68px; }

.nowrap-cells td {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 슬롯 바로가기 바 */
.slot-jump {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.slot-jump a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 24px;
  padding: 0 6px;
  border-radius: 5px;
  font-size: var(--f-xs);
  font-weight: 700;
  text-decoration: none;
  background: var(--bg-surface);
  border: 1px solid var(--line-1);
  color: var(--ink-2);
  transition: all 0.12s;
}
.slot-jump a:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ---- 주간 시간표 그리드 ---- */
.tt {
  display: grid;
  grid-auto-flow: column;
  grid-template-columns: 46px;
  grid-auto-columns: minmax(0, 1fr);
  grid-template-rows: 36px repeat(var(--p, 7), minmax(52px, auto));
  gap: 1px;
  background: var(--line-1);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-xs);
  overflow: hidden;
}
.tt-h, .tt-d {
  background: var(--bg-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: var(--f-xs);
  font-weight: 700;
  color: var(--ink-2);
}
.tt-d.is-today {
  color: var(--accent);
  background: var(--accent-soft);
}
.tt-d.is-today::after {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}
.tt-p {
  background: var(--bg-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--f-xs);
  font-weight: 700;
  color: var(--ink-3);
}
.tt-c {
  background: var(--bg-surface);
  padding: 4px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  justify-content: center;
}
.tt-c.tt-x {
  background: var(--bg-surface);
}
.tt-c.has-clash {
  background: var(--warn-soft);
}

/* 시간표 수업 블록 */
.cx {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 4px 7px;
  border-radius: 6px;
  overflow: hidden;
  border-left: 3px solid hsl(var(--dh, 212) calc(var(--ds, 10%) + var(--slot-bd-s)) var(--slot-bd-l));
  background: hsl(var(--dh, 212) calc(var(--ds, 10%) + var(--slot-card-s)) var(--slot-card-l));
  transition: filter 0.12s;
}
.cx:hover { filter: brightness(0.98); }
:root[data-theme="dark"] .cx:hover { filter: brightness(1.12); }

.cx-top {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}
.cx-h {
  flex: 1 1 auto;
  min-width: 0;
  text-align: left;
  font-size: var(--f-sm);
  font-weight: 700;
  color: var(--ink-1);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
button.cx-h:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.cx i {
  display: block;
  min-width: 0;
  font-style: normal;
  font-size: var(--f-2xs);
  color: var(--ink-2);
  line-height: 1.32;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cx i button { display: inline; color: inherit; }
.cx i button:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.cx.multi { padding: 5px 7px; }
.cx.multi i { white-space: normal; overflow: visible; margin-top: 2px; }
.cx-d {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  gap: 1px 6px;
  align-items: baseline;
  font-size: var(--f-2xs);
}
.cx-d span:first-child { font-weight: 700; color: var(--ink-3); }
.cx-d span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; color: var(--ink-3); }

/* ---- 명렬표(출석부) 그리드 ---- */
.rt-wrap {
  background: var(--bg-surface);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-xs);
  overflow: auto;
  max-height: calc(100dvh - var(--top-h) - 160px);
}
.rt-wrap table { table-layout: fixed; min-width: 680px; }
.rt-wrap th {
  position: sticky;
  top: 0;
  z-index: 4;
  border-bottom: 1px solid var(--line-2);
  border-right: 1px solid var(--line-1);
  text-align: center;
  padding: 6px 4px;
}
.rt-wrap td {
  border-right: 1px solid var(--line-1);
  border-bottom: 1px solid var(--line-1);
  text-align: center;
  height: 32px;
  padding: 2px 4px;
  font-size: var(--f-sm);
}
.rt-wrap th:last-child, .rt-wrap td:last-child { border-right: 0; }
.rt-wrap tbody tr:last-child td { border-bottom: 0; }
.rt-wrap .hd { padding: 2px; background: var(--bg-subtle); }
.rt-wrap .hd input {
  width: 100%;
  height: 26px;
  padding: 0 3px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  text-align: center;
  font-size: var(--f-xs);
  font-weight: 700;
  color: var(--ink-1);
}
.rt-wrap .hd input:hover { background: var(--bg-surface); border-color: var(--line-1); }
.rt-wrap .hd input:focus { outline: 0; background: var(--bg-surface); border-color: var(--accent); }
.rt-wrap .hd input::placeholder { color: var(--ink-4); font-weight: 500; }
.rt-wrap .c-1 { width: 44px; color: var(--ink-3); font-size: var(--f-xs); }
.rt-wrap .c-2 { width: 74px; font-weight: 600; }
.rt-wrap .c-3 { width: 84px; font-weight: 700; }

/* 칩 리스트 */
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chips > b { font-size: var(--f-xs); font-weight: 700; color: var(--ink-3); margin-right: 3px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border: 1px solid var(--line-1);
  border-radius: 999px;
  background: var(--bg-surface);
  font-size: var(--f-xs);
  font-weight: 600;
  color: var(--ink-2);
  transition: all 0.12s;
}
button.chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* 빈 상태 & 스켈레톤 */
.empty-state {
  padding: 56px 20px;
  text-align: center;
  background: var(--bg-surface);
  border: 1px dashed var(--line-2);
  border-radius: var(--r-md);
  color: var(--ink-3);
}
.empty-state h3 { font-size: var(--f-md); font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
.empty-state p { font-size: var(--f-sm); }

.skel-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 20px;
  background: var(--bg-surface);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
}
.skel-line {
  height: 16px;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--bg-muted) 25%, var(--bg-hover) 50%, var(--bg-muted) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ---- 다이얼로그 & 슬라이드 인스펙터 드로어 ---- */
dialog {
  padding: 0;
  border: 1px solid var(--line-1);
  background: var(--bg-surface);
  color: var(--ink-1);
  box-shadow: var(--shadow-lg);
}
dialog::backdrop {
  background: rgba(9, 13, 22, 0.48);
  backdrop-filter: blur(3px);
}
dialog[open] { display: flex; flex-direction: column; }

/* 우측 슬라이드 드로어 (#ddlg) */
#ddlg {
  margin: 0 0 0 auto;
  width: min(640px, 100vw);
  height: 100dvh;
  max-height: 100dvh;
  border-radius: var(--r-lg) 0 0 var(--r-lg);
  border-right: 0;
}
/* 중앙 모달 (인쇄, 점검, 설정, 퀵점프) */
.modal-center {
  margin: auto;
  width: min(720px, calc(100vw - 24px));
  max-height: 88dvh;
  border-radius: var(--r-lg);
}
#pdlg { width: min(980px, calc(100vw - 24px)); }
#kdlg { width: min(560px, calc(100vw - 24px)); margin: 9vh auto auto; max-height: 76dvh; }

.dh {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-1);
  background: var(--bg-subtle);
}
.dh h2 {
  font-size: var(--f-lg);
  font-weight: 800;
  margin-right: auto;
  overflow-wrap: anywhere;
}
.db {
  padding: 16px 18px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}
.db h3 {
  font-size: var(--f-xs);
  font-weight: 800;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  margin: 18px 0 8px;
}
.db h3:first-child { margin-top: 0; }
.df {
  padding: 12px 18px;
  border-top: 1px solid var(--line-1);
  background: var(--bg-subtle);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* 상세 프로필 그리드 */
.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.meta-item {
  padding: 9px 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
}
.meta-item dt { font-size: var(--f-2xs); font-weight: 700; color: var(--ink-3); margin-bottom: 2px; }
.meta-item dd { font-size: var(--f-sm); font-weight: 700; color: var(--ink-1); }

/* 반별 분포 미니 바 */
.dist-bars {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 10px 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
}
.dist-row {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) 36px;
  align-items: center;
  gap: 8px;
  font-size: var(--f-xs);
}
.dist-track {
  height: 7px;
  background: var(--bg-muted);
  border-radius: 99px;
  overflow: hidden;
}
.dist-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
}

/* ---- 커맨드 팔레트 (#kdlg) ---- */
.cmd-input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-1);
}
.cmd-input-wrap input {
  flex: 1;
  border: 0;
  background: transparent;
  font-size: var(--f-lg);
  font-weight: 600;
  color: var(--ink-1);
  outline: none;
}
.cmd-list {
  padding: 8px;
  overflow-y: auto;
  max-height: 56dvh;
}
.cmd-group-label {
  padding: 6px 10px 4px;
  font-size: var(--f-2xs);
  font-weight: 800;
  color: var(--ink-4);
}
.cmd-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  text-align: left;
  font-size: var(--f-sm);
}
.cmd-item:hover, .cmd-item.is-sel {
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.cmd-item-sub { font-size: var(--f-xs); color: var(--ink-3); }

/* ---- 데이터 출처 & 정합성 점검 모달 (#hdlg) ---- */
.src-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 8px;
}
.src-card {
  padding: 10px 12px;
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  background: var(--bg-subtle);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.src-card-top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: var(--f-sm); }
.src-card-meta { font-size: var(--f-xs); color: var(--ink-3); }
.src-card.is-err { border-color: var(--danger); background: var(--danger-soft); }
.issue-box {
  margin-top: 12px;
  padding: 12px;
  border-radius: var(--r-sm);
  background: var(--warn-soft);
  border: 1px solid var(--warn-border);
  color: var(--warn-ink);
  font-size: var(--f-xs);
}
.issue-box ul {
  margin-top: 6px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 3px 14px;
}

/* ---- 설정 ---- */
.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-1);
  font-size: var(--f-sm);
}
.set-row > span { font-weight: 600; color: var(--ink-2); }
.keys-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 7px 14px;
  font-size: var(--f-xs);
}
.keys-grid div { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
kbd {
  font: inherit;
  font-size: var(--f-2xs);
  font-weight: 700;
  min-width: 22px;
  text-align: center;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 1px 5px;
  background: var(--bg-subtle);
  color: var(--ink-1);
}

/* ---- 인쇄 스튜디오 ---- */
.plan {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  gap: 16px;
}
.view-desk {
  background: var(--bg-muted);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  padding: 14px;
  overflow: hidden;
  display: flex;
  align-items: flex-start;
}
.stage {
  background: #fff;
  position: relative;
  flex: none;
  transform-origin: top left;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
}
.pset {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.pset-group {
  padding: 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.pset-label { font-size: var(--f-xs); font-weight: 800; color: var(--ink-3); margin-bottom: 2px; }
.chk {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 2px;
  font-size: var(--f-sm);
  cursor: pointer;
}
.chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); flex: none; }
.fit { font-size: var(--f-sm); color: var(--ink-2); flex: 1; font-weight: 600; }
.fit.tight { color: var(--warn-ink); }

/* 실제 인쇄 종이(A4) 스타일 — 다크모드 무관 항상 화이트/블랙 고정 */
.paper {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: top left;
  color: #111;
  background: #fff;
  font-family: var(--sans);
  font-size: var(--pf, 10pt);
  line-height: 1.24;
}
.paper h1 { font-size: 1.48em; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 1.5mm; text-align: center; }
.paper .ps { text-align: center; font-size: 0.9em; margin: 0 0 2.2mm; color: #333; }
.paper table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: inherit; }
.paper th, .paper td {
  border: 0.5pt solid #555;
  padding: var(--pp, 1.4px) 3px;
  line-height: 1.2;
  vertical-align: middle;
  overflow-wrap: anywhere;
  position: static;
  background: none;
  text-align: center;
  color: #111;
}
.paper th { background: #EDEDED; font-weight: 700; font-size: 0.9em; }
.paper td.l { text-align: left; }
.paper tbody tr { height: var(--pr, auto); }
.paper .pn { color: #888; }
.paper .pf { margin-top: 1.6mm; display: flex; justify-content: space-between; font-size: 0.74em; color: #555; }
.ptt {
  display: grid;
  grid-auto-flow: column;
  grid-template-columns: 11mm;
  grid-auto-columns: minmax(0, 1fr);
  border: 0.5pt solid #555;
  border-width: 0.5pt 0 0 0.5pt;
}
.ptt > div { border: 0.5pt solid #555; border-width: 0 0.5pt 0.5pt 0; padding: 0.8mm 1mm; overflow: hidden; }
.ptt .h { background: #EDEDED; text-align: center; font-weight: 700; font-size: 0.9em; }
.ptt .p { background: #F6F6F6; text-align: center; font-weight: 700; font-size: 0.86em; display: flex; align-items: center; justify-content: center; }
.ptt .c { min-height: var(--pr, 14mm); }
.ptt .c b { display: block; font-weight: 700; }
.ptt .c i { display: block; font-style: normal; font-size: 0.83em; color: #333; }
.pe { display: block; }
.pe + .pe { margin-top: 0.6mm; padding-top: 0.6mm; border-top: 0.4pt dotted #aaa; }

/* 토스트 */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 100;
  max-width: calc(100vw - 32px);
  padding: 9px 16px;
  border-radius: 999px;
  background: var(--ink-1);
  color: var(--bg-surface);
  font-size: var(--f-sm);
  font-weight: 600;
  box-shadow: var(--shadow-md);
}

/* 푸터 요약 바 */
.foot-bar {
  max-width: 1640px;
  margin: 24px auto 16px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: var(--f-xs);
  color: var(--ink-4);
}

/* ---- 반응형 ---- */
@media (max-width: 960px) {
  .bar-main { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
  .tabs { order: 3; width: 100%; justify-content: flex-start; }
  .tabs .k-hint { display: none; }
  .search-box { flex: 1; min-width: 150px; }
  .search-box input { font-size: 16px; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .dir-panel { display: none; }
  .mobile-picker { display: flex; align-items: center; gap: 8px; }
  .mobile-picker select { flex: 1; font-size: 16px; }
  .plan { grid-template-columns: minmax(0, 1fr); }
  .pset { order: -1; }
}

@media (max-width: 720px) {
  main { padding: 12px; }
  .bar-sub { padding: 7px 12px; }
  .hide-s { display: none !important; }
  #ddlg { width: 100vw; border-radius: 0; }

  /* 모바일 시간표: 요일별 깔끔한 아젠다 뷰 */
  .tt { display: block; background: var(--bg-surface); }
  .tt-h, .tt-p, .tt-c.tt-x { display: none; }
  .tt-d {
    justify-content: flex-start;
    padding: 8px 12px;
    border-top: 1px solid var(--line-1);
    font-size: var(--f-sm);
  }
  .tt > .tt-d:first-of-type { border-top: 0; }
  .tt-d[data-none]::after {
    content: "· " attr(data-none);
    color: var(--ink-4);
    font-weight: 500;
    width: auto;
    height: auto;
    background: none;
  }
  .tt-c {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 4px 8px;
    padding: 6px 12px;
    border-top: 1px solid var(--line-1);
  }
  .tt-c::before {
    content: attr(data-p);
    grid-column: 1;
    grid-row: 1 / -1;
    font-size: var(--f-xs);
    font-weight: 700;
    color: var(--ink-3);
    padding-top: 4px;
  }
  .tt-c > * { grid-column: 2; }

  /* 모바일 카드형 테이블 */
  .card table, .card tbody { display: block; width: 100%; }
  .card thead { display: none; }
  .card tbody tr {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 3px 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-1);
  }
  .card tbody tr:last-child { border-bottom: 0; }
  .card td { display: block; grid-column: 1; border: 0; padding: 0; width: auto; }

<script>
"use strict";

/* ============ 설정 및 상수 ============ */
const CONFIG = Object.freeze({
  SHEET_ID: "14E6B2_Idhly1Dmh33HTf0FYQFMKkxLSC1POzcAxr_vQ",
  SHEETS: [
    { key:"s2",     gid:"0",          name:"2학년 신청",  kind:"student", grade:2 },
    { key:"s3",     gid:"1935968761", name:"3학년 신청",  kind:"student", grade:3 },
    { key:"lesson", gid:"1926478023", name:"반별시간표",  kind:"lesson" },
    { key:"time",   gid:"863995751",  name:"슬롯시간",    kind:"time" },
    { key:"c2",     gid:"606989081",  name:"2학년 강좌표", kind:"course", grade:2, lastRow:16, lastCol:"P" },
    { key:"c3",     gid:"44867740",   name:"3학년 강좌표", kind:"course", grade:3, lastRow:40, lastCol:"AF" }
  ],
  POLL_MS: 600000, LOAD_MS: 20000
});

const SLOTS = [
  ["A",214,65],["B",152,58],["C",26,72],["D",278,56],["E",190,64],["F",96,52],
  ["G",338,62],["H",248,58],["I",42,72],["J",168,58],["K",310,54],["L",10,68],
  ["M",228,60],["N",132,54],["O",58,64],["P",294,52],["Q",198,62],["R",82,54],
  ["S",262,54],["T",352,64],["U",140,54],["V",322,56],["W",178,58]
];
const SLOT_TONE = new Map(SLOTS.map(([n, h, s]) => [n, `--dh:${h};--ds:${s}%`]));
const FLAT = "--dh:215;--ds:8%";
const tone = s => SLOT_TONE.get(String(s || "").trim().charAt(0).toUpperCase()) || FLAT;
const SPECIAL = { "자율활동":"--dh:38;--ds:70%", "자습":"--dh:246;--ds:50%" };

const DAYS = ["월","화","수","목","금"];
const DAY_IX = new Map(DAYS.map((d, i) => [d, i]));
const TODAY_NAME = ["일","월","화","수","목","금","토"][new Date().getDay()];

const VIEWS = {
  student:{ label:"학생",   paper:false },
  course: { label:"강좌",   paper:true  },
  klass:  { label:"학급",   paper:true  },
  teacher:{ label:"교사",   paper:true  },
  room:   { label:"장소",   paper:true  },
  roster: { label:"명렬표", paper:true  }
};
const VK = Object.keys(VIEWS);
const HEADS = {
  date: ["날짜 기록", i => ""],
  perf: ["수행평가", i => `수행 ${i + 1}`],
  unit: ["단원별",   i => `${i + 1}단원`],
  free: ["자유 입력", i => ""]
};
const PREFS = "sk-prefs-v1", CACHE = "sk-cache-v1";

/* ============ 유틸 & 한글 초성 엔진 ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uniq = a => [...new Set(a)];
const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : 0; };
const read = (k, f) => { try{ const r = localStorage.getItem(k); return r == null ? f : (JSON.parse(r) ?? f); }catch{ return f; } };
const write = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } };

const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const toChosung = str => {
  let out = "";
  for(let i = 0; i < str.length; i++){
    const code = str.charCodeAt(i) - 0xAC00;
    out += (code >= 0 && code <= 11171) ? CHO[Math.floor(code / 588)] : str[i];
  }
  return out;
};
const hasChosung = s => /[ㄱ-ㅎ]/.test(s);

function cell(row, i){
  const c = row?.c?.[i];
  if(!c || c.v == null) return "";
  return String(c.f ?? c.v).trim();
}
const nSlot = v => String(v || "").trim().replace(/\s+/g, "").toUpperCase();
const nSubj = v => String(v || "").trim().replace(/\s+/g, "");
const ckey = (grade, slot, subject) => `${grade}\u0000${nSlot(slot)}\u0000${nSubj(subject)}`;
const gLabel = g => `${g}학년`;

const teachersOf = v => String(v || "").split(/[\/／]/).map(x => x.trim()).filter(Boolean);
const hasTeacher = (v, t) => teachersOf(v).includes(t);
const shareTeacher = (a, b) => { const r = new Set(teachersOf(b)); return teachersOf(a).some(x => r.has(x)); };
const realTeacher = t => t && t !== "미정";

function room(value, grade, ban){
  const r = String(value || "").trim().replace(/\s+/g, " ");
  if(!r) return "";
  const b = num(ban);
  if(r === "반" && grade && b) return `${grade}학년 ${b}반`;
  let m = r.match(/^(\d+)\s*[-–]\s*(\d+)$/);
  if(m) return `${m[1]}학년 ${num(m[2])}반`;
  m = r.match(/^(\d+)\s*학년\s*(\d+)\s*반$/);
  if(m) return `${m[1]}학년 ${num(m[2])}반`;
  m = r.match(/^(\d+)\s*반$/);
  if(m && grade) return `${grade}학년 ${num(m[1])}반`;
  return r;
}

function inferBans(grade, ban, subject){
  const s = nSubj(subject), b = String(ban || "");
  if((grade === 1 && s === "공통수학2") || (grade === 2 && s === "미적분Ⅰ")){
    if(["1","6"].includes(b)) return [1];
    if(["2","3","7"].includes(b)) return [2,3];
    if(["4","5","8"].includes(b)) return [4,5];
  }
  if((grade === 1 && s === "공통영어2") || (grade === 2 && s === "영어Ⅱ")){
    if(["1","2","6"].includes(b)) return [1,2];
    if(["3","4","7"].includes(b)) return [3,4];
    if(["5","8"].includes(b)) return [5];
  }
  return [];
}
const forClass = (r, ban) => r.bans.length ? r.bans.includes(num(ban)) : r.ban === num(ban);

const SPLIT = {
  "공통수학2":{ "1":[1,6], "2,3":[2,3,7], "4,5":[4,5,8] },
  "미적분Ⅰ":{ "1":[1,6], "2,3":[2,3,7], "4,5":[4,5,8] },
  "공통영어2":{ "1,2":[1,2,6], "3,4":[3,4,7], "5":[5,8] },
  "영어Ⅱ":{ "1,2":[1,2,6], "3,4":[3,4,7], "5":[5,8] }
};
function splitNo(e){
  if(!e.bans.length || !e.ban) return e.ban || "";
  const order = SPLIT[nSubj(e.subject)]?.[[...e.bans].sort((a, b) => a - b).join(",")] || [];
  const i = order.indexOf(num(e.ban));
  return i >= 0 ? i + 1 : e.ban;
}
const mergeable = list => list.length > 1 && list.every(e => !e.slot && e.bans.length)
  && list.every(e => nSubj(e.subject) === nSubj(list[0].subject));

/* CSV 내보내기 헬퍼 (엑셀 한글 호환 UTF-8 BOM) */
function downloadCSV(filename, rows){
  const csv = "\uFEFF" + rows.map(r => r.map(v => {
    const s = String(v ?? "").replace(/"/g, '""');
    return /[",\n\r]/.test(s) ? `"${s}"` : s;
  }).join(",")).join("\r\n");
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`${filename} 파일을 저장했습니다`);
}

/* ============ 상태 ============ */
const S = {
  view:"student", q:"", dirQ:"",
  theme:"system", fs:1,
  grade0:0,
  grade:2,
  cg:2, ban:0,
  teacher:"", room:"", course:"",
  cols:10, head:"date",
  show:{ teacher:true, room:true },
  print:{ teacher:true, room:true, count:true }
};
let heads = [];

function loadPrefs(){
  const p = read(PREFS, {}) || {};
  if(Object.hasOwn(VIEWS, p.view)) S.view = p.view;
  if(["light","dark","system"].includes(p.theme)) S.theme = p.theme;
  if([0.92,1,1.1,1.22].includes(p.fs)) S.fs = p.fs;
  if([0,2,3].includes(p.grade0)) S.grade0 = p.grade0;
  if([2,3].includes(p.grade)) S.grade = p.grade;
  if([1,2,3].includes(p.cg)) S.cg = p.cg;
  if(Number.isInteger(p.ban) && p.ban >= 0 && p.ban <= 20) S.ban = p.ban;
  if(typeof p.teacher === "string") S.teacher = p.teacher;
  if(typeof p.room === "string") S.room = p.room;
  if(typeof p.course === "string") S.course = p.course;
  if(Number.isInteger(p.cols) && p.cols >= 1 && p.cols <= 30) S.cols = p.cols;
  if(Object.hasOwn(HEADS, p.head)) S.head = p.head;
  for(const g of ["show", "print"])
    for(const k of Object.keys(S[g])) if(typeof p[g]?.[k] === "boolean") S[g][k] = p[g][k];
  if(Array.isArray(p.heads)) heads = p.heads.map(x => String(x ?? "")).slice(0, 30);
}
const savePrefs = () => write(PREFS, {
  view:S.view, theme:S.theme, fs:S.fs, grade0:S.grade0, grade:S.grade, cg:S.cg, ban:S.ban,
  teacher:S.teacher, room:S.room, course:S.course, cols:S.cols, head:S.head, heads,
  show:S.show, print:S.print
});
function applyPrefs(){
  const dark = S.theme === "dark" || (S.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.style.setProperty("--fs", String(S.fs));
}

/* ============ 구글 시트 데이터 엔진 ============ */
const RAW = { s2:[], s3:[], lesson:[], time:[], c2:[], c3:[] };
const M = { students:[], courses:[], lessons:[], times:[] };
const IX = { student:new Map(), course:new Map(), byKey:new Map(), teachers:[], rooms:[], classes:new Map() };
const SRC = Object.fromEntries(CONFIG.SHEETS.map(x =>
  [x.key, { name:x.name, gid:x.gid, rows:0, at:0, error:"", flags:[] }]));
const CROSS = [];
let GAP = "", gapShut = false;
const sheetLink = gid => `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/edit#gid=${gid}`;

function validate(raw){
  if(!raw || !["ok", "warning"].includes(raw.status)){
    const said = (raw?.errors || [])
      .map(e => String(e?.detailed_message || e?.message || "").trim()).filter(Boolean).join(" / ");
    throw new Error(said || "시트 응답이 아닙니다 (접근 권한을 확인해 주세요)");
  }
  const t = raw.table;
  if(!t || !Array.isArray(t.cols) || !Array.isArray(t.rows) || !t.rows.every(r => r && Array.isArray(r.c)))
    throw new Error("시트 구조를 읽을 수 없습니다");
  return t;
}

function fetchTable({ gid, range = "", headers = true }){
  return new Promise((res, rej) => {
    const cb = `sk_${gid}_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const el = document.createElement("script");
    let done = false;
    const end = (err, raw) => {
      if(done) return;
      done = true;
      clearTimeout(t); el.remove(); window[cb] = () => {};
      setTimeout(() => { delete window[cb]; }, 60000);
      err ? rej(err) : res(raw);
    };
    const t = setTimeout(() => end(new Error("응답 시간 초과")), CONFIG.LOAD_MS);
    window[cb] = raw => { try{ end(null, validate(raw)); }catch(err){ end(err); } };
    el.onerror = () => end(new Error("연결하지 못했습니다"));
    el.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`
      + `?tqx=out:json;responseHandler:${cb}&gid=${gid}`
      + (range ? `&range=${encodeURIComponent(range)}` : "")
      + `&headers=${headers ? 1 : 0}&_=${Date.now()}`;
    document.body.appendChild(el);
  });
}

const label = c => String(c?.label ?? "").trim();
const finder = table => {
  const l = (table.cols || []).map(label);
  return name => l.findIndex(x => x === name);
};

function readStudents(sheet, table){
  const head = (table.cols || []).map(label);
  const flags = [], out = [];
  const flag = (n, m) => { if(flags.length < 60) flags.push(`${n + 2}행 · ${m}`); };
  let idI = head.findIndex(h => h.includes("학번"));
  let nameI = head.findIndex(h => h.includes("이름") || h.includes("성명"));
  if(idI < 0) idI = 0;
  if(nameI < 0) nameI = 1;
  const cols = head.map((name, i) => ({ name, i })).filter(c => c.i !== idI && c.i !== nameI && c.name);
  if(!cols.length) throw new Error("과목 열을 찾지 못했습니다");

  table.rows.forEach((r, n) => {
    const id = cell(r, idI), name = cell(r, nameI);
    if(!id && !name) return;
    if(!id || !name){ flag(n, id ? "이름이 비어 있습니다" : "학번이 비어 있습니다"); return; }
    const m = id.match(/^(\d)(\d{2})(\d{2})$/);
    if(!m) flag(n, `학번 형식을 읽을 수 없습니다: ${id}`);
    const subjects = {};
    for(const c of cols){
      const slot = cell(r, c.i);
      if(slot && slot !== "-" && slot !== "0") subjects[c.name] = slot;
    }
    if(!Object.keys(subjects).length){ flag(n, `신청 과목이 없습니다: ${name}`); return; }
    out.push({ id, name, grade:sheet.grade, ban:m ? num(m[2]) : 0, subjects });
  });
  return { items:out, flags };
}

function readLessons(table){
  const at = finder(table);
  const iG = at("학년"), iB = at("반"), iD = at("요일"), iP = at("교시");
  const iS = at("과목"), iT = at("교사"), iL = at("슬롯"), iX = at("대상반");
  const iR = at("수업장소") >= 0 ? at("수업장소") : 7;
  if(iG < 0 || iD < 0 || iP < 0 || iS < 0) throw new Error("학년·요일·교시·과목 열을 찾지 못했습니다");

  const flags = [], out = [];
  const flag = (n, m) => { if(flags.length < 60) flags.push(`${n + 2}행 · ${m}`); };
  table.rows.forEach((r, n) => {
    const grade = num(cell(r, iG)), day = cell(r, iD), period = num(cell(r, iP));
    const subject = cell(r, iS), slot = nSlot(cell(r, iL));
    const ban = slot ? null : num(cell(r, iB));
    if(!grade && !day && !subject) return;
    if(!grade || !DAY_IX.has(day) || !period || !subject){
      flag(n, !DAY_IX.has(day) ? (/^[토일]$/.test(day)
          ? `${day}요일 수업은 시간표에 넣지 않습니다: ${subject || ""}`
          : `요일을 읽을 수 없습니다: ${day || "빈 값"}`)
        : !period ? `교시를 읽을 수 없습니다: ${cell(r, iP) || "빈 값"}`
        : !grade ? "학년을 읽을 수 없습니다" : "과목이 비어 있습니다");
      return;
    }
    if(!slot && !ban){ flag(n, `슬롯도 반도 없습니다: ${subject}`); return; }
    let bans = slot || iX < 0 ? [] : uniq(cell(r, iX).split(/[,，/\s]+/).map(v => parseInt(v, 10)).filter(Number.isFinite));
    if(!slot && !bans.length) bans = inferBans(grade, ban, subject);
    out.push({ grade, ban, bans, day, period, subject,
               teacher:cell(r, iT), slot, room:room(cell(r, iR), grade, ban) });
  });
  return { items:out, flags };
}

function readTimes(table){
  const at = finder(table);
  const iG = at("학년"), iL = at("슬롯"), iD = at("요일"), iP = at("교시");
  if(iG < 0 || iL < 0 || iD < 0 || iP < 0) throw new Error("학년·슬롯·요일·교시 열을 찾지 못했습니다");
  const flags = [], out = [];
  table.rows.forEach((r, n) => {
    const grade = num(cell(r, iG)), slot = nSlot(cell(r, iL));
    const day = cell(r, iD), period = num(cell(r, iP));
    if(!grade && !slot && !day) return;
    if(!grade || !slot || !DAY_IX.has(day) || !period){
      if(flags.length < 60) flags.push(`${n + 2}행 · 학년·슬롯·요일·교시를 읽을 수 없습니다`);
      return;
    }
    out.push({ grade, slot, day, period });
  });
  return { items:out, flags };
}

async function readCourses(sheet){
  const [headTable, metaTable] = await Promise.all([
    fetchTable({ gid:sheet.gid, range:`A1:${sheet.lastCol}1`, headers:false }),
    fetchTable({ gid:sheet.gid, range:`A2:B${sheet.lastRow}`, headers:false })
  ]);
  const headRow = headTable.rows[0];
  const subjects = (headRow?.c || []).map((_, i) => cell(headRow, i));
  const flags = [], groups = [];
  let slot = "";
  metaTable.rows.forEach((r, i) => {
    const found = cell(r, 0);
    if(found) slot = nSlot(found);
    if(slot && cell(r, 1) === "학생수") groups.push({ slot, at:i + 2 });
  });
  if(!groups.length) throw new Error("'학생수' 줄을 찾지 못했습니다 (강좌표 형식 확인)");

  const blocks = await Promise.all(groups.map(g =>
    fetchTable({ gid:sheet.gid, range:`C${g.at}:${sheet.lastCol}${g.at + 2}`, headers:false })
      .then(t => ({ g, t }))));

  const out = [];
  for(const { g, t } of blocks){
    const nRow = t.rows[0], tRow = t.rows[1], rRow = t.rows[2];
    const n = Math.max(tRow?.c?.length || 0, rRow?.c?.length || 0, nRow?.c?.length || 0);
    for(let i = 0; i < n; i++){
      const subject = subjects[i + 2];
      const teacher = cell(tRow, i), place = room(cell(rRow, i), sheet.grade);
      if(!subject || (!teacher && !place)) continue;
      const said = cell(nRow, i);
      out.push({ grade:sheet.grade, slot:g.slot, subject, teacher, room:place,
                 said:/^\d+$/.test(said) ? +said : null });
    }
    if(!n && flags.length < 60) flags.push(`슬롯 ${g.slot} · 교사·장소 줄이 비어 있습니다`);
  }
  return { items:out, flags, rows:metaTable.rows.length };
}

/* ============ 데이터 엮기 및 검증 ============ */
function fillTeachers(){
  for(const r of M.lessons){
    if(!r.slot) continue;
    const base = r.slot.charAt(0);
    const cand = M.courses.filter(c => c.grade === r.grade && nSubj(c.subject) === nSubj(r.subject)
      && (c.slot === r.slot || c.slot.charAt(0) === base));
    let c = cand.find(x => x.slot === r.slot);
    if(!c && r.teacher) c = cand.find(x => shareTeacher(x.teacher, r.teacher));
    if(!c && r.room) c = cand.find(x => x.room === r.room);
    if(!c && cand.length === 1) c = cand[0];
    if(c?.teacher) r.teacher = c.teacher;
  }
}

function fillRooms(){
  for(const c of M.courses){
    const rooms = uniq(lessonsFor(c, { fallback:false, needRoom:true }).map(r => r.room));
    if(rooms.length) c.room = rooms.join(" · ");
  }
}

function lessonsFor(c, { fallback = true, needRoom = false } = {}){
  const base = c.slot.charAt(0);
  let rows = M.lessons.filter(r => r.grade === c.grade && r.slot
    && nSubj(r.subject) === nSubj(c.subject) && (r.slot === c.slot || r.slot === base)
    && (!needRoom || r.room));
  if(c.teacher){
    const t = rows.filter(r => shareTeacher(r.teacher, c.teacher));
    if(t.length) rows = t;
  }
  if(c.room){
    const want = c.room.split(" · ");
    const t = rows.filter(r => want.includes(r.room));
    if(t.length) rows = t;
  }
  if(rows.length) return rows.map(r => ({ ...r, slot:c.slot, course:c }));
  if(!fallback) return [];
  return M.times.filter(t => t.grade === c.grade && t.slot === base).map(t => ({
    grade:c.grade, ban:null, bans:[], day:t.day, period:t.period,
    subject:c.subject, teacher:c.teacher, slot:c.slot, room:c.room, course:c, guess:true
  }));
}

function build(){
  M.students = [...RAW.s2, ...RAW.s3].map(s => ({ ...s })).sort((a, b) => a.id.localeCompare(b.id));
  M.lessons = RAW.lesson.map(r => ({ ...r }));
  M.times = RAW.time;

  const map = new Map();
  for(const c of [...RAW.c2, ...RAW.c3]){
    const k = ckey(c.grade, c.slot, c.subject);
    if(!map.has(k)) map.set(k, { ...c, ghost:false });
  }
  for(const s of M.students)
    for(const [subject, slot] of Object.entries(s.subjects)){
      const k = ckey(s.grade, slot, subject);
      if(!map.has(k)) map.set(k, { grade:s.grade, slot:nSlot(slot), subject, teacher:"", room:"", ghost:true });
    }
  M.courses = [...map.values()].sort((a, b) =>
    a.grade - b.grade || a.slot.localeCompare(b.slot) || a.subject.localeCompare(b.subject));
  for(const c of M.courses){ c.id = `${c.grade}|${c.slot}|${c.subject}`; c.roster = []; }

  IX.byKey = new Map(M.courses.map(c => [ckey(c.grade, c.slot, c.subject), c]));
  IX.course = new Map(M.courses.map(c => [c.id, c]));
  IX.student = new Map(M.students.map(s => [s.id, s]));

  for(const s of M.students){
    s.courses = [];
    for(const [subject, slot] of Object.entries(s.subjects)){
      const c = IX.byKey.get(ckey(s.grade, slot, subject));
      if(!c) continue;
      c.roster.push(s);
      s.courses.push(c);
    }
    s.courses.sort((a, b) => a.slot.localeCompare(b.slot) || a.subject.localeCompare(b.subject));
  }
  for(const c of M.courses) c.count = c.roster.length;

  fillTeachers();
  fillRooms();
  for(const c of M.courses) c.times = lessonsFor(c);

  IX.teachers = uniq([
    ...M.lessons.flatMap(r => teachersOf(r.teacher)),
    ...M.courses.flatMap(c => teachersOf(c.teacher))
  ].filter(realTeacher)).sort((a, b) => a.localeCompare(b, "ko"));
  IX.rooms = uniq([...M.lessons.map(r => r.room), ...M.courses.flatMap(c => c.room.split(" · "))]
    .map(x => String(x || "").trim()).filter(Boolean)).sort((a, b) => a.localeCompare(b, "ko"));

  IX.classes = new Map();
  const put = (g, b) => {
    if(!g || !b) return;
    if(!IX.classes.has(g)) IX.classes.set(g, new Set());
    IX.classes.get(g).add(b);
};
  for(const s of M.students) put(s.grade, s.ban);
  for(const r of M.lessons){
    if(r.slot) continue;
    if(r.bans.length) r.bans.forEach(b => put(r.grade, b));
    else put(r.grade, r.ban);
  }

  /* 선택값이 비어 있을 때 자연스러운 첫 항목 자동 선택 */
  const bans = bansOf(S.cg);
  if(!S.ban && bans.length) S.ban = bans[0];
  if(!S.teacher && IX.teachers.length) S.teacher = IX.teachers[0];
  if(!S.room && IX.rooms.length) S.room = IX.rooms[0];
  if(!S.course && M.courses.length) S.course = M.courses[0].id;

  check();
}

const bansOf = g => [...(IX.classes.get(g) || [])].sort((a, b) => a - b);
const studentsOf = (g, b) => M.students.filter(s => s.grade === g && s.ban === b).sort((a, b2) => a.id.localeCompare(b2.id));

/* 시트 간 정합성 및 충돌 감사 */
function check(){
  CROSS.length = 0;
  const add = t => { if(CROSS.length < 200) CROSS.push(t); };
  const name = c => `${gLabel(c.grade)} ${c.slot} · ${c.subject}`;

  const tally = new Map();
  for(const c of M.courses){
    if(c.said == null) continue;
    const t = tally.get(c.grade) || { said:0, count:0 };
    t.said += c.said; t.count += c.count;
    tally.set(c.grade, t);
  }
  const short = [];
  for(const [g, t] of [...tally].sort((a, b) => a[0] - b[0]))
    if(t.said !== t.count){
      add(`${gLabel(g)} — 강좌표 학생수 합계 ${t.said}명, 신청 시트 집계 ${t.count}명.`
        + (t.count < t.said ? " 신청 시트에 필터나 숨긴 행이 있는지 확인하세요." : ""));
      if(t.count < t.said) short.push(`${gLabel(g)} ${t.said - t.count}명`);
    }

  const was = GAP;
  GAP = short.length
    ? `신청 시트에서 ${short.join(", ")}이 덜 읽혔습니다. 원본 시트에 필터가 걸려 있거나 숨긴 행이 있는지 확인해 주세요.`
    : "";
  if(GAP !== was) gapShut = false;

  for(const c of M.courses){
    if(c.ghost) add(`${name(c)} — 강좌표 시트에 없습니다 (학생 신청 ${c.count}명)`);
    else if(!c.count) add(`${name(c)} — 신청한 학생이 0명입니다`);
    else if(c.said != null && c.said !== c.count)
      add(`${name(c)} — 강좌표 기재 인원(${c.said}명)과 실제 신청(${c.count}명) 불일치`);
    if(!c.ghost && !realTeacher(c.teacher)) add(`${name(c)} — 담당 교사가 미정입니다`);
    if(!c.times.length) add(`${name(c)} — 배정된 수업 교시를 찾지 못했습니다`);
  }

  const slots = new Set(M.times.map(t => `${t.grade} ${t.slot}`));
  const said = new Set();
  for(const c of M.courses){
    const k = `${c.grade} ${c.slot.charAt(0)}`;
    if(said.has(k) || slots.has(k)) continue;
    said.add(k);
    add(`${gLabel(c.grade)} 슬롯 ${c.slot.charAt(0)} — 슬롯시간 시트에 정의되지 않았습니다`);
  }

  const clash = (whoOf, what) => {
    const bag = new Map();
    for(const r of M.lessons)
      for(const who of whoOf(r)){
        const k = `${who}|${r.day}|${r.period}`;
        if(!bag.has(k)) bag.set(k, { who, day:r.day, period:r.period, set:new Set() });
        bag.get(k).set.add(r.subject);
      }
    for(const v of bag.values()){
      if(v.set.size < 2) continue;
      add(`${v.who} · ${v.day}요일 ${v.period}교시 — ${what} 중복 (${[...v.set].slice(0, 3).join(", ")})`);
    }
  };
  clash(r => teachersOf(r.teacher).filter(realTeacher), "교사 수업");
  clash(r => r.room && !/^\d+학년 \d+반$/.test(r.room) ? [r.room] : [], "장소 사용");
}

/* ============ 로컬 캐시 & 비동기 동기화 ============ */
let loading = false, loaded = false, job = null, lastLoad = 0, cachedAt = 0;
let printing = false, printTimer = null;

function saveCache(){
  if(write(CACHE, {
    at:Date.now(), sheetId:CONFIG.SHEET_ID,
    s2:RAW.s2, s3:RAW.s3, lesson:RAW.lesson, time:RAW.time, c2:RAW.c2, c3:RAW.c3,
    src:Object.fromEntries(Object.entries(SRC).map(([k, v]) => [k, { rows:v.rows, at:v.at, flags:v.flags }]))
  })) cachedAt = Date.now();
}

function loadCache(){
  const c = read(CACHE, null);
  if(!c || !Array.isArray(c.lesson)) return false;
  if(c.sheetId !== CONFIG.SHEET_ID){ try{ localStorage.removeItem(CACHE); }catch{} return false; }
  try{
    for(const k of Object.keys(RAW)) if(Array.isArray(c[k])) RAW[k] = c[k];
    cachedAt = c.at || 0;
    for(const [k, v] of Object.entries(c.src || {})){
      if(!SRC[k]) continue;
      SRC[k].rows = v.rows || 0;
      SRC[k].at = v.at || 0;
      SRC[k].flags = Array.isArray(v.flags) ? v.flags : [];
    }
    build();
    loaded = M.students.length > 0 || M.lessons.length > 0;
    return loaded;
  }catch{ return false; }
}

async function reload(){
  if(job) return job;
  if(printing) return Promise.resolve();
  loading = true;
  $("#reloadIco")?.classList.add("spin");
  $$('[data-a="reload"]').forEach(b => { b.disabled = true; });
  updateHealthBadge();

  job = (async () => {
    const out = await Promise.allSettled(CONFIG.SHEETS.map(async sheet => {
      if(sheet.kind === "course") return readCourses(sheet);
      const table = await fetchTable({ gid:sheet.gid });
      const res = sheet.kind === "student" ? readStudents(sheet, table)
        : sheet.kind === "lesson" ? readLessons(table) : readTimes(table);
      return { ...res, rows:table.rows.length };
    }));

    const bad = [], stamp = Date.now();
    let ok = 0;
    out.forEach((r, i) => {
      const sheet = CONFIG.SHEETS[i], slot = SRC[sheet.key];
      if(r.status === "fulfilled"){
        RAW[sheet.key] = r.value.items;
        slot.rows = r.value.rows ?? r.value.items.length;
        slot.at = stamp;
        slot.error = "";
        slot.flags = r.value.flags;
        ok++;
      }else{
        slot.error = String(r.reason?.message || r.reason || "연결 실패").slice(0, 160);
        bad.push(sheet.name);
      }
    });
    build();
    loaded = loaded || ok > 0;
    if(ok){ lastLoad = Date.now(); saveCache(); }

    if(!ok) warn(cachedAt ? "네트워크에 연결되지 않아 기기에 저장된 사본을 표시합니다." : "시트 자료를 불러오지 못했습니다.");
    else if(bad.length) warn(`일부 시트 동기화 실패: ${bad.join(", ")}`);
    else hideWarn();
  })().finally(() => {
    loading = false; job = null;
    $("#reloadIco")?.classList.remove("spin");
    $$('[data-a="reload"]').forEach(b => { b.disabled = false; });
    draw({ keep:true });
    if(DET.kind && $("#ddlg").open) fillDetail();
    if($("#hdlg").open) fillHealthModal();
  });
  return job;
}

/* ============ 초성 지원 검색 및 하이라이트 ============ */
const parseTerms = rawQ => String(rawQ || "").trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
const terms = () => parseTerms(S.q);

function matchQuery(qList, ...parts){
  if(!qList.length) return true;
  const hay = parts.join(" ").toLocaleLowerCase();
  const hayCho = toChosung(hay);
  return qList.every(t => hay.includes(t) || (hasChosung(t) && hayCho.includes(t)));
}
const hit = (...parts) => matchQuery(terms(), ...parts);
const hitDir = (...parts) => matchQuery(parseTerms(S.dirQ), ...parts);

function hl(v, customQ){
  const raw = String(v ?? "");
  const qList = uniq(customQ !== undefined ? parseTerms(customQ) : terms()).filter(Boolean);
  if(!qList.length || !raw) return esc(raw);

  const low = raw.toLocaleLowerCase();
  const cho = toChosung(low);
  const ranges = [];

  for(const t of qList){
    const len = t.length;
    if(!len) continue;
    let idx = low.indexOf(t);
    while(idx !== -1){
      ranges.push([idx, idx + len]);
      idx = low.indexOf(t, idx + 1);
    }
    if(hasChosung(t)){
      let cIdx = cho.indexOf(t);
      while(cIdx !== -1){
        ranges.push([cIdx, cIdx + len]);
        cIdx = cho.indexOf(t, cIdx + 1);
      }
    }
  }
  if(!ranges.length) return esc(raw);

  ranges.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
  const merged = [ranges[0]];
  for(let i = 1; i < ranges.length; i++){
    const prev = merged[merged.length - 1], cur = ranges[i];
    if(cur[0] <= prev[1]) prev[1] = Math.max(prev[1], cur[1]);
    else merged.push(cur);
  }

  let out = "", pos = 0;
  for(const [s, e] of merged){
    out += esc(raw.slice(pos, s)) + `<mark>${esc(raw.slice(s, e))}</mark>`;
    pos = e;
  }
  return out + esc(raw.slice(pos));
}

/* ============ 주간 시간표 렌더러 ============ */
function ttHTML(entries, opts = {}){
  const maxP = Math.min(9, Math.max(7, ...entries.map(e => e.period || 0)));
  const grid = new Map();
  for(const e of entries){
    const k = `${e.day}|${e.period}`;
    if(!grid.has(k)) grid.set(k, []);
    grid.get(k).push(e);
  }
  const head = `<div class="tt-h">교시</div>`
    + Array.from({ length:maxP }, (_, i) => `<div class="tt-p">${i + 1}</div>`).join("");

  const cols = DAYS.map(d => {
    let n = 0;
    const isToday = d === TODAY_NAME;
    const cells = Array.from({ length:maxP }, (_, i) => {
      const list = grid.get(`${d}|${i + 1}`) || [];
      if(!list.length) return `<div class="tt-c tt-x" data-p="${i + 1}교시"></div>`;
      n++;
      const merged = mergeable(list);
      const distinctSubj = uniq(list.map(x => nSubj(x.subject))).length > 1;
      return `<div class="tt-c${distinctSubj && !merged ? " has-clash" : ""}" data-p="${i + 1}교시">${
        merged ? mergedCell(list) : list.map(e => ttCell(e, opts)).join("")}</div>`;
    }).join("");
    return `<div class="tt-d${isToday ? " is-today" : ""}"${n ? "" : ' data-none="수업 없음"'}>${d}</div>${cells}`;
  }).join("");

  return `<div class="tt" style="--p:${maxP}">${head}${cols}</div>`;
}

function ttMeta(e, opts){
  const own = e.room && e.grade && e.ban && e.room === `${e.grade}학년 ${e.ban}반`;
  const bits = [];
  if(opts.bans){
    const bans = e.bans.length ? e.bans : (e.ban ? [e.ban] : []);
    if(bans.length) bits.push(`<button type="button" data-cls="${e.grade}-${bans[0]}">${e.grade}-${bans.join("·")}반</button>`);
  }
  if(e.bans.length && e.ban && !opts.bans) bits.push(`분반 ${splitNo(e)}`);
  if(S.show.teacher && e.teacher && !opts.noTeacher) bits.push(teacherLinks(e.teacher));
  if(S.show.room && e.room && !own && !opts.noRoom) bits.push(roomLinks(e.room));
  return bits.join(" · ");
}

function ttCell(e, opts = {}){
  const t = SPECIAL[e.subject] || (e.slot ? tone(e.slot) : FLAT);
  const meta = ttMeta(e, opts);
  const nav = e.pickSlot ? `data-sl="${esc(e.grade + "|" + e.slot)}"`
    : e.course ? `data-c="${esc(e.course.id)}"`
    : e.grade && (e.ban || e.bans.length) ? `data-cls="${e.grade}-${e.bans.length ? e.bans[0] : e.ban}"` : "";
  const badge = e.slot && !SPECIAL[e.subject] ? slotTag(e.slot) : "";
  const titleHtml = `${hl(e.subject)}${e.guess ? ' <span class="muted">(추정)</span>' : ""}`;
  const full = [e.slot ? `[${e.slot}]` : "", e.subject, e.teacher, opts.noRoom ? "" : e.room].filter(Boolean).join(" · ");

  return `<div class="cx" style="${t}" title="${esc(full)}">
    <div class="cx-top">${badge}${
      nav ? `<button type="button" class="cx-h" ${nav}>${titleHtml}</button>` : `<b class="cx-h">${titleHtml}</b>`
    }</div>
    ${meta ? `<i>${meta}</i>` : ""}
  </div>`;
}

function mergedCell(list){
  const rows = [...list].sort((a, b) => Number(splitNo(a)) - Number(splitNo(b))).map(e => `
    <span class="cx-d"><span>${esc(splitNo(e))}분반</span>
      <span>${S.show.teacher && e.teacher ? teacherLinks(e.teacher) : ""}</span>
      <span>${S.show.room ? hl(e.room) : ""}</span></span>`).join("");
  return `<div class="cx multi" style="${FLAT}">
    <div class="cx-top"><b class="cx-h">${hl(list[0].subject)}</b></div>
    <i>${rows}</i>
  </div>`;
}

  </div>`;

  if(!rows.length) return { n:0, html:metrics + emptyBox(`${gLabel(S.grade)} 개설 강좌가 없습니다`) };

      .sort((a, b) => (DAY_IX.get(a.day) - DAY_IX.get(b.day)) || (a.period - b.period))
      .map(t => `${t.day}${t.period}`));

        <tbody>${list.map(c => {
          const mismatch = c.said != null && c.said !== c.count;

  }).join("");

  return { n:rows.length, html:metrics + `<div class="two-col">${html}</div>` };

/* 3. 학급 */
function classEntries(g, b){
  const out = M.lessons.filter(r => r.grade === g && !r.slot && forClass(r, b)).map(r => ({ ...r }));
  for(const slot of uniq(M.times.filter(t => t.grade === g).map(t => t.slot)))
    for(const t of M.times.filter(t => t.grade === g && t.slot === slot)){
      const n = M.courses.filter(c => c.grade === g && c.slot.charAt(0) === slot).length;
      out.push({ grade:g, ban:b, bans:[], day:t.day, period:t.period, slot,
                 subject:`이동수업 (${n}강좌)`, teacher:"", room:"", pickSlot:true });
    }
  return out;
}

/* 4. 교사 (마스터-디테일 스플릿) */
function drawTeacher(){
  const dirItems = IX.teachers.filter(t => hitDir(t));
  const dirHtml = `<aside class="dir-panel" aria-label="교사 목록">
    <div class="dir-head"><input class="fld" id="dirInput" type="search" autocomplete="off" placeholder="교사 초성·이름 필터…" value="${esc(S.dirQ)}"></div>
    <div class="dir-list">${dirItems.map(t => {
      const cnt = M.lessons.filter(r => hasTeacher(r.teacher, t)).length;
      return `<button type="button" class="dir-item${S.teacher === t ? " is-active" : ""}" data-t="${esc(t)}">
        <span>${hl(t, S.dirQ)}</span><span class="dir-sub">${cnt}시간</span>
      </button>`;
    }).join("") || '<p class="muted" style="padding:12px;text-align:center">일치하는 교사 없음</p>'}</div>
  </aside>`;

  if(!S.teacher) return { n:0, html:`<div class="split">${dirHtml}<div>${emptyBox("좌측 목록에서 교사를 선택해 주세요")}</div></div>` };

  const entries = M.lessons.filter(r => hasTeacher(r.teacher, S.teacher));
  const classes = uniq(entries.flatMap(e => (e.bans.length ? e.bans : (e.ban ? [e.ban] : [])).map(b => `${e.grade}-${b}`))).sort();
  const rooms = uniq(entries.map(e => e.room).filter(Boolean)).sort();
  const mine = M.courses.filter(c => hasTeacher(c.teacher, S.teacher));

/* 5. 장소 (마스터-디테일 스플릿) */
function drawRoom(){
  const dirItems = IX.rooms.filter(r => hitDir(r));
  const dirHtml = `<aside class="dir-panel" aria-label="수업 장소 목록">
    <div class="dir-head"><input class="fld" id="dirInput" type="search" autocomplete="off" placeholder="교실·특별실 필터…" value="${esc(S.dirQ)}"></div>
    <div class="dir-list">${dirItems.map(r => {
      const cnt = M.lessons.filter(x => x.room === r).length;
      return `<button type="button" class="dir-item${S.room === r ? " is-active" : ""}" data-rm="${esc(r)}">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${hl(r, S.dirQ)}</span>
        <span class="dir-sub">${cnt}시간</span>
      </button>`;
    }).join("") || '<p class="muted" style="padding:12px;text-align:center">일치하는 장소 없음</p>'}</div>
  </aside>`;

  if(!S.room) return { n:0, html:`<div class="split">${dirHtml}<div>${emptyBox("좌측 목록에서 장소를 선택해 주세요")}</div></div>` };

  const entries = M.lessons.filter(r => r.room === S.room);
  const mine = M.courses.filter(c => c.room.split(" · ").includes(S.room));
  const teachers = uniq(entries.flatMap(e => teachersOf(e.teacher)).filter(realTeacher));
  const classes = uniq(entries.flatMap(e => (e.bans.length ? e.bans : (e.ban ? [e.ban] : [])).map(b => `${e.grade}-${b}`))).sort();

  const mainHtml = !entries.length && !mine.length
    ? emptyBox(`${S.room}에 배정된 수업이 없습니다`)
    : `<div class="metrics">
        <div class="metric-card">장소 <b>${esc(S.room)}</b></div>
        <div class="metric-card">주간 사용 <b>${entries.length}시간</b></div>
        <div class="metric-card">수업 교사 <b>${teachers.length}명</b></div>
        <div class="metric-card">이동수업 <b>${mine.length}강좌 (${mine.reduce((a, c) => a + c.count, 0)}명)</b></div>
      </div>
      ${teachers.length || classes.length ? `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
        ${teachers.length ? `<div class="chips"><b>수업 교사</b>${teachers.map(t => `<button type="button" class="chip" data-t="${esc(t)}">${hl(t)}</button>`).join("")}</div>` : ""}
        ${classes.length ? `<div class="chips"><b>이용 학급</b>${classes.map(k => `<button type="button" class="chip" data-cls="${esc(k)}">${esc(k)}반</button>`).join("")}</div>` : ""}
      </div>` : ""}
      ${entries.length ? ttHTML(entries, { bans:true, noRoom:true }) : emptyBox("반별시간표에 이 장소로 등록된 수업이 없습니다")}
      ${mine.length ? `<div class="sec-head"><h2 class="sec-title">이 장소에서 진행되는 선택과목</h2></div>
        <div class="card"><table class="nowrap-cells">
          <thead><tr><th class="c-s">슬롯</th><th>과목명</th><th class="c-p">담당 교사</th><th class="c-c num">수강생</th></tr></thead>
          <tbody>${mine.map(c => `<tr class="row-hit" data-c="${esc(c.id)}">
            <td class="c-s" data-l="슬롯">${slotTag(c.slot)}</td>
            <td class="mn" data-l="과목">${gLabel(c.grade)} ${hl(c.subject)}</td>
            <td class="c-p" data-l="교사">${teacherLinks(c.teacher)}</td>
            <td class="c-c num rt-side" data-l="인원">${c.count}명</td></tr>`).join("")}</tbody>
        </table></div>` : ""}`;

  return { n:entries.length + mine.length, html:`<div class="split">${dirHtml}<div style="min-width:0">${mainHtml}</div></div>` };
}

/* 6. 명렬표 (출석부) */
function rosterHeads(){
  const [, make] = HEADS[S.head];
  const out = [];
  for(let i = 0; i < S.cols; i++) out.push(heads[i] != null && heads[i] !== "" ? heads[i] : make(i));
  return out;
}

function drawRoster(){
  const dirCourses = M.courses.filter(c => hitDir(gLabel(c.grade), c.slot, c.subject, c.teacher));
  const dirHtml = `<aside class="dir-panel" aria-label="강좌 목록">
    <div class="dir-head"><input class="fld" id="dirInput" type="search" autocomplete="off" placeholder="강좌·슬롯·교사 필터…" value="${esc(S.dirQ)}"></div>
    <div class="dir-list">${dirCourses.map(c => `
      <button type="button" class="dir-item${S.course === c.id ? " is-active" : ""}" data-roster-pick="${esc(c.id)}">
        <span style="display:flex;align-items:center;gap:6px;min-width:0">
          ${slotTag(c.slot)}
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.grade} · ${hl(c.subject, S.dirQ)}</span>
        </span>
        <span class="dir-sub">${c.count}명</span>
      </button>`).join("") || '<p class="muted" style="padding:12px;text-align:center">일치하는 강좌 없음</p>'}</div>
  </aside>`;

  const c = IX.course.get(S.course);
  if(!c) return { n:0, html:`<div class="split">${dirHtml}<div>${emptyBox("좌측 목록에서 출석부를 만들 강좌를 선택해 주세요")}</div></div>` };

  const list = c.roster.filter(s => hit(s.id, s.name));
  const hd = rosterHeads();
  const byBan = new Map();
  for(const s of c.roster) byBan.set(s.ban, (byBan.get(s.ban) || 0) + 1);
  const spread = [...byBan.entries()].sort((a, b) => a[0] - b[0]).map(([b, n]) =>
    `<button type="button" class="chip" data-cls="${c.grade}-${b}">${b ? `${b}반` : "미정"} <b>${n}</b></button>`).join("");

  const mainHtml = `<div class="metrics">
      <div class="metric-card">${slotTag(c.slot)} <b>${esc(c.subject)}</b></div>
      <div class="metric-card">대상 <b>${gLabel(c.grade)}</b></div>
      <div class="metric-card">교사 <b>${teacherLinks(c.teacher)}</b></div>
      <div class="metric-card">장소 <b>${roomLinks(c.room)}</b></div>
      <div class="metric-card">수강 인원 <b>${c.count}명</b></div>
    </div>
    ${spread ? `<div class="chips" style="margin-bottom:12px"><b>반별 구성</b>${spread}</div>` : ""}
    <div class="rt-wrap"><table>
      <thead><tr><th class="c-1">연번</th><th class="c-2">학번</th><th class="c-3">이름</th>
        ${hd.map((v, i) => `<th class="hd"><input type="text" data-h="${i}" value="${esc(v)}"
          placeholder="${esc(S.head === "date" ? "월/일" : `항목 ${i + 1}`)}" aria-label="${i + 1}번째 열 제목"></th>`).join("")}</tr></thead>
      <tbody>${list.map((s, i) => `<tr class="row-hit" data-u="${esc(s.id)}">
        <td class="c-1">${i + 1}</td><td class="c-2">${hl(s.id)}</td><td class="c-3">${hl(s.name)}</td>
        ${hd.map(() => "<td></td>").join("")}</tr>`).join("")
        || `<tr><td colspan="${hd.length + 3}" class="muted" style="padding:24px">표시할 수강생이 없습니다</td></tr>`}</tbody>
    </table></div>`;

  return { n:list.length, html:`<div class="split">${dirHtml}<div style="min-width:0">${mainHtml}</div></div>` };
}

/* ============ 상태 배지 & 점검 센터 업데이트 ============ */
function updateHealthBadge(){
  const btn = $("#healthBtn"), txt = $("#healthText");
  const list = CONFIG.SHEETS.map(x => SRC[x.key]);
  const errs = list.filter(v => v.error).length;
  const flagsCount = list.reduce((a, v) => a + v.flags.length, 0) + CROSS.length;

  btn.classList.remove("is-loading", "is-warn");
  if(loading){
    btn.classList.add("is-loading");
    txt.textContent = "시트 동기화 중…";
  }else if(errs || flagsCount){
    btn.classList.add("is-warn");
    txt.textContent = errs ? `연결 오류 ${errs}건` : `점검 필요 ${flagsCount}건`;
  }else{
    const hhmm = lastLoad ? new Date(lastLoad).toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit", hour12:false }) : "저장본";
    txt.textContent = `정상 · ${hhmm}`;
  }

  $("#footStat").textContent = loaded
    ? `학생 ${M.students.length.toLocaleString()}명 · 개설 강좌 ${M.courses.length}개 · 주간 수업행 ${M.lessons.length.toLocaleString()}건 로드됨`
    : "데이터를 불러오는 중입니다…";
}

    : "기기에 저장된 오프라인 사본이 없습니다.";

/* ============ 전체 화면 갱신 ============ */
function draw({ keep = false } = {}){
  const top = window.scrollY;
  const act = document.activeElement;
  const actId = act?.id, actO = act?.dataset?.o, actH = act?.dataset?.h;
  const selStart = act?.selectionStart, selEnd = act?.selectionEnd;

  drawTabs();
  drawTools();
  updateHealthBadge();
  $("#gapText").textContent = GAP;
  $("#gap").hidden = !GAP || gapShut;

  let r;
  if(!loaded) r = { n:0, html:loading ? skeletonBox() : emptyBox("불러온 자료가 없습니다", "네트워크 연결 또는 시트 공유 권한을 확인한 뒤 새로고침해 주세요.") };
  else if(S.view === "student") r = drawStudent();
  else if(S.view === "course") r = drawCourse();
  else if(S.view === "klass") r = drawClass();
  else if(S.view === "teacher") r = drawTeacher();
  else if(S.view === "room") r = drawRoom();
  else r = drawRoster();

  $("#view").innerHTML = r.html;

  const hasQ = terms().length > 0;
  $("#qn").hidden = !hasQ;
  $("#qn").textContent = hasQ ? `${r.n}건` : "";
  $("#qHint").hidden = hasQ;

  savePrefs();

  /* 포커스 및 커서 복원 */
  if(actO) $(`[data-o="${CSS.escape(actO)}"]`)?.focus({ preventScroll:true });
  else if(actH != null){
    const inp = $(`[data-h="${CSS.escape(actH)}"]`);
    if(inp){ inp.focus({ preventScroll:true }); try{ inp.setSelectionRange(selStart, selEnd); }catch{} }
  }else if(actId && ["tsel", "rsel", "csel", "cols", "head", "dirInput"].includes(actId)){
    const el = $("#" + actId);
    if(el){
      el.focus({ preventScroll:true });
      if(actId === "dirInput" && selStart != null){ try{ el.setSelectionRange(selStart, selEnd); }catch{} }
    }
  }

  document.documentElement.style.setProperty("--top-h", $(".top").offsetHeight + "px");
  if(keep) window.scrollTo({ top, behavior:"instant" });
}

const warn = t => { $("#alertText").textContent = t; $("#alert").hidden = false; };
const hideWarn = () => { $("#alert").hidden = true; };
function toast(t){
  const el = $("#toast");
  el.textContent = t; el.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.hidden = true; }, 3200);
}

function go(v){
  if(!Object.hasOwn(VIEWS, v) || v === S.view) return;
  S.view = v; S.q = ""; S.dirQ = ""; $("#q").value = "";
  draw();
  window.scrollTo({ top:0, behavior:"instant" });
}

/* ============ CSV 내보내기 ============ */
function exportStudentsCSV(){
  const rows = studentRows();
  if(!rows.length){ toast("내보낼 학생 데이터가 없습니다"); return; }
  const maxC = Math.max(1, ...rows.map(s => s.courses.length));
  const header = ["학번", "이름", "학년", "반", "선택과목수"];
  for(let i = 1; i <= maxC; i++) header.push(`선택${i}_슬롯`, `선택${i}_과목`, `선택${i}_교사`, `선택${i}_장소`);
  const data = rows.map(s => {
    const r = [s.id, s.name, s.grade, s.ban || "", s.courses.length];
    for(let i = 0; i < maxC; i++){
      const c = s.courses[i];
      r.push(c ? c.slot : "", c ? c.subject : "", c ? c.teacher : "", c ? c.room : "");
    }
    return r;
  });
  downloadCSV(`선택과목_학생현황_${S.grade0 ? S.grade0 + "학년" : "전체"}.csv`, [header, ...data]);
}

function exportCoursesCSV(){
  const rows = courseRows(S.grade);
  if(!rows.length){ toast("내보낼 강좌가 없습니다"); return; }
  const header = ["학년", "슬롯", "과목명", "담당교사", "수업장소", "신청인원", "강좌표기재인원"];
  const data = rows.map(c => [c.grade, c.slot, c.subject, c.teacher, c.room, c.count, c.said ?? ""]);
  downloadCSV(`선택과목_${S.grade}학년_강좌표.csv`, [header, ...data]);
}

function exportRosterCSV(courseId){
  const c = IX.course.get(courseId || S.course);
  if(!c){ toast("강좌를 먼저 선택해 주세요"); return; }
  const hd = rosterHeads();
  const header = ["연번", "학번", "이름", "학년", "반", ...hd];
  const data = c.roster.map((s, i) => [i + 1, s.id, s.name, s.grade, s.ban || "", ...hd.map(() => "")]);
  downloadCSV(`출석부_${c.grade}학년_${c.slot}_${c.subject}.csv`, [header, ...data]);
}

/* ============ 상세 슬라이드 인스펙터 (#ddlg) ============ */
const DET = { kind:"", id:"", list:[] };

function openDetail(kind, id){
  DET.kind = kind; DET.id = id;
  DET.list = kind === "student"
    ? (S.view === "klass" ? studentsOf(S.cg, S.ban) : S.view === "roster" ? (IX.course.get(S.course)?.roster || []) : studentRows()).map(s => s.id)
    : (S.view === "course" ? courseRows(S.grade) : M.courses).map(c => c.id);
  if(!DET.list.includes(id)) DET.list = [id];
  fillDetail();
  if(!$("#ddlg").open) $("#ddlg").showModal();
}

function moveDetail(n){
  const i = DET.list.indexOf(DET.id);
  const next = DET.list[(i < 0 ? 0 : i + n + DET.list.length) % DET.list.length];
  if(!next) return;
  DET.id = next;
  fillDetail();
  $("#dbody").scrollTop = 0;
}

function studentEntries(s){
  const out = [];
  if(s.ban) for(const r of M.lessons)
    if(r.grade === s.grade && !r.slot && forClass(r, s.ban)) out.push({ ...r });
  for(const c of s.courses) for(const e of c.times) out.push({ ...e });
  return out;
}

function detailText(){
  if(DET.kind === "student"){
    const s = IX.student.get(DET.id);
    if(!s) return "";
    return [`${s.name} (${s.id}) · ${s.ban ? `${s.grade}학년 ${s.ban}반` : gLabel(s.grade)}`,
      ...s.courses.map(c => `[${c.slot}] ${c.subject} / ${c.teacher || "미정"} / ${c.room || "미정"}`)].join("\n");
  }
  const c = IX.course.get(DET.id);
  if(!c) return "";
  return [`${gLabel(c.grade)} [${c.slot}] ${c.subject} (${c.count}명)`,
    `교사: ${c.teacher || "미정"} / 장소: ${c.room || "미정"}`,
    ...c.roster.map((s, i) => `${i + 1}. ${s.id} ${s.name}`)].join("\n");
}
