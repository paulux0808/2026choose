<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>선택과목</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
(function(){
  try{
    var p = JSON.parse(localStorage.getItem("sk-prefs-v1") || "{}");
    var dark = p.theme === "dark" || ((!p.theme || p.theme === "system") &&
      matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    if([0.92,1,1.1,1.22].indexOf(p.fs) >= 0) document.documentElement.style.setProperty("--fs", p.fs);
  }catch(e){ document.documentElement.dataset.theme = "light"; }
})();
</script>
<style id="pageRule">@page{size:A4 portrait;margin:7mm}</style>
<style>
/* 선택과목 — 구글 시트 6개를 읽어 보여 준다. 쓰지 않는다. */

:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --bg-2:#F5F6F8;      /* 표 머리, 빈 칸 */
  --bg-3:#EDEFF2;
  --ink:#17181C;
  --ink-2:#5A6169;
  --ink-3:#8B929B;
  --line:#E2E5E9;
  --line-2:#CDD2D8;
  --key:#1A4B8C;       /* 선택 */
  --key-bg:#EAF0F8;
  --sun:#C1352B;
  --warn-bg:#FFF7E8;
  --warn-line:#E0BE79;
  --warn-ink:#7A5410;

  --tint-s:0%;   --tint-l:91%;
  --soft-s:0%;   --soft-l:96%;
  --label-s:16%; --label-l:28%;
  --edge-s:10%;  --edge-l:46%;

  --fs:1;
  --f-xs:calc(11px * var(--fs));
  --f-sm:calc(12px * var(--fs));
  --f-md:calc(13px * var(--fs));
  --f-lg:calc(15px * var(--fs));
  --sans:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
         "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --r:4px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16181C; --bg-2:#1E2126; --bg-3:#262A30;
  --ink:#E6E8EB; --ink-2:#A3AAB3; --ink-3:#767D86;
  --line:#2C3036; --line-2:#3B4149;
  --key:#7FADE8; --key-bg:#1C2A3B;
  --sun:#E8776C;
  --warn-bg:#2A2317; --warn-line:#6B5730; --warn-ink:#D8B673;
  --tint-s:-6%; --tint-l:24%;
  --soft-s:-10%; --soft-l:19%;
  --label-s:14%; --label-l:78%;
  --edge-s:10%; --edge-l:57%;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:var(--f-md);line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.4}
h1,h2,h3,p,dl,dd{margin:0}
ul{margin:0;padding:0;list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--key);outline-offset:1px}
mark{background:#FCE79A;color:#17181C;padding:0 1px}
:root[data-theme="dark"] mark{background:#6B5A1E;color:#F2EDDD}

/* ---- 공통 조각 ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--bg);font-size:var(--f-sm);font-weight:600;white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--bg-2)}
.btn-key{background:var(--key);border-color:var(--key);color:#fff}
:root[data-theme="dark"] .btn-key{color:#12161C}
.btn-key:hover:not(:disabled){filter:brightness(1.1)}
.btn-q{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-q:hover:not(:disabled){background:var(--bg-2);color:var(--ink)}
.btn-n{width:30px;padding:0}
.btn-s{height:26px;padding:0 8px;font-size:var(--f-xs)}
.fld{
  height:30px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--bg);font-size:var(--f-sm);
}
.fld:focus{outline:2px solid var(--key);outline-offset:-1px;border-color:var(--key)}

/* 켜고 끄는 표시 항목 */
.opts{display:flex;gap:1px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.opts button{
  height:28px;padding:0 9px;font-size:var(--f-sm);font-weight:600;
  color:var(--ink-3);background:var(--bg-2);
}
.opts button:hover{color:var(--ink)}
.opts button[aria-pressed="true"]{background:var(--key);color:#fff}
:root[data-theme="dark"] .opts button[aria-pressed="true"]{color:#12161C}

/* 하나만 고르는 묶음 */
.seg{display:flex;gap:1px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{height:28px;padding:0 10px;font-size:var(--f-sm);font-weight:600;color:var(--ink-3);background:var(--bg-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--key);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#12161C}
.seg b{font-weight:700;margin-left:5px;opacity:.75}

/* 슬롯 색 — 요소에 --dh(색상) --ds(채도)를 주고 여기서 조립한다.
   :root에서 만들면 --dh가 없어 색이 전부 죽는다. */
.tag{
  display:inline-block;flex:none;padding:0 4px;border-radius:2px;
  font-size:var(--f-xs);font-weight:700;white-space:nowrap;
  background:hsl(var(--dh,212) calc(var(--ds,7%) + var(--tint-s)) var(--tint-l));
  color:hsl(var(--dh,212) calc(var(--ds,7%) + var(--label-s)) var(--label-l));
}
.cm{
  display:inline-block;width:8px;height:8px;flex:none;border-radius:1px;margin-right:4px;
  background:hsl(var(--dh,212) calc(var(--ds,7%) + var(--label-s)) var(--label-l));
}
.seg button[aria-pressed="true"] .cm{background:currentColor}

/* ---- 머리 ---- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:44px}
.row-2{min-height:40px;border-top:1px solid var(--line);flex-wrap:wrap;padding-top:5px;padding-bottom:5px}
.wm{font-size:var(--f-lg);font-weight:800;letter-spacing:-.03em;margin-right:4px}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  padding:12px 11px 11px;font-size:var(--f-md);font-weight:600;color:var(--ink-2);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--key);border-bottom-color:var(--key);font-weight:700}
.grow{flex:1}
.find{position:relative;display:flex;align-items:center}
.find input{width:clamp(130px,16vw,230px);padding-right:44px}
.find .n{position:absolute;right:7px;font-size:var(--f-xs);color:var(--ink-3);font-weight:700;pointer-events:none}
.lbl{font-size:var(--f-sm);color:var(--ink-2);display:flex;align-items:center;gap:5px}
.lbl .fld{max-width:min(46vw,300px)}

/* ---- 알림 줄 ---- */
.strip{display:flex;align-items:center;gap:9px;padding:7px 12px;font-size:var(--f-sm);border-bottom:1px solid var(--line)}
.strip p{flex:1;overflow-wrap:anywhere}
.strip-w{background:var(--warn-bg);color:var(--warn-ink)}

main{padding:12px}
.none{padding:44px 12px;text-align:center;color:var(--ink-3);font-size:var(--f-sm)}
.frame{border:1px solid var(--line-2);border-radius:var(--r)}
.cap{display:flex;align-items:baseline;gap:8px;font-size:var(--f-md);font-weight:700;margin:16px 0 6px}
.cap:first-child{margin-top:0}
.cap span{font-size:var(--f-xs);font-weight:600;color:var(--ink-3)}
/* 넓은 화면에서 한 줄이 화면 끝까지 늘어나면 과목과 교사·장소·인원이 멀어져 눈이 헛짚는다.
   묶음을 두 단으로 접어 한 줄을 짧게 만든다. 좁아지면 저절로 한 단이 된다. */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,31rem),1fr));gap:0 18px;align-items:start}
.two > section{margin-bottom:14px;min-width:0}
.sum{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--f-sm);color:var(--ink-2);margin:0 0 10px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2)}
.sum b{color:var(--ink);font-weight:700}

/* ---- 표 ---- */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{
  padding:6px 8px;text-align:left;background:var(--bg-2);color:var(--ink-2);
  font-size:var(--f-xs);font-weight:700;border-bottom:1px solid var(--line-2);
  position:sticky;top:var(--top-h,0px);z-index:2;white-space:nowrap;
}
td{padding:5px 8px;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
/* 목록 표에서만 마지막 줄의 밑줄을 뺀다. 종이와 명렬표는 테두리가 닫혀 있어야 한다. */
.frame tr:last-child td{border-bottom:0}
tbody tr.pick{background:var(--key-bg);box-shadow:inset 3px 0 0 var(--key)}
.hit{cursor:pointer}
.hit:hover{background:var(--bg-2)}
/* 교사·장소는 눌러서 옮겨 갈 수 있다. 평소엔 글자로 두고 손이 닿을 때만 드러낸다. */
td button:hover{color:var(--key);text-decoration:underline;text-underline-offset:3px}
.num{text-align:right;white-space:nowrap}
.dash{color:var(--ink-3);font-size:var(--f-xs)}
.c-s{width:52px}.c-id{width:74px}.c-n{width:90px}.c-p{width:116px}.c-r{width:148px}.c-c{width:56px}
/* 과목·교사·교실 표는 한 행이 한 줄이어야 눈이 가로로 미끄러진다.
   넘치면 접지 말고 줄인다. 온전한 값은 툴팁에 있다. */
.line td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line td button{display:inline}
tfoot td{background:var(--bg-2);font-weight:700;border-top:1px solid var(--line-2)}

/* ---- 시간표 ---- 화면과 인쇄가 같은 얼개를 쓴다.
   칸을 요일 순서로 담고 grid-auto-flow:column 으로 세운다.
   좁은 화면에서는 그대로 펴면 요일별 목록이 된다. */
.tt{
  display:grid;grid-auto-flow:column;
  grid-template-columns:40px;grid-auto-columns:minmax(0,1fr);
  grid-template-rows:auto repeat(var(--p,7),minmax(38px,auto));
  gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;
}
.tt-h,.tt-d{background:var(--bg-2);padding:5px;text-align:center;font-size:var(--f-xs);font-weight:700;color:var(--ink-2)}
.tt-p{background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:var(--f-xs);font-weight:700;color:var(--ink-3)}
/* 빈 칸에 음영을 넣으면 수업 조각의 옅은 색과 섞여 오히려 구분이 죽는다. 괘선이 칸을 나눈다. */
.tt-c{background:var(--bg);padding:3px;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
/* 수업 조각 — 과목·교사·교실을 한 줄에 잇는다. 자리가 모자라면 뒤에서부터 줄인다.
   겉은 칸, 안에 누를 것을 둔다. 단추 안에 단추를 넣지 않는다. */
.cx{
  display:flex;align-items:baseline;gap:5px;padding:2px 5px;border-radius:2px;overflow:hidden;
  border-left:3px solid hsl(var(--dh,212) calc(var(--ds,7%) + var(--edge-s)) var(--edge-l));
  background:hsl(var(--dh,212) calc(var(--ds,7%) + var(--soft-s)) var(--soft-l));
}
.cx-h{
  flex:0 1 auto;min-width:0;text-align:left;padding:0;
  font-size:var(--f-sm);font-weight:700;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
button.cx-h:hover{color:var(--key);text-decoration:underline;text-underline-offset:2px}
.cx i{
  flex:1 1 0;min-width:0;font-style:normal;
  font-size:var(--f-xs);color:var(--ink-2);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 잘릴 때 말줄임이 제대로 붙게 inline 으로 흐르게 둔다 */
.cx i button{display:inline;text-decoration:underline;text-underline-offset:2px}
.cx i button:hover{color:var(--key)}
.cx .tag{margin-right:3px}
/* 분반 묶음만은 여러 줄이 본디 모양이다 */
.cx.multi{display:block;padding:2px 5px}
.cx.multi .cx-h{display:block;white-space:normal;overflow:visible}
.cx.multi i{display:block;white-space:normal;overflow:visible}
.cx-d{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:0 6px;align-items:baseline}
.cx-d span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- 명렬표 ---- 옆으로 굴러야 해서 스스로 스크롤 상자가 된다.
   그래서 머리줄은 페이지가 아니라 이 상자를 기준으로 붙는다. top 을 0 으로 두지 않으면
   머리줄이 --top-h 만큼 밀려 내려가 첫 몇 줄을 덮는다. */
.rt{border:1px solid var(--line-2);border-radius:var(--r);overflow:auto}
.rt table{table-layout:fixed;min-width:640px}
.rt th{top:0;border-bottom:1px solid var(--line-2)}
.rt th,.rt td{border-right:1px solid var(--line-2);text-align:center;vertical-align:middle}
.rt th:last-child,.rt td:last-child{border-right:0}
.rt td{height:30px;padding:2px 4px;font-size:var(--f-sm);border-bottom:1px solid var(--line-2)}
.rt tbody tr:last-child td{border-bottom:0}
.rt .hd{padding:2px}
.rt .hd input{
  width:100%;height:26px;padding:0 3px;border:0;border-bottom:1px solid transparent;background:transparent;
  text-align:center;font-size:var(--f-xs);font-weight:700;color:var(--ink);
}
.rt .hd input:focus{outline:0;border-bottom-color:var(--key)}
.rt .hd input::placeholder{color:var(--ink-3);font-weight:500}
.rt .c-1{width:40px}.rt .c-2{width:70px}.rt .c-3{width:78px}

/* ---- 자료 출처 ---- */
.src{margin-top:12px;font-size:var(--f-sm);color:var(--ink-2)}
.src > summary{cursor:pointer;padding:4px 2px;color:var(--ink-2)}
.src > summary::marker{color:var(--ink-3)}
.src-body{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin-top:5px;overflow:hidden}
.src-row{display:grid;grid-template-columns:8.5rem 1fr auto;gap:8px;align-items:baseline;padding:6px 10px;border-bottom:1px solid var(--line)}
.src-row:last-child{border-bottom:0}
.src-row b{font-weight:600;color:var(--ink)}
.src-row .st{font-size:var(--f-xs)}
.src-row .bad{color:var(--sun)}
.src-row a{font-size:var(--f-xs);white-space:nowrap}
.src-flags{border-top:1px solid var(--line-2);background:var(--warn-bg);color:var(--warn-ink);padding:7px 10px;font-size:var(--f-xs);line-height:1.6}
.src-flags + .src-flags{border-top:1px solid var(--warn-line)}
.src-flags b{display:block;margin-bottom:2px}
.src-flags ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:0 14px}
.src-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:7px 10px;font-size:var(--f-xs);color:var(--ink-3)}
.src-foot span{flex:1;min-width:0}

/* ---- 창 ---- */
dialog{
  width:min(680px,calc(100vw - 20px));max-height:84dvh;padding:0;border:1px solid var(--line-2);
  border-radius:6px;background:var(--bg);color:var(--ink);box-shadow:0 12px 40px rgba(10,14,20,.22);
}
dialog::backdrop{background:rgba(12,16,22,.45)}
dialog[open]{display:flex;flex-direction:column}
.dh{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dh h2{font-size:var(--f-lg);font-weight:700;margin-right:auto;overflow-wrap:anywhere}
.db{padding:10px 12px;overflow:auto;min-height:0}
.db h3{font-size:var(--f-xs);font-weight:700;color:var(--ink-2);margin:14px 0 5px}
.db h3:first-child{margin-top:0}
.df{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end}
.duty{display:grid;grid-template-columns:74px minmax(0,1fr);gap:4px 10px;font-size:var(--f-sm)}
.duty dt{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button,.chips span{
  padding:2px 7px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--bg-2);font-size:var(--f-xs);font-weight:600;
}
.chips button:hover{background:var(--bg-3)}
.chips > b{align-self:center;font-size:var(--f-xs);font-weight:700;color:var(--ink-3);margin-right:2px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:5px 16px;font-size:var(--f-sm)}
.keys div{display:flex;gap:8px;align-items:center}
kbd{
  font:inherit;font-size:var(--f-xs);font-weight:700;min-width:20px;text-align:center;
  border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--bg-2);
}
.set{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:var(--f-sm)}
.set > span{width:64px;color:var(--ink-2);flex:none}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;
  max-width:calc(100vw - 24px);padding:8px 13px;border-radius:var(--r);
  background:var(--ink);color:var(--bg);font-size:var(--f-sm);font-weight:600;
}

/* ---- 인쇄 미리보기 ---- */
#pdlg{width:min(940px,calc(100vw - 20px))}
.plan{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px}
.view{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow:hidden}
.stage{background:#fff;position:relative;flex:none;transform-origin:top left;box-shadow:0 1px 8px rgba(0,0,0,.16)}
.pset{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;align-items:center;gap:7px;padding:5px 3px;font-size:var(--f-sm);cursor:pointer;border-radius:2px}
.chk:hover{background:var(--bg-2)}
.chk input{width:14px;height:14px;margin:0;accent-color:var(--key);flex:none}
.fit{font-size:var(--f-sm);color:var(--ink-2);flex:1;align-self:center}
.fit.tight{color:var(--warn-ink);font-weight:600}

/* 종이 — 화면과 인쇄가 같은 트리를 쓴다 */
.paper{
  position:absolute;left:0;top:0;transform-origin:top left;
  color:#111;background:#fff;font-family:var(--sans);
  font-size:var(--pf,10pt);line-height:1.24;
}
.paper h1{font-size:1.5em;font-weight:800;letter-spacing:-.02em;margin:0 0 1.6mm;text-align:center}
.paper .ps{text-align:center;font-size:.92em;margin:0 0 2.2mm;color:#333}
.paper table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:inherit}
.paper th,.paper td{
  border:.5pt solid #666;padding:var(--pp,1.3px) 3px;line-height:1.2;
  vertical-align:middle;overflow-wrap:anywhere;position:static;background:none;text-align:center;
}
.paper th{background:#ececec;font-weight:700;font-size:.92em}

<script>
"use strict";

/* ============ 설정 ============ */
const CONFIG = Object.freeze({
  SHEET_ID: "1ZwOdHmsFGbCNTDJtUvLk5ExLxgLCAXyTVglkULv99lQ",
  SHEETS: [
    { key:"s2",     gid:"0",          name:"2학년 신청",  kind:"student", grade:2 },
    { key:"s3",     gid:"1935968761", name:"3학년 신청",  kind:"student", grade:3 },
    { key:"lesson", gid:"1926478023", name:"반별시간표",  kind:"lesson" },
    { key:"time",   gid:"863995751",  name:"슬롯시간",    kind:"time" },
    { key:"c2",     gid:"606989081",  name:"2학년 강좌표", kind:"course", grade:2, lastRow:16, lastCol:"P" },
    { key:"c3",     gid:"44867740",   name:"3학년 강좌표", kind:"course", grade:3, lastRow:40, lastCol:"AF" }
  ],
  POLL_MS: 600000, LOAD_MS: 20000
});

/* 슬롯 색 — [이름, 색상, 채도]. 이웃한 슬롯끼리 색이 붙지 않게 벌려 놓았다. */
const SLOTS = [
  ["A",212,52],["B",150,50],["C",28,62],["D",282,44],["E",190,52],["F",96,46],
  ["G",340,50],["H",250,46],["I",44,60],["J",168,50],["K",310,46],["L",12,58],
  ["M",228,48],["N",128,46],["O",62,52],["P",296,44],["Q",200,50],["R",82,48],
  ["S",264,44],["T",354,52],["U",138,48],["V",320,46],["W",178,50]
];
const SLOT_TONE = new Map(SLOTS.map(([n, h, s]) => [n, `--dh:${h};--ds:${s}%`]));
const FLAT = "--dh:212;--ds:7%";
/* 슬롯이 'W2' 처럼 숫자가 붙어도 같은 시간대다. 색은 첫 글자로 정한다. */
const tone = s => SLOT_TONE.get(String(s || "").trim().charAt(0).toUpperCase()) || FLAT;
const SPECIAL = { "자율활동":"--dh:38;--ds:62%", "자습":"--dh:246;--ds:44%" };

const DAYS = ["월","화","수","목","금"];
const DAY_IX = new Map(DAYS.map((d, i) => [d, i]));
const VIEWS = {
  student:{ label:"학생",   paper:false },
  course: { label:"강좌",   paper:true  },
  klass:  { label:"학급",   paper:true  },
  teacher:{ label:"교사",   paper:true  },
  room:   { label:"장소",   paper:true  },
  roster: { label:"명렬표", paper:true  }
};
const VK = Object.keys(VIEWS);
const HEADS = {
  date: ["날짜", i => ""],
  perf: ["수행평가", i => `수행 ${i + 1}`],
  unit: ["단원", i => `${i + 1}단원`],
  free: ["자유 입력", i => ""]
};
const PREFS = "sk-prefs-v1", CACHE = "sk-cache-v1";

/* ============ 유틸 ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uniq = a => [...new Set(a)];
const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : 0; };
const read = (k, f) => { try{ const r = localStorage.getItem(k); return r == null ? f : (JSON.parse(r) ?? f); }catch{ return f; } };
const write = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } };

/* 시트 값 — 서식이 있으면 서식을, 없으면 값을 쓴다 */
function cell(row, i){
  const c = row?.c?.[i];
  if(!c || c.v == null) return "";
  return String(c.f ?? c.v).trim();
}
const nSlot = v => String(v || "").trim().replace(/\s+/g, "").toUpperCase();
const nSubj = v => String(v || "").trim().replace(/\s+/g, "");
const ckey = (grade, slot, subject) => `${grade}\u0000${nSlot(slot)}\u0000${nSubj(subject)}`;
const gLabel = g => `${g}학년`;

/* 교사 칸에는 '김철수 / 이영희' 처럼 여럿이 들어온다 */
const teachersOf = v => String(v || "").split(/[\/／]/).map(x => x.trim()).filter(Boolean);
const hasTeacher = (v, t) => teachersOf(v).includes(t);
const shareTeacher = (a, b) => { const r = new Set(teachersOf(b)); return teachersOf(a).some(x => r.has(x)); };
const realTeacher = t => t && t !== "미정";

/* 수업 장소 표기를 한 갈래로 모은다: '반' '3-2' '3학년 2반' '2반' → '3학년 2반' */
function room(value, grade, ban){
  const r = String(value || "").trim().replace(/\s+/g, " ");
  if(!r) return "";
  const b = num(ban);
  if(r === "반" && grade && b) return `${grade}학년 ${b}반`;
  let m = r.match(/^(\d+)\s*[-–]\s*(\d+)$/);
  if(m) return `${m[1]}학년 ${num(m[2])}반`;
  m = r.match(/^(\d+)\s*학년\s*(\d+)\s*반$/);
  if(m) return `${m[1]}학년 ${num(m[2])}반`;
  m = r.match(/^(\d+)\s*반$/);
  if(m && grade) return `${grade}학년 ${num(m[1])}반`;
  return r;
}

/* 대상반이 비어 있는 합반 수업을 과목·반으로 되짚는다 */
function inferBans(grade, ban, subject){
  const s = nSubj(subject), b = String(ban || "");
  if((grade === 1 && s === "공통수학2") || (grade === 2 && s === "미적분Ⅰ")){
    if(["1","6"].includes(b)) return [1];
    if(["2","3","7"].includes(b)) return [2,3];
    if(["4","5","8"].includes(b)) return [4,5];
  }
  if((grade === 1 && s === "공통영어2") || (grade === 2 && s === "영어Ⅱ")){
    if(["1","2","6"].includes(b)) return [1,2];
    if(["3","4","7"].includes(b)) return [3,4];
    if(["5","8"].includes(b)) return [5];
  }
  return [];
}
const forClass = (r, ban) => r.bans.length ? r.bans.includes(num(ban)) : r.ban === num(ban);

/* 합반 수업의 분반 번호 — 대상반이 같은 것끼리 순서대로 1, 2, 3 */
const SPLIT = {
  "공통수학2":{ "1":[1,6], "2,3":[2,3,7], "4,5":[4,5,8] },
  "미적분Ⅰ":{ "1":[1,6], "2,3":[2,3,7], "4,5":[4,5,8] },
  "공통영어2":{ "1,2":[1,2,6], "3,4":[3,4,7], "5":[5,8] },
  "영어Ⅱ":{ "1,2":[1,2,6], "3,4":[3,4,7], "5":[5,8] }
};
function splitNo(e){
  if(!e.bans.length || !e.ban) return e.ban || "";
  const order = SPLIT[nSubj(e.subject)]?.[[...e.bans].sort((a, b) => a - b).join(",")] || [];
  const i = order.indexOf(num(e.ban));
  return i >= 0 ? i + 1 : e.ban;
}
/* 같은 시간·같은 과목의 분반들은 한 칸에 모아 적는다 */
const mergeable = list => list.length > 1 && list.every(e => !e.slot && e.bans.length)
  && list.every(e => nSubj(e.subject) === nSubj(list[0].subject));

/* ============ 상태 ============ */
const S = {
  view:"student", q:"",
  theme:"system", fs:1,
  grade0:0,                      /* 학생 — 0이면 전 학년 */
  grade:2,                       /* 강좌·명렬표 */
  cg:2, ban:0,                   /* 학급 */
  teacher:"", room:"", course:"",
  cols:10, head:"date",
  show:{ teacher:true, room:true },
  print:{ teacher:true, room:true, count:true }
};
let heads = [];

function loadPrefs(){
  const p = read(PREFS, {}) || {};
  if(Object.hasOwn(VIEWS, p.view)) S.view = p.view;
  if(["light","dark","system"].includes(p.theme)) S.theme = p.theme;
  if([0.92,1,1.1,1.22].includes(p.fs)) S.fs = p.fs;
  if([0,2,3].includes(p.grade0)) S.grade0 = p.grade0;
  if([2,3].includes(p.grade)) S.grade = p.grade;
  if([1,2,3].includes(p.cg)) S.cg = p.cg;
  if(Number.isInteger(p.ban) && p.ban >= 0 && p.ban <= 20) S.ban = p.ban;
  if(typeof p.teacher === "string") S.teacher = p.teacher;
  if(typeof p.room === "string") S.room = p.room;
  if(typeof p.course === "string") S.course = p.course;
  if(Number.isInteger(p.cols) && p.cols >= 1 && p.cols <= 30) S.cols = p.cols;
  if(Object.hasOwn(HEADS, p.head)) S.head = p.head;
  for(const g of ["show", "print"])
    for(const k of Object.keys(S[g])) if(typeof p[g]?.[k] === "boolean") S[g][k] = p[g][k];
  if(Array.isArray(p.heads)) heads = p.heads.map(x => String(x ?? "")).slice(0, 30);
}
const savePrefs = () => write(PREFS, {
  view:S.view, theme:S.theme, fs:S.fs, grade0:S.grade0, grade:S.grade, cg:S.cg, ban:S.ban,
  teacher:S.teacher, room:S.room, course:S.course, cols:S.cols, head:S.head, heads,
  show:S.show, print:S.print
});
function applyPrefs(){
  const dark = S.theme === "dark" || (S.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.style.setProperty("--fs", String(S.fs));
}

/* ============ 자료 ============ */
const RAW = { s2:[], s3:[], lesson:[], time:[], c2:[], c3:[] };
const M = { students:[], courses:[], lessons:[], times:[] };
const IX = { student:new Map(), course:new Map(), byKey:new Map(), teachers:[], rooms:[], classes:new Map() };
/* 시트별 상태 — 무엇이 들어왔고 어느 행이 이상한지 화면에 그대로 내보인다 */
const SRC = Object.fromEntries(CONFIG.SHEETS.map(x =>
  [x.key, { name:x.name, gid:x.gid, rows:0, at:0, error:"", flags:[] }]));
const CROSS = [];
let GAP = "", gapShut = false;
const sheetLink = gid => `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/edit#gid=${gid}`;

/* gviz 는 권한 오류도 HTTP 200 으로 준다. 모양을 직접 확인해야 한다. */
function validate(raw){
  if(!raw || !["ok", "warning"].includes(raw.status)){
    const said = (raw?.errors || [])
      .map(e => String(e?.detailed_message || e?.message || "").trim()).filter(Boolean).join(" / ");
    throw new Error(said || "시트 응답이 아닙니다 (접근 권한을 확인해 주세요)");
  }
  const t = raw.table;
  if(!t || !Array.isArray(t.cols) || !Array.isArray(t.rows) || !t.rows.every(r => r && Array.isArray(r.c)))
    throw new Error("시트 구조를 읽을 수 없습니다");
  return t;
}

/* gviz는 JSONP만 준다 */
function fetchTable({ gid, range = "", headers = true }){
  return new Promise((res, rej) => {
    const cb = `sk_${gid}_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const el = document.createElement("script");
    let done = false;
    const end = (err, raw) => {
      if(done) return;
      done = true;
      clearTimeout(t); el.remove(); window[cb] = () => {};
      setTimeout(() => { delete window[cb]; }, 60000);
      err ? rej(err) : res(raw);
    };
    const t = setTimeout(() => end(new Error("응답 시간 초과")), CONFIG.LOAD_MS);
    window[cb] = raw => { try{ end(null, validate(raw)); }catch(err){ end(err); } };
    el.onerror = () => end(new Error("연결하지 못했습니다"));
    el.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`
      + `?tqx=out:json;responseHandler:${cb}&gid=${gid}`
      + (range ? `&range=${encodeURIComponent(range)}` : "")
      + `&headers=${headers ? 1 : 0}&_=${Date.now()}`;
    document.body.appendChild(el);
  });
}

const label = c => String(c?.label ?? "").trim();
const finder = table => {
  const l = (table.cols || []).map(label);
  return name => l.findIndex(x => x === name);
};

/* ---- 신청 시트: 학번·이름 + 과목마다 슬롯 한 칸 ---- */
function readStudents(sheet, table){
  const head = (table.cols || []).map(label);
  const flags = [], out = [];
  const flag = (n, m) => { if(flags.length < 60) flags.push(`${n + 2}행 · ${m}`); };
  let idI = head.findIndex(h => h.includes("학번"));
  let nameI = head.findIndex(h => h.includes("이름") || h.includes("성명"));
  if(idI < 0) idI = 0;
  if(nameI < 0) nameI = 1;
  const cols = head.map((name, i) => ({ name, i })).filter(c => c.i !== idI && c.i !== nameI && c.name);
  if(!cols.length) throw new Error("과목 열을 찾지 못했습니다");

  table.rows.forEach((r, n) => {
    const id = cell(r, idI), name = cell(r, nameI);
    if(!id && !name) return;
    if(!id || !name){ flag(n, id ? "이름이 비어 있습니다" : "학번이 비어 있습니다"); return; }
    const m = id.match(/^(\d)(\d{2})(\d{2})$/);
    if(!m) flag(n, `학번 형식을 읽을 수 없습니다: ${id}`);
    const subjects = {};
    for(const c of cols){
      const slot = cell(r, c.i);
      if(slot && slot !== "-" && slot !== "0") subjects[c.name] = slot;
    }
    if(!Object.keys(subjects).length){ flag(n, `신청 과목이 없습니다: ${name}`); return; }
    out.push({ id, name, grade:sheet.grade, ban:m ? num(m[2]) : 0, subjects });
  });
  return { items:out, flags };
}

/* ---- 반별시간표 ---- */
function readLessons(table){
  const at = finder(table);
  const iG = at("학년"), iB = at("반"), iD = at("요일"), iP = at("교시");
  const iS = at("과목"), iT = at("교사"), iL = at("슬롯"), iX = at("대상반");
  const iR = at("수업장소") >= 0 ? at("수업장소") : 7;
  if(iG < 0 || iD < 0 || iP < 0 || iS < 0) throw new Error("학년·요일·교시·과목 열을 찾지 못했습니다");

  const flags = [], out = [];
  const flag = (n, m) => { if(flags.length < 60) flags.push(`${n + 2}행 · ${m}`); };
  table.rows.forEach((r, n) => {
    const grade = num(cell(r, iG)), day = cell(r, iD), period = num(cell(r, iP));
    const subject = cell(r, iS), slot = nSlot(cell(r, iL));
    const ban = slot ? null : num(cell(r, iB));
    if(!grade && !day && !subject) return;
    if(!grade || !DAY_IX.has(day) || !period || !subject){
      flag(n, !DAY_IX.has(day) ? (/^[토일]$/.test(day)
          ? `${day}요일 수업은 시간표에 넣지 않습니다: ${subject || ""}`
          : `요일을 읽을 수 없습니다: ${day || "빈 값"}`)
        : !period ? `교시를 읽을 수 없습니다: ${cell(r, iP) || "빈 값"}`
        : !grade ? "학년을 읽을 수 없습니다" : "과목이 비어 있습니다");
      return;
    }
    if(!slot && !ban){ flag(n, `슬롯도 반도 없습니다: ${subject}`); return; }
    let bans = slot || iX < 0 ? [] : uniq(cell(r, iX).split(/[,，/\s]+/).map(v => parseInt(v, 10)).filter(Number.isFinite));
    if(!slot && !bans.length) bans = inferBans(grade, ban, subject);
    out.push({ grade, ban, bans, day, period, subject,
               teacher:cell(r, iT), slot, room:room(cell(r, iR), grade, ban) });
  });
  return { items:out, flags };
}

/* ---- 슬롯시간 ---- */
function readTimes(table){
  const at = finder(table);
  const iG = at("학년"), iL = at("슬롯"), iD = at("요일"), iP = at("교시");
  if(iG < 0 || iL < 0 || iD < 0 || iP < 0) throw new Error("학년·슬롯·요일·교시 열을 찾지 못했습니다");
  const flags = [], out = [];
  table.rows.forEach((r, n) => {
    const grade = num(cell(r, iG)), slot = nSlot(cell(r, iL));
    const day = cell(r, iD), period = num(cell(r, iP));
    if(!grade && !slot && !day) return;
    if(!grade || !slot || !DAY_IX.has(day) || !period){
      if(flags.length < 60) flags.push(`${n + 2}행 · 학년·슬롯·요일·교시를 읽을 수 없습니다`);
      return;
    }
    out.push({ grade, slot, day, period });
  });
  return { items:out, flags };
}

/* ---- 강좌표: 슬롯마다 '학생수 / 교사 / 장소' 세 줄이 붙어 있다.
       머리글에서 과목을 읽고, 슬롯 블록마다 두 줄을 다시 받아 온다. ---- */
async function readCourses(sheet){
  const [headTable, metaTable] = await Promise.all([
    fetchTable({ gid:sheet.gid, range:`A1:${sheet.lastCol}1`, headers:false }),
    fetchTable({ gid:sheet.gid, range:`A2:B${sheet.lastRow}`, headers:false })
  ]);
  const headRow = headTable.rows[0];
  const subjects = (headRow?.c || []).map((_, i) => cell(headRow, i));
  const flags = [], groups = [];
  let slot = "";
  metaTable.rows.forEach((r, i) => {
    const found = cell(r, 0);
    if(found) slot = nSlot(found);
    if(slot && cell(r, 1) === "학생수") groups.push({ slot, at:i + 2 });
  });
  if(!groups.length) throw new Error("'학생수' 줄을 찾지 못했습니다 (강좌표 형식 확인)");

  /* 학생수 줄까지 같이 받는다. 담당자가 적어 둔 인원이라, 우리가 센 인원과 맞춰 보면
     신청 시트가 덜 읽혔는지(필터·숨긴 행) 드러난다. 요청 수는 늘지 않는다. */
  const blocks = await Promise.all(groups.map(g =>
    fetchTable({ gid:sheet.gid, range:`C${g.at}:${sheet.lastCol}${g.at + 2}`, headers:false })
      .then(t => ({ g, t }))));

  const out = [];
  for(const { g, t } of blocks){
    const nRow = t.rows[0], tRow = t.rows[1], rRow = t.rows[2];
    const n = Math.max(tRow?.c?.length || 0, rRow?.c?.length || 0, nRow?.c?.length || 0);
    for(let i = 0; i < n; i++){
      const subject = subjects[i + 2];
      const teacher = cell(tRow, i), place = room(cell(rRow, i), sheet.grade);
      if(!subject || (!teacher && !place)) continue;
      const said = cell(nRow, i);
      out.push({ grade:sheet.grade, slot:g.slot, subject, teacher, room:place,
                 said:/^\d+$/.test(said) ? +said : null });
    }
    if(!n && flags.length < 60) flags.push(`슬롯 ${g.slot} · 교사·장소 줄이 비어 있습니다`);
  }
  return { items:out, flags, rows:metaTable.rows.length };
}

/* ============ 엮기 ============ */
/* 강좌표 교사를 시간표 행에 옮겨 적는다 */
function fillTeachers(){
  for(const r of M.lessons){
    if(!r.slot) continue;
    const base = r.slot.charAt(0);
    const cand = M.courses.filter(c => c.grade === r.grade && nSubj(c.subject) === nSubj(r.subject)
      && (c.slot === r.slot || c.slot.charAt(0) === base));
    let c = cand.find(x => x.slot === r.slot);
    if(!c && r.teacher) c = cand.find(x => shareTeacher(x.teacher, r.teacher));
    if(!c && r.room) c = cand.find(x => x.room === r.room);
    if(!c && cand.length === 1) c = cand[0];
    if(c?.teacher) r.teacher = c.teacher;
  }
}
/* 시간표에 적힌 장소를 강좌로 옮겨 적는다 */
function fillRooms(){
  for(const c of M.courses){
    const rooms = uniq(lessonsFor(c, { fallback:false, needRoom:true }).map(r => r.room));
    if(rooms.length) c.room = rooms.join(" · ");
  }
}
/* 강좌에 해당하는 시간표 행. 없으면 슬롯시간으로 자리를 만든다.
   needRoom=true 면 장소가 적힌 행만 본다 (장소를 거둬 올 때). */
function lessonsFor(c, { fallback = true, needRoom = false } = {}){
  const base = c.slot.charAt(0);
  let rows = M.lessons.filter(r => r.grade === c.grade && r.slot
    && nSubj(r.subject) === nSubj(c.subject) && (r.slot === c.slot || r.slot === base)
    && (!needRoom || r.room));
  if(c.teacher){
    const t = rows.filter(r => shareTeacher(r.teacher, c.teacher));
    if(t.length) rows = t;
  }
  if(c.room){
    const want = c.room.split(" · ");
    const t = rows.filter(r => want.includes(r.room));
    if(t.length) rows = t;
  }
  if(rows.length) return rows.map(r => ({ ...r, slot:c.slot, course:c }));
  if(!fallback) return [];
  return M.times.filter(t => t.grade === c.grade && t.slot === base).map(t => ({
    grade:c.grade, ban:null, bans:[], day:t.day, period:t.period,
    subject:c.subject, teacher:c.teacher, slot:c.slot, room:c.room, course:c, guess:true
  }));
}

function build(){
  M.students = [...RAW.s2, ...RAW.s3].map(s => ({ ...s })).sort((a, b) => a.id.localeCompare(b.id));
  /* 아래에서 교사를 채워 넣으므로 원본(사본으로 나갈 값)은 건드리지 않는다 */
  M.lessons = RAW.lesson.map(r => ({ ...r }));
  M.times = RAW.time;

  /* 강좌표에 있는 것과 학생이 신청한 것의 합집합. 어느 쪽도 잃지 않는다. */
  const map = new Map();
  for(const c of [...RAW.c2, ...RAW.c3]){
    const k = ckey(c.grade, c.slot, c.subject);
    if(!map.has(k)) map.set(k, { ...c, ghost:false });
  }
  for(const s of M.students)
    for(const [subject, slot] of Object.entries(s.subjects)){
      const k = ckey(s.grade, slot, subject);
      if(!map.has(k)) map.set(k, { grade:s.grade, slot:nSlot(slot), subject, teacher:"", room:"", ghost:true });
    }
  M.courses = [...map.values()].sort((a, b) =>
    a.grade - b.grade || a.slot.localeCompare(b.slot) || a.subject.localeCompare(b.subject));
  for(const c of M.courses){ c.id = `${c.grade}|${c.slot}|${c.subject}`; c.roster = []; }

  IX.byKey = new Map(M.courses.map(c => [ckey(c.grade, c.slot, c.subject), c]));
  IX.course = new Map(M.courses.map(c => [c.id, c]));
  IX.student = new Map(M.students.map(s => [s.id, s]));

  for(const s of M.students){
    s.courses = [];
    for(const [subject, slot] of Object.entries(s.subjects)){
      const c = IX.byKey.get(ckey(s.grade, slot, subject));
      if(!c) continue;
      c.roster.push(s);
      s.courses.push(c);
    }
    s.courses.sort((a, b) => a.slot.localeCompare(b.slot) || a.subject.localeCompare(b.subject));
  }
  for(const c of M.courses) c.count = c.roster.length;

  fillTeachers();
  fillRooms();
  for(const c of M.courses) c.times = lessonsFor(c);

  IX.teachers = uniq([
    ...M.lessons.flatMap(r => teachersOf(r.teacher)),
    ...M.courses.flatMap(c => teachersOf(c.teacher))
  ].filter(realTeacher)).sort((a, b) => a.localeCompare(b, "ko"));
  IX.rooms = uniq([...M.lessons.map(r => r.room), ...M.courses.flatMap(c => c.room.split(" · "))]
    .map(x => String(x || "").trim()).filter(Boolean)).sort((a, b) => a.localeCompare(b, "ko"));

  IX.classes = new Map();
  const put = (g, b) => {
    if(!g || !b) return;
    if(!IX.classes.has(g)) IX.classes.set(g, new Set());
    IX.classes.get(g).add(b);
  };
  for(const s of M.students) put(s.grade, s.ban);
  for(const r of M.lessons){
    if(r.slot) continue;
    if(r.bans.length) r.bans.forEach(b => put(r.grade, b));
    else put(r.grade, r.ban);
  }
  check();
}

const bansOf = g => [...(IX.classes.get(g) || [])].sort((a, b) => a - b);
const studentsOf = (g, b) => M.students.filter(s => s.grade === g && s.ban === b).sort((a, b2) => a.id.localeCompare(b2.id));

/* 시트가 서로 어긋난 곳을 모은다. 앱은 시트를 고칠 수 없으니, 어디가 어긋났는지는 말해 줘야 한다. */
function check(){
  CROSS.length = 0;
  const add = t => { if(CROSS.length < 200) CROSS.push(t); };
  const name = c => `${gLabel(c.grade)} ${c.slot} · ${c.subject}`;

  /* 강좌표가 적어 둔 학생수와 신청 시트에서 센 인원. 어긋나면 어느 한쪽이 덜 읽힌 것이다.
     신청 시트에 기본 필터가 걸려 있으면 gviz 는 보이는 행만 주므로 여기서 드러난다. */
  const tally = new Map();
  for(const c of M.courses){
    if(c.said == null) continue;
    const t = tally.get(c.grade) || { said:0, count:0 };
    t.said += c.said; t.count += c.count;
    tally.set(c.grade, t);
  }
  const short = [];
  for(const [g, t] of [...tally].sort((a, b) => a[0] - b[0]))
    if(t.said !== t.count){
      add(`${gLabel(g)} — 강좌표 학생수 합계 ${t.said}명, 신청 시트에서 센 인원 ${t.count}명.`
        + (t.count < t.said ? " 신청 시트에 필터가 걸려 있거나 숨긴 행이 있는지 확인하세요." : ""));
      if(t.count < t.said) short.push(`${gLabel(g)} ${t.said - t.count}명`);
    }
  /* 조용히 지나가면 안 되는 어긋남이다. 접힌 패널 말고 화면 위에 내건다. */
  const was = GAP;
  GAP = short.length
    ? `신청 시트에서 ${short.join(", ")}이 덜 읽혔습니다. 시트에 필터가 걸려 있거나 숨긴 행이 있는지 확인하세요.`
    : "";
  if(GAP !== was) gapShut = false;   /* 내용이 바뀌면 닫아 둔 것을 다시 편다 */

  for(const c of M.courses){
    if(c.ghost) add(`${name(c)} — 강좌표에 없습니다 (신청 ${c.count}명)`);
    else if(!c.count) add(`${name(c)} — 신청한 학생이 없습니다`);
    else if(c.said != null && c.said !== c.count)
      add(`${name(c)} — 강좌표 학생수 ${c.said}명, 신청 시트에서 센 인원 ${c.count}명`);
    if(!c.ghost && !realTeacher(c.teacher)) add(`${name(c)} — 담당 교사가 비어 있습니다`);
    if(!c.times.length) add(`${name(c)} — 시간표에서 시간을 찾지 못했습니다`);
  }
  const slots = new Set(M.times.map(t => `${t.grade} ${t.slot}`));
  const said = new Set();
  for(const c of M.courses){
    const k = `${c.grade} ${c.slot.charAt(0)}`;
    if(said.has(k) || slots.has(k)) continue;
    said.add(k);
    add(`${gLabel(c.grade)} 슬롯 ${c.slot.charAt(0)} — 슬롯시간 시트에 없습니다`);
  }

  /* 같은 시간에 두 곳에 있는 교사·교실. 과목이 갈릴 때만 센다. */
  const clash = (whoOf, what) => {
    const bag = new Map();
    for(const r of M.lessons)
      for(const who of whoOf(r)){
        const k = `${who} ${r.day} ${r.period}`;
        if(!bag.has(k)) bag.set(k, { who, day:r.day, period:r.period, set:new Set() });
        bag.get(k).set.add(r.subject);
      }
    for(const v of bag.values()){
      if(v.set.size < 2) continue;
      add(`${v.who} · ${v.day} ${v.period}교시 — ${what} ${v.set.size}개 (${[...v.set].slice(0, 3).join(", ")})`);
    }
  };
  clash(r => teachersOf(r.teacher).filter(realTeacher), "수업");
  /* 교실이 곧 학급인 자리(3학년 2반)는 겹쳐도 이상하지 않으니 뺀다 */
  clash(r => r.room && !/^\d+학년 \d+반$/.test(r.room) ? [r.room] : [], "수업");
}

/* ============ 사본 ============ */
let loading = false, loaded = false, job = null, lastLoad = 0, cachedAt = 0;
let printing = false, printTimer = null;

function saveCache(){
  if(write(CACHE, {
    at:Date.now(),
    s2:RAW.s2, s3:RAW.s3, lesson:RAW.lesson, time:RAW.time, c2:RAW.c2, c3:RAW.c3,
    src:Object.fromEntries(Object.entries(SRC).map(([k, v]) => [k, { rows:v.rows, at:v.at, flags:v.flags }]))
  })) cachedAt = Date.now();
}
function loadCache(){
  const c = read(CACHE, null);
  if(!c || !Array.isArray(c.lesson)) return false;
  try{
    for(const k of Object.keys(RAW)) if(Array.isArray(c[k])) RAW[k] = c[k];
    cachedAt = c.at || 0;
    for(const [k, v] of Object.entries(c.src || {})){
      if(!SRC[k]) continue;
      SRC[k].rows = v.rows || 0;
      SRC[k].at = v.at || 0;
      SRC[k].flags = Array.isArray(v.flags) ? v.flags : [];
    }
    build();
    loaded = M.students.length > 0 || M.lessons.length > 0;
    return loaded;
  }catch{ return false; }
}

async function reload(){
  if(job) return job;
  if(printing) return Promise.resolve();
  loading = true;
  $$('[data-a="reload"]').forEach(b => { b.disabled = true; });

  job = (async () => {
    const out = await Promise.allSettled(CONFIG.SHEETS.map(async sheet => {
      if(sheet.kind === "course") return readCourses(sheet);
      const table = await fetchTable({ gid:sheet.gid });
      const res = sheet.kind === "student" ? readStudents(sheet, table)
        : sheet.kind === "lesson" ? readLessons(table) : readTimes(table);
      return { ...res, rows:table.rows.length };
    }));

    const bad = [], stamp = Date.now();
    let ok = 0;
    out.forEach((r, i) => {
      const sheet = CONFIG.SHEETS[i], slot = SRC[sheet.key];
      if(r.status === "fulfilled"){
        RAW[sheet.key] = r.value.items;
        slot.rows = r.value.rows ?? r.value.items.length;
        slot.at = stamp;
        slot.error = "";
        slot.flags = r.value.flags;
        ok++;
      }else{
        slot.error = String(r.reason?.message || r.reason || "실패").slice(0, 160);
        bad.push(sheet.name);
      }
    });
    build();
    loaded = loaded || ok > 0;
    if(ok){ lastLoad = Date.now(); saveCache(); }

    if(!ok) warn(cachedAt ? "연결되지 않아 저장본을 보여 줍니다." : "불러오지 못했습니다.");
    else if(bad.length) warn(`${bad.join(", ")} 실패`);
    else hideWarn();
  })().finally(() => {
    loading = false; job = null;
    $$('[data-a="reload"]').forEach(b => { b.disabled = false; });
    draw({ keep:true });
    if(DET.kind && $("#ddlg").open) fillDetail();
  });
  return job;
}

/* ============ 검색 ============ */
const terms = () => S.q.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
function hit(...parts){
  const t = terms();
  if(!t.length) return true;
  const hay = parts.join(" ").toLocaleLowerCase();
  return t.every(x => hay.includes(x));
}
function hl(v){
  const raw = String(v ?? ""), t = uniq(terms());
  if(!t.length) return esc(raw);
  const re = new RegExp(t.sort((a, b) => b.length - a.length)
    .map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
  let out = "", i = 0;
  for(const m of raw.matchAll(re)){ out += esc(raw.slice(i, m.index)) + `<mark>${esc(m[0])}</mark>`; i = m.index + m[0].length; }
  return out + esc(raw.slice(i));
}

const studentRows = () => M.students.filter(s => (!S.grade0 || s.grade === S.grade0)
  && hit(s.id, s.name, `${s.grade}학년${s.ban}반`, ...s.courses.map(c => `${c.slot} ${c.subject}`)));
const courseRows = g => M.courses.filter(c => c.grade === g && hit(c.slot, c.subject, c.teacher, c.room));

const teacherLinks = v => {

function drawTools(){
  const v = S.view, out = [];
  const gradeSeg = (list, cur, attr) => segG(list, cur, attr, g => `${g}학년`);

  if(v === "student"){
    out.push(`<div class="seg">${[0, 2, 3].map(g =>
      `<button type="button" data-g0="${g}" aria-pressed="${(S.grade0 || 0) === g}">${g ? `${g}학년` : "전체"}</button>`).join("")}</div>`);
  }
  if(v === "course") out.push(gradeSeg([2, 3], S.grade, "g"));
  if(v === "klass"){
    out.push(gradeSeg([1, 2, 3], S.cg, "cg"));
    const list = bansOf(S.cg);
    if(list.length) out.push(`<div class="seg" role="group" aria-label="반">${list.map(b =>
      `<button type="button" data-b="${b}" aria-pressed="${S.ban === b}">${b}반</button>`).join("")}</div>`);
  }
  if(v === "teacher"){
    out.push(`<label class="lbl">교사
      <select class="fld" id="tsel"><option value="">— 고르기 —</option>${IX.teachers.map(t =>
        `<option${S.teacher === t ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`);
  }
  if(v === "room"){
    out.push(`<label class="lbl">장소
      <select class="fld" id="rsel"><option value="">— 고르기 —</option>${IX.rooms.map(r =>
        `<option${S.room === r ? " selected" : ""}>${esc(r)}</option>`).join("")}</select></label>`);
  }
  if(v === "roster"){
    out.push(`<label class="lbl">강좌
      <select class="fld" id="csel"><option value="">— 고르기 —</option>${M.courses.map(c =>
        `<option value="${esc(c.id)}"${S.course === c.id ? " selected" : ""}>${
          esc(`${gLabel(c.grade)} ${c.slot} · ${c.subject}${c.teacher ? ` (${c.teacher})` : ""}`)}</option>`).join("")}</select></label>`);
    out.push(`<label class="lbl">열 <input class="fld" id="cols" type="number" min="1" max="30" step="1" style="width:64px" value="${S.cols}"></label>`);
    out.push(`<label class="lbl">머리
      <select class="fld" id="head">${Object.entries(HEADS).map(([k, [l]]) =>
        `<option value="${k}"${S.head === k ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`);
  }
  /* 장소 화면은 온 칸이 같은 교실이라 장소 토글이 할 일이 없다 */
  if(["klass", "teacher", "student", "room"].includes(v))
    out.push(`<div class="opts hide-s" role="group" aria-label="시간표 표시">${
      opt("교사", "show", "teacher")}${v === "room" ? "" : opt("장소", "show", "room")}</div>`);

  out.push('<span class="grow"></span>');
  if(VIEWS[v].paper) out.push(`<button class="btn" data-a="open-print" type="button"${loaded ? "" : " disabled"}>인쇄</button>`);
  out.push('<button class="btn btn-q btn-s" data-a="reload" type="button">새로고침</button>');

  $("#tools").innerHTML = out.join("");
}

/* ---- 시간표 ---- 요일 순서로 담고, CSS가 세로로 세운다 */
function ttHTML(entries, opts = {}){
  const maxP = Math.min(9, Math.max(5, ...entries.map(e => e.period || 0)));
  const grid = new Map();
  for(const e of entries){
    const k = `${e.day}|${e.period}`;
    if(!grid.has(k)) grid.set(k, []);
    grid.get(k).push(e);
  }
  const head = `<div class="tt-h">교시</div>`
    + Array.from({ length:maxP }, (_, i) => `<div class="tt-p">${i + 1}</div>`).join("");
  const cols = DAYS.map(d => {
    let n = 0;
    const cells = Array.from({ length:maxP }, (_, i) => {
      const list = grid.get(`${d}|${i + 1}`) || [];
      if(!list.length) return `<div class="tt-c tt-x" data-p="${i + 1}교시"></div>`;
      n++;
      return `<div class="tt-c" data-p="${i + 1}교시">${
        mergeable(list) ? mergedCell(list) : list.map(e => ttCell(e, opts)).join("")}</div>`;
    }).join("");
    /* 좁은 화면에서는 빈 칸이 접히므로, 아무것도 없는 요일은 그렇다고 적어 준다 */
    return `<div class="tt-d"${n ? "" : ' data-none="수업 없음"'}>${d}</div>${cells}`;
  }).join("");
  return `<div class="tt" style="--p:${maxP}">${head}${cols}</div>`;
}
function ttMeta(e, opts){
  const own = e.room && e.grade && e.ban && e.room === `${e.grade}학년 ${e.ban}반`;
  const bits = [];
  if(opts.bans){
    const bans = e.bans.length ? e.bans : (e.ban ? [e.ban] : []);
    if(bans.length) bits.push(`<button type="button" data-cls="${e.grade}-${bans[0]}">${e.grade}-${bans.join("·")}반</button>`);
  }
  if(e.bans.length && e.ban && !opts.bans) bits.push(`분반 ${splitNo(e)}`);
  if(S.show.teacher && e.teacher) bits.push(teacherLinks(e.teacher));
  /* 제 교실에서 하는 수업에 '2학년 2반'을 또 적을 이유는 없다.
     장소 화면에서는 온 칸이 같은 교실이므로 아예 뺀다. */
  if(S.show.room && e.room && !own && !opts.noRoom) bits.push(roomLinks(e.room));
  return bits.join(" · ");
}
function ttCell(e, opts = {}){
  const t = SPECIAL[e.subject] || (e.slot ? tone(e.slot) : FLAT);
  const meta = ttMeta(e, opts);
  const nav = e.pickSlot ? `data-sl="${esc(e.grade + "|" + e.slot)}"`
    : e.course ? `data-c="${esc(e.course.id)}"`
    : e.grade && (e.ban || e.bans.length) ? `data-cls="${e.grade}-${e.bans.length ? e.bans[0] : e.ban}"` : "";
  const head = `${e.slot && !SPECIAL[e.subject] ? slotTag(e.slot) : ""}${hl(e.subject)}${
    e.guess ? '<span class="dash"> 추정</span>' : ""}`;
  /* 줄여서 보여 주므로 온전한 값은 툴팁으로 남긴다 */
  const full = [e.subject, e.teacher, opts.noRoom ? "" : e.room].filter(Boolean).join(" · ");
  return `<div class="cx" style="${t}" title="${esc(full)}">${
    nav ? `<button type="button" class="cx-h" ${nav}>${head}</button>` : `<b class="cx-h">${head}</b>`}${
    meta ? `<i>${meta}</i>` : ""}</div>`;
}
function mergedCell(list){
  const rows = [...list].sort((a, b) => Number(splitNo(a)) - Number(splitNo(b))).map(e => `
    <span class="cx-d"><span>분반 ${esc(splitNo(e))}</span>
      <span>${S.show.teacher && e.teacher ? teacherLinks(e.teacher) : ""}</span>
      <span>${S.show.room ? hl(e.room) : ""}</span></span>`).join("");
  return `<div class="cx multi" style="${FLAT}"><b class="cx-h">${hl(list[0].subject)}</b><i>${rows}</i></div>`;
}

/* ---- 학생 ---- */
function drawStudent(){
  const rows = studentRows();
  if(!rows.length) return { n:0, html:nothing(M.students.length ? "찾는 학생이 없습니다" : "신청 자료가 없습니다") };
  return { n:rows.length, html:`<div class="frame"><table>
    <thead><tr><th class="c-id">학번</th><th class="c-n">이름</th><th class="c-n">학급</th><th>선택과목</th><th class="c-c num">과목</th></tr></thead>
    <tbody>${rows.map(s => `<tr class="hit" data-u="${esc(s.id)}">
      <td class="c-id" data-l="학번">${hl(s.id)}</td>
      <td class="c-n mn" data-l="이름">${hl(s.name)}</td>
      <td class="c-n" data-l="학급">${s.ban ? `${s.grade}학년 ${s.ban}반` : '<span class="dash">미정</span>'}</td>
      <td data-l="선택과목">${s.courses.map(c => `${slotTag(c.slot)} ${hl(c.subject)}`).join(" · ") || '<span class="dash">—</span>'}</td>
      <td class="c-c num rt-side" data-l="과목">${s.courses.length}</td></tr>`).join("")}</tbody>

}

/* ---- 강좌 ---- */
function drawCourse(){
  const rows = courseRows(S.grade);
  if(!rows.length) return { n:0, html:nothing(`${gLabel(S.grade)} 강좌가 없습니다`) };
  const bySlot = new Map();
  for(const c of rows){
    if(!bySlot.has(c.slot)) bySlot.set(c.slot, []);
    bySlot.get(c.slot).push(c);
  }
  const html = [...bySlot.keys()].sort().map(slot => {
    const list = bySlot.get(slot);
    const total = list.reduce((a, c) => a + c.count, 0);
    const when = uniq(M.times.filter(t => t.grade === S.grade && t.slot === slot.charAt(0))
      .sort((a, b) => (DAY_IX.get(a.day) - DAY_IX.get(b.day)) || (a.period - b.period))
      .map(t => `${t.day}${t.period}`));
    return `<section><h2 class="cap" id="slot-${esc(slot)}">${slotTag(slot)}
        <span>${list.length}개 강좌 · ${total}명${when.length ? ` · ${when.join(" ")}` : " · 시간 없음"}</span></h2>
      <div class="frame"><table class="line">
        <thead><tr><th>과목</th><th class="c-p">교사</th><th class="c-r">장소</th><th class="c-c num">인원</th></tr></thead>
        <tbody>${list.map(c => `<tr class="hit" data-c="${esc(c.id)}" title="${esc(`${c.subject} · ${c.teacher || "미정"} · ${c.room || "미정"}`)}">
          <td class="mn" data-l="과목">${hl(c.subject)}${c.ghost ? '<span class="dash"> 강좌표 없음</span>' : ""}</td>
          <td class="c-p" data-l="교사">${teacherLinks(c.teacher)}</td>
          <td class="c-r" data-l="장소">${roomLinks(c.room)}</td>
          <td class="c-c num rt-side" data-l="인원">${c.count}</td></tr>`).join("")}</tbody>
      </table></div></section>`;
  }).join("");
  return { n:rows.length, html:`<div class="two">${html}</div>` };
}

/* ---- 학급 ---- */
function classEntries(g, b){
  const out = M.lessons.filter(r => r.grade === g && !r.slot && forClass(r, b)).map(r => ({ ...r }));
  /* 선택과목 시간에는 반 전체가 흩어진다. 무엇이 열리는지만 적는다. */
  for(const slot of uniq(M.times.filter(t => t.grade === g).map(t => t.slot)))
    for(const t of M.times.filter(t => t.grade === g && t.slot === slot)){
      const n = M.courses.filter(c => c.grade === g && c.slot.charAt(0) === slot).length;
      out.push({ grade:g, ban:b, bans:[], day:t.day, period:t.period, slot,
                 subject:`선택 ${n}개`, teacher:"", room:"", pickSlot:true });
    }
  return out;
}
function drawClass(){
  const g = S.cg, b = S.ban;
  if(!b) return { n:0, html:nothing("위에서 반을 고르세요") };
  const entries = classEntries(g, b);
  const list = studentsOf(g, b).filter(s => hit(s.id, s.name, ...s.courses.map(c => `${c.slot} ${c.subject}`)));
  const tt = entries.length ? ttHTML(entries) : nothing("시간표 자료가 없습니다");
  const roster = list.length ? `<div class="frame"><table>
    <thead><tr><th class="c-id">학번</th><th class="c-n">이름</th><th>선택과목</th><th class="c-c num">과목</th></tr></thead>
    <tbody>${list.map(s => `<tr class="hit" data-u="${esc(s.id)}">
      <td class="c-id" data-l="학번">${hl(s.id)}</td>
      <td class="c-n mn" data-l="이름">${hl(s.name)}</td>
      <td data-l="선택과목">${s.courses.map(c => `${slotTag(c.slot)} ${hl(c.subject)}`).join(" · ") || '<span class="dash">—</span>'}</td>
      <td class="c-c num rt-side" data-l="과목">${s.courses.length}</td></tr>`).join("")}</tbody></table></div>`
    : nothing(M.students.some(s => s.grade === g) ? "명단이 없습니다" : `${gLabel(g)} 신청 자료가 없습니다`);
  return { n:list.length, html:`<h2 class="cap">${g}학년 ${b}반 시간표</h2>${tt}
    <h2 class="cap">명단 <span>${list.length}명</span></h2>${roster}` };
}

/* ---- 교사 ---- */
function drawTeacher(){
  if(!S.teacher) return { n:0, html:nothing("위에서 교사를 고르세요") };
  const entries = M.lessons.filter(r => hasTeacher(r.teacher, S.teacher));
  if(!entries.length) return { n:0, html:nothing(`${S.teacher} 시간표가 없습니다`) };
  const classes = uniq(entries.flatMap(e => (e.bans.length ? e.bans : (e.ban ? [e.ban] : [])).map(b => `${e.grade}-${b}`))).sort();
  const rooms = uniq(entries.map(e => e.room).filter(Boolean)).sort();
  const mine = M.courses.filter(c => hasTeacher(c.teacher, S.teacher));
  const head = `<div class="sum">
    <span>주 <b>${entries.length}</b>시간</span><span>학급 <b>${classes.length}</b></span>
    <span>과목 <b>${uniq(entries.map(e => e.subject)).length}</b></span>
    <span>선택과목 <b>${mine.length}</b>강좌 · <b>${mine.reduce((a, c) => a + c.count, 0)}</b>명</span></div>`;
  const chips = (classes.length ? `<div class="chips" style="margin-bottom:6px"><b>학급</b>${classes.map(k =>
      `<button type="button" data-cls="${esc(k)}">${esc(k)}반</button>`).join("")}</div>` : "")
    + (rooms.length ? `<div class="chips" style="margin-bottom:10px"><b>장소</b>${rooms.map(r =>
      `<button type="button" data-rm="${esc(r)}">${hl(r)}</button>`).join("")}</div>` : "");
  const courses = mine.length ? `<h2 class="cap">담당 강좌</h2><div class="frame"><table class="line">
    <thead><tr><th class="c-s">슬롯</th><th>과목</th><th class="c-r">장소</th><th class="c-c num">인원</th></tr></thead>
    <tbody>${mine.map(c => `<tr class="hit" data-c="${esc(c.id)}" title="${esc(`${c.subject} · ${c.room || "미정"}`)}">
      <td class="c-s" data-l="슬롯">${slotTag(c.slot)}</td>
      <td class="mn" data-l="과목">${gLabel(c.grade)} ${hl(c.subject)}</td>
      <td class="c-r" data-l="장소">${roomLinks(c.room)}</td>
      <td class="c-c num rt-side" data-l="인원">${c.count}</td></tr>`).join("")}</tbody></table></div>` : "";
  return { n:entries.length, html:head + chips + ttHTML(entries, { bans:true }) + courses };
}

/* ---- 명렬표 ---- */
function rosterHeads(){
  const [, make] = HEADS[S.head];
  const out = [];
  for(let i = 0; i < S.cols; i++) out.push(heads[i] != null && heads[i] !== "" ? heads[i] : make(i));
  return out;
}
function drawRoster(){
  const c = IX.course.get(S.course);
  if(!c) return { n:0, html:nothing("위에서 강좌를 고르세요") };
  const list = c.roster.filter(s => hit(s.id, s.name));
  const hd = rosterHeads();
  const byBan = new Map();
  for(const s of c.roster) byBan.set(s.ban, (byBan.get(s.ban) || 0) + 1);
  const spread = [...byBan.entries()].sort((a, b) => a[0] - b[0]).map(([b, n]) =>
    `<button type="button" data-cls="${c.grade}-${b}">${b ? `${b}반` : "미정"} ${n}</button>`).join("");

  return { n:list.length, html:`<div class="sum">
      <span>${slotTag(c.slot)} <b>${esc(c.subject)}</b></span>
      <span>${gLabel(c.grade)}</span><span>교사 ${teacherLinks(c.teacher)}</span>
      <span>장소 ${roomLinks(c.room)}</span><span>인원 <b>${c.count}</b>명</span></div>
    ${spread ? `<div class="chips" style="margin-bottom:10px">${spread}</div>` : ""}
    <div class="rt"><table>
      <thead><tr><th class="c-1">연번</th><th class="c-2">학번</th><th class="c-3">이름</th>
        ${hd.map((v, i) => `<th class="hd"><input type="text" data-h="${i}" value="${esc(v)}"
          placeholder="${esc(S.head === "date" ? "월-일" : "항목")}" aria-label="${i + 1}번째 열 이름"></th>`).join("")}</tr></thead>
      <tbody>${list.map((s, i) => `<tr class="hit" data-u="${esc(s.id)}">
        <td class="c-1">${i + 1}</td><td class="c-2">${hl(s.id)}</td><td class="c-3">${hl(s.name)}</td>
        ${hd.map(() => "<td></td>").join("")}</tr>`).join("")
        || `<tr><td colspan="${hd.length + 3}" class="dash" style="padding:16px">수강생이 없습니다</td></tr>`}</tbody>
    </table></div>` };
}

/* ---- 장소 ---- 교사 화면과 같은 얼개. 이 교실을 언제 누가 쓰는지 한 판에 본다. */
function drawRoom(){
  if(!S.room) return { n:0, html:nothing("위에서 장소를 고르세요") };
  const entries = M.lessons.filter(r => r.room === S.room);
  const mine = M.courses.filter(c => c.room.split(" · ").includes(S.room));
  if(!entries.length && !mine.length) return { n:0, html:nothing(`${S.room} 을(를) 쓰는 수업이 없습니다`) };

  const teachers = uniq(entries.flatMap(e => teachersOf(e.teacher)).filter(realTeacher));
  const classes = uniq(entries.flatMap(e =>
    (e.bans.length ? e.bans : (e.ban ? [e.ban] : [])).map(b => `${e.grade}-${b}`))).sort();
  const head = `<div class="sum">
    <span>주 <b>${entries.length}</b>시간</span>
    <span>과목 <b>${uniq(entries.map(e => e.subject)).length}</b></span>
    <span>교사 <b>${teachers.length}</b></span>
    <span>선택과목 <b>${mine.length}</b>강좌 · <b>${mine.reduce((a, c) => a + c.count, 0)}</b>명</span></div>`;
  const chips = (teachers.length ? `<div class="chips" style="margin-bottom:6px"><b>교사</b>${
      teachers.map(t => `<button type="button" data-t="${esc(t)}">${hl(t)}</button>`).join("")}</div>` : "")
    + (classes.length ? `<div class="chips" style="margin-bottom:10px"><b>학급</b>${classes.map(k =>
      `<button type="button" data-cls="${esc(k)}">${esc(k)}반</button>`).join("")}</div>` : "");
  const grid = entries.length
    ? ttHTML(entries, { bans:true, noRoom:true })
    : '<p class="dash">반별시간표에 이 장소로 적힌 수업이 없습니다</p>';
  const courses = mine.length ? `<h2 class="cap">여기서 하는 선택과목</h2><div class="frame"><table class="line">
    <thead><tr><th class="c-s">슬롯</th><th>과목</th><th class="c-p">교사</th><th class="c-c num">인원</th></tr></thead>
    <tbody>${mine.map(c => `<tr class="hit" data-c="${esc(c.id)}" title="${esc(`${c.subject} · ${c.teacher || "미정"}`)}">
      <td class="c-s" data-l="슬롯">${slotTag(c.slot)}</td>
      <td class="mn" data-l="과목">${gLabel(c.grade)} ${hl(c.subject)}</td>
      <td class="c-p" data-l="교사">${teacherLinks(c.teacher)}</td>
      <td class="c-c num rt-side" data-l="인원">${c.count}</td></tr>`).join("")}</tbody></table></div>` : "";
  return { n:entries.length + mine.length, html:head + chips + grid + courses };
}

/* ---- 전체 ---- */
function draw({ keep = false } = {}){
  const top = window.scrollY;
  const act = document.activeElement, actId = act?.id, actO = act?.dataset?.o, actH = act?.dataset?.h;

  drawTabs();
  drawTools();
  drawSource();
  $("#gapText").textContent = GAP;
  $("#gap").hidden = !GAP || gapShut;

  let r;
  if(!loaded) r = { n:0, html:nothing(loading ? "불러오는 중" : "불러온 자료 없음") };
  else if(S.view === "student") r = drawStudent();
  else if(S.view === "course") r = drawCourse();
  else if(S.view === "klass") r = drawClass();
  else if(S.view === "teacher") r = drawTeacher();
  else if(S.view === "room") r = drawRoom();
  else r = drawRoster();
  $("#view").innerHTML = r.html;
  $("#qn").textContent = terms().length ? `${r.n}` : "";

  savePrefs();

  if(actO) $(`[data-o="${CSS.escape(actO)}"]`)?.focus({ preventScroll:true });
  else if(actH) $(`[data-h="${CSS.escape(actH)}"]`)?.focus({ preventScroll:true });
  else if(actId && ["tsel", "rsel", "csel", "cols", "head"].includes(actId)) $("#" + actId)?.focus({ preventScroll:true });

  document.documentElement.style.setProperty("--top-h", $(".top").offsetHeight + "px");
  if(keep) window.scrollTo({ top, behavior:"instant" });
}

function drawSource(){
  const list = CONFIG.SHEETS.map(x => SRC[x.key]);
  const have = list.filter(v => v.at).length;
  const flags = list.flatMap(v => v.flags.map(t => [v.name, t]));
  const hhmm = ms => new Date(ms).toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit", hour12:false });

/* ============ 인쇄 ============ */
const SIZE = { portrait:{ w:196, h:281 }, landscape:{ w:283, h:194 } };
const P = { max:11, min:6.2 };
const mm = v => v * 96 / 25.4;
const PR = { view:"", fit:null, page:"portrait" };
const stamp = () => new Date().toLocaleDateString("ko-KR", { year:"numeric", month:"2-digit", day:"2-digit" });
const qNote = () => S.q.trim() ? `검색: ${S.q.trim()}` : "";

function pageOf(v){ return v === "roster" ? "landscape" : "portrait"; }

function paperTT(entries, opts = {}){
  const maxP = Math.min(9, Math.max(5, ...entries.map(e => e.period || 0)));
  const grid = new Map();
  for(const e of entries){
    const k = `${e.day}|${e.period}`;
    if(!grid.has(k)) grid.set(k, []);
    grid.get(k).push(e);
  }
  const one = e => {
    const own = e.room && e.grade && e.ban && e.room === `${e.grade}학년 ${e.ban}반`;
    const meta = [
      opts.bans ? (e.bans.length ? e.bans : (e.ban ? [e.ban] : [])).map(b => `${e.grade}-${b}`).join("·") : "",
      e.bans.length && e.ban && !opts.bans ? `분반 ${splitNo(e)}` : "",
      S.print.teacher ? e.teacher : "", S.print.room && !own && !opts.noRoom ? e.room : ""
    ].filter(Boolean).join(" · ");
    return `<span class="pe"><b>${esc(e.subject)}</b>${meta ? `<i>${esc(meta)}</i>` : ""}</span>`;
  };
  const head = `<div class="h">교시</div>` + Array.from({ length:maxP }, (_, i) => `<div class="p">${i + 1}</div>`).join("");
  const cols = DAYS.map(d => `<div class="h">${d}</div>` + Array.from({ length:maxP }, (_, i) => {
    const list = grid.get(`${d}|${i + 1}`) || [];
    return `<div class="c">${list.map(one).join("")}</div>`;
  }).join("")).join("");
  return `<div class="ptt" style="grid-template-rows:auto repeat(${maxP},minmax(var(--pr,14mm),auto))">${head}${cols}</div>`;
}

      <tbody>${c.roster.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.id)}</td><td>${esc(s.name)}</td>
        ${hd.map(() => "<td></td>").join("")}</tr>`).join("")
        || `<tr><td colspan="${hd.length + 3}" class="pn">수강생 없음</td></tr>`}</tbody></table>${foot}</div>`;

  if(v === "klass"){

      <p class="ps">주 ${entries.length}시간</p>

  if(v === "room"){
    const entries = M.lessons.filter(r => r.room === S.room);
    return `<div class="paper"><h1>${esc(S.room)} 사용 시간표</h1>
      <p class="ps">주 ${entries.length}시간</p>
      ${paperTT(entries, { bans:true, noRoom:true })}${foot}</div>`;
  }

  const rows = courseRows(S.grade);
  return `<div class="paper"><h1>${gLabel(S.grade)} 선택과목 강좌</h1>
    <p class="ps">${rows.length}개 강좌 · ${rows.reduce((a, c) => a + c.count, 0)}명</p>

      ${S.print.count ? '<col style="width:14mm">' : ""}</colgroup>
    <thead><tr><th>슬롯</th><th>과목</th>${S.print.teacher ? "<th>교사</th>" : ""}
      ${S.print.room ? "<th>장소</th>" : ""}${S.print.count ? "<th>인원</th>" : ""}</tr></thead>
    <tbody>${rows.map(c => `<tr><td>${esc(c.slot)}</td><td class="l">${esc(c.subject)}</td>
      ${S.print.teacher ? `<td>${esc(c.teacher || "-")}</td>` : ""}
      ${S.print.room ? `<td>${esc(c.room || "-")}</td>` : ""}
      ${S.print.count ? `<td>${c.count}</td>` : ""}</tr>`).join("")}</tbody></table>${foot}</div>`;
}

/* 글자를 키울 수 있는 만큼 키우고, 남는 세로를 행이 나눠 갖고, 그래도 넘치면 통째로 줄인다 */
function fitPaper(stage, size){
  const paper = stage.querySelector(".paper");
  const limH = mm(size.h) - 2, limW = mm(size.w);
  paper.style.width = `${size.w}mm`;
  paper.style.removeProperty("--pr");
  paper.style.removeProperty("--pp");
  paper.style.transform = "none";

  const at = s => { paper.style.setProperty("--pf", `${s}pt`); return paper.getBoundingClientRect().height; };
  const best = () => {
    if(at(P.max) <= limH) return P.max;
    let lo = P.min, hi = P.max;
    for(let i = 0; i < 12; i++){ const mid = (lo + hi) / 2; if(at(mid) <= limH) lo = mid; else hi = mid; }
    return Math.floor(lo * 100) / 100;
  };
  /* 이분 탐색의 경계값은 딱 맞지 않을 수 있다. 실제로 들어갈 때까지 한 칸씩 줄인다. */
  const settle = () => {
    let font = best();
    at(font);
    for(let i = 0; i < 40 && paper.getBoundingClientRect().height > limH && font > P.min; i++){
      font = Math.max(P.min, Math.round((font - 0.05) * 100) / 100);
      at(font);
    }
    return font;
  };
  let font = settle();
  if(paper.getBoundingClientRect().height > limH){
    paper.style.setProperty("--pp", "0.5px");
    font = settle();
  }
  let h = paper.getBoundingClientRect().height;
  /* scrollWidth 는 정수로 올림돼서 1px 쯤 넘는 것처럼 보인다. 그 정도는 넘긴 것으로 치지 않는다. */
  const wide = paper.scrollWidth > limW + 1 ? limW / paper.scrollWidth : 1;
  let scale = Math.min(1, wide, limH / h);

  if(scale >= 1){
    let count = paper.querySelectorAll("tbody tr").length;
    if(!count){
      const tt = paper.querySelector(".ptt");
      count = tt ? Math.max(1, tt.style.gridTemplateRows.match(/repeat\((\d+)/)?.[1] || 7) : 1;
    }
    /* 행이 몇 개 없다고 한 줄이 손바닥만 해지면 곤란하다. 시간표 칸은 커도 읽을 만하다. */
    const cap = mm(paper.querySelector(".ptt") ? 42 : 18);
    let lo = 0, hi = Math.min(limH / Math.max(count, 1), cap);
    for(let i = 0; i < 12; i++){
      const mid = (lo + hi) / 2;
      paper.style.setProperty("--pr", `${mid}px`);
      if(paper.getBoundingClientRect().height <= limH) lo = mid; else hi = mid;
    }
    paper.style.setProperty("--pr", `${Math.floor(lo * 100) / 100}px`);
    h = paper.getBoundingClientRect().height;
    scale = Math.min(1, limH / h);
  }
  if(scale < 1) scale *= 0.998;
  paper.style.transform = `scale(${scale})`;
  return { font, scale, pt:font * scale };
}

function buildPaper(){
  const stage = $("#stage"), prev = stage.style.transform;
  const size = SIZE[PR.page];
  stage.style.width = `${size.w}mm`;
  stage.style.height = `${size.h}mm`;
  stage.style.transform = "none";
  stage.innerHTML = paperHTML(PR.view);
  PR.fit = fitPaper(stage, size);
  stage.style.transform = prev;

  const pt = PR.fit.pt, tight = pt < 7.4;
  const tips = [];
  if(S.print.room && PR.view !== "room") tips.push("장소 끄기");
  if(PR.view !== "roster" && S.print.teacher) tips.push("교사 끄기");
  const el = $("#fit");
  el.className = `fit${tight ? " tight" : ""}`;
  el.textContent = !tight ? `A4 ${PR.page === "landscape" ? "가로" : "세로"} 한 장 · ${pt.toFixed(1)}pt`
    : tips.length ? `${pt.toFixed(1)}pt — ${tips.join(", ")}` : `${pt.toFixed(1)}pt · 나눠 인쇄 권장`;
}
function scaleView(){
  const view = $("#pview"), stage = $("#stage"), size = SIZE[PR.page];
  const w = view.clientWidth - 20;
  const room2 = Math.max(240, innerHeight * 0.84 - 190);
  const s = Math.max(0.15, Math.min(1, w / mm(size.w), room2 / mm(size.h)));
  stage.style.transform = `scale(${s})`;
  stage.style.marginLeft = `${Math.max(0, (w - mm(size.w) * s) / 2)}px`;
  view.style.height = `${mm(size.h) * s + 20}px`;
}
function printOpts(){
  const out = [];
  if(PR.view !== "roster") out.push(chk("교사", "print", "teacher"));
  if(PR.view !== "room") out.push(chk("장소", "print", "room"));
  if(PR.view === "roster" || PR.view === "course") out.push(chk("인원", "print", "count"));
  return out.join("");
}
const printReady = v => v === "klass" ? !!S.ban : v === "teacher" ? !!S.teacher
  : v === "room" ? !!S.room : v === "roster" ? IX.course.has(S.course) : true;

function openPrint(){
  if(!loaded || !VIEWS[S.view].paper) return;
  if(!printReady(S.view)){
    toast(S.view === "roster" ? "인쇄할 강좌를 먼저 고르세요"
      : S.view === "klass" ? "인쇄할 반을 먼저 고르세요"
      : S.view === "room" ? "인쇄할 장소를 먼저 고르세요" : "인쇄할 교사를 먼저 고르세요");
    return;
  }
  PR.view = S.view;
  PR.page = pageOf(S.view);
  $("#pageRule").textContent = `@page{size:A4 ${PR.page};margin:7mm}`;
  $("#pview").appendChild($("#stage"));
  $("#pset").innerHTML = printOpts();
  if(!$("#pdlg").open) $("#pdlg").showModal();
  buildPaper();
  scaleView();
}
function doPrint(){
  const stage = $("#stage");
  $("#pdlg").close();
  $("#proot").appendChild(stage);
  stage.style.transform = "none";
  stage.style.marginLeft = "0";
  printing = true;
  document.body.classList.add("pr");
  clearTimeout(printTimer);
  printTimer = setTimeout(endPrint, 4000);
  print();
}
function endPrint(){
  clearTimeout(printTimer);
  if(!printing) return;
  printing = false;
  document.body.classList.remove("pr");
  if($("#pdlg").open){ $("#pview").appendChild($("#stage")); scaleView(); }
}
addEventListener("afterprint", endPrint);
addEventListener("beforeprint", () => {
  if(printing || !loaded) return;
  const open = $("#pdlg").open;
  if(!open && (!VIEWS[S.view].paper || !printReady(S.view))) return;
  if(!open){
    PR.view = S.view;
    PR.page = pageOf(S.view);
    $("#pageRule").textContent = `@page{size:A4 ${PR.page};margin:7mm}`;
  }
  $("#proot").appendChild($("#stage"));
  $("#stage").style.transform = "none";
  $("#stage").style.marginLeft = "0";
  try{ if(!open) buildPaper(); }catch{ return; }
  printing = true;
  document.body.classList.add("pr");
  clearTimeout(printTimer);
  printTimer = setTimeout(endPrint, 4000);
});

    <div class="set"><span>테마</span><div class="seg">${
      [["light","밝게"],["dark","어둡게"],["system","시스템"]].map(([v, l]) =>
        `<button type="button" data-th="${v}" aria-pressed="${S.theme === v}">${l}</button>`).join("")}</div></div>
    <div class="set"><span>글자</span><div class="seg">${
      [[0.92,"작게"],[1,"보통"],[1.1,"크게"],[1.22,"아주 크게"]].map(([v, l]) =>
        `<button type="button" data-fs="${v}" aria-pressed="${S.fs === v}">${l}</button>`).join("")}</div></div>
    <h3>단축키</h3>
    <div class="keys">
      <div><kbd>1</kbd>–<kbd>6</kbd><span>화면</span></div>
      <div><kbd>/</kbd><span>검색</span></div>
      <div><kbd>←</kbd><kbd>→</kbd><span>학년·반 옮기기</span></div>
      <div><kbd>P</kbd><span>인쇄</span></div>
      <div><kbd>R</kbd><span>새로고침</span></div>
      <div><kbd>S</kbd><span>설정</span></div>
      <div><kbd>Esc</kbd><span>검색 지우기</span></div>
    </div>
    <h3>슬롯 색</h3>
    <div class="chips">${uniq(M.courses.map(c => c.slot)).sort().map(s =>
      `<span style="${tone(s)}"><i class="cm"></i>${esc(s)}</span>`).join("") || "<span>—</span>"}</div>
    <h3>이 앱이 하는 일</h3>
    <p style="font-size:var(--f-sm);color:var(--ink-2)">구글 시트 6개를 읽어 보여 줍니다.
      시트에 쓰지 않으므로, 자료를 고치려면 시트를 고치고 새로고침하세요.
      화면 맨 아래 <b>자료 출처</b>에 읽지 못한 행과 어긋난 곳이 적힙니다.</p>`;
  if(!$("#sdlg").open) $("#sdlg").showModal();
}

/* ============ 옮겨 가기 ============ */
function toClass(key){
  const [g, b] = String(key).split("-").map(num);
  if(!g) return;
  $("#ddlg").close();
  S.cg = g; S.ban = b || 0; S.view = "klass"; S.q = ""; $("#q").value = "";
  draw();
  window.scrollTo({ top:0, behavior:"instant" });
}
function toTeacher(name){
  if(!IX.teachers.includes(name)) return;
  $("#ddlg").close();
  S.teacher = name; S.view = "teacher"; S.q = ""; $("#q").value = "";
  draw();
  window.scrollTo({ top:0, behavior:"instant" });
}
function toRoom(name){
  if(!IX.rooms.includes(name)) return;
  $("#ddlg").close();
  S.room = name; S.view = "room"; S.q = ""; $("#q").value = "";
  draw();
  window.scrollTo({ top:0, behavior:"instant" });
}
function toSlot(key){
  const [g, slot] = String(key).split("|");
  $("#ddlg").close();
  S.grade = num(g) === 3 ? 3 : 2; S.view = "course"; S.q = ""; $("#q").value = "";
  draw();
  $(`#slot-${CSS.escape(slot)}`)?.scrollIntoView({ block:"start", behavior:"instant" });
}
function toRoster(id){
  if(!IX.course.has(id)) return;
  $("#ddlg").close();
  S.course = id; S.view = "roster"; S.q = ""; $("#q").value = "";
  draw();
  window.scrollTo({ top:0, behavior:"instant" });
}

/* ============ 조작 ============ */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if(!t) return;

  if(t.dataset.v){ go(t.dataset.v); return; }
  if(t.dataset.u){ openDetail("student", t.dataset.u); return; }
  if(t.dataset.c){ openDetail("course", t.dataset.c); return; }
  if(t.dataset.cls){ toClass(t.dataset.cls); return; }
  if(t.dataset.t){ toTeacher(t.dataset.t); return; }
  if(t.dataset.rm){ toRoom(t.dataset.rm); return; }
  if(t.dataset.sl){ toSlot(t.dataset.sl); return; }
  if(t.dataset.g){ S.grade = num(t.dataset.g); draw(); return; }
  if(t.dataset.g0 != null){ S.grade0 = num(t.dataset.g0); draw({ keep:true }); return; }
  if(t.dataset.cg){ S.cg = num(t.dataset.cg); S.ban = 0; draw(); return; }
  if(t.dataset.b){ S.ban = num(t.dataset.b); draw(); return; }
  if(t.dataset.o){
    const [g, k] = t.dataset.o.split(".");
    if(typeof S[g]?.[k] === "boolean"){ S[g][k] = !S[g][k]; draw({ keep:true }); }
    return;
  }
  if(t.dataset.th){ S.theme = t.dataset.th; applyPrefs(); savePrefs(); openSettings(); return; }
  if(t.dataset.fs){ S.fs = +t.dataset.fs; applyPrefs(); savePrefs(); openSettings(); return; }

  switch(t.dataset.a){
    case "reload": reload(); break;
    case "alert-x": hideWarn(); break;
    case "gap-x": gapShut = true; $("#gap").hidden = true; break;
    case "src":
      $("#src").open = true;
      $("#src").scrollIntoView({ block:"start", behavior:"smooth" });
      break;
    case "close": t.closest("dialog")?.close(); break;
    case "open-print": openPrint(); break;
    case "print": doPrint(); break;
    case "d-prev": moveDetail(-1); break;
    case "d-next": moveDetail(1); break;
    case "d-roster": toRoster(DET.id); break;
    case "d-copy":
      navigator.clipboard?.writeText(detailText())
        .then(() => toast("복사했습니다"), () => toast("복사할 수 없습니다"));
      break;
    case "clear":
      try{ localStorage.removeItem(CACHE); }catch{}
      cachedAt = 0;
      drawSource();
      toast("이 기기에 보관하던 사본을 지웠습니다");
      break;
  }
});

/* 표의 행을 눌러도 열린다 — 행 안의 단추가 먼저 잡히면 그쪽이 이긴다 */
document.addEventListener("click", ev => {
  if(ev.target.closest("button")) return;
  const tr = ev.target.closest("tr.hit");
  if(!tr) return;
  if(tr.dataset.u) openDetail("student", tr.dataset.u);
  else if(tr.dataset.c) openDetail("course", tr.dataset.c);
  else if(tr.dataset.cls) toClass(tr.dataset.cls);
});

document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.o && el.type === "checkbox"){
    const [g, k] = el.dataset.o.split(".");
    if(typeof S[g]?.[k] === "boolean"){
      S[g][k] = el.checked;
      savePrefs();
      if(g === "print"){ buildPaper(); scaleView(); } else draw({ keep:true });
    }
    return;
  }
  if(el.id === "tsel"){ S.teacher = el.value; draw(); return; }
  if(el.id === "rsel"){ S.room = el.value; draw(); return; }
  if(el.id === "csel"){ S.course = el.value; draw(); return; }
  if(el.id === "head"){ S.head = el.value; heads = []; draw({ keep:true }); return; }
  if(el.id === "cols"){
    const n = Math.max(1, Math.min(30, num(el.value) || 1));
    S.cols = n; el.value = n;
    draw({ keep:true });
  }
});

let qt = null;
const applyQ = () => { S.q = $("#q").value; draw({ keep:true }); };
document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "q"){
    clearTimeout(qt);
    if(!el.dataset.ime) qt = setTimeout(applyQ, 140);
    return;
  }
  if(el.dataset.h != null){ heads[num(el.dataset.h)] = el.value; savePrefs(); }
});
document.addEventListener("compositionstart", ev => { if(ev.target.id === "q") ev.target.dataset.ime = "1"; });
document.addEventListener("compositionend", ev => {
  if(ev.target.id !== "q") return;
  delete ev.target.dataset.ime;
  clearTimeout(qt);
  applyQ();
});

for(const id of ["ddlg", "pdlg", "sdlg"]){
  const dlg = $("#" + id);
  dlg.addEventListener("click", ev => {
    if(ev.target !== dlg) return;
    const r = dlg.getBoundingClientRect();
    if(ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) dlg.close();
  });
}
$("#ddlg").addEventListener("close", () => { DET.kind = ""; DET.id = ""; DET.list = []; });
$("#pdlg").addEventListener("close", () => {
  $("#proot").appendChild($("#stage"));
  $("#stage").style.transform = "none";
  $("#stage").style.marginLeft = "0";
  $("#pageRule").textContent = "@page{size:A4 portrait;margin:7mm}";
});
$("#sdlg").addEventListener("close", () => draw({ keep:true }));
$("#setBtn").addEventListener("click", openSettings);

document.addEventListener("keydown", ev => {
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const a = document.activeElement;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(a?.tagName || "") || a?.isContentEditable;
  const open = $$("dialog[open]").length > 0;

  if(ev.key === "Escape" && !open && S.q){ S.q = ""; $("#q").value = ""; draw({ keep:true }); return; }
  if(open && (ev.key === "ArrowLeft" || ev.key === "ArrowRight") && !typing && $("#ddlg").open){
    ev.preventDefault();
    moveDetail(ev.key === "ArrowLeft" ? -1 : 1);
    return;
  }
  if(typing || open) return;

  if(ev.key === "/"){ ev.preventDefault(); $("#q")?.focus(); return; }
  const n = Number(ev.key);
  if(Number.isInteger(n) && n >= 1 && n <= VK.length){ ev.preventDefault(); go(VK[n - 1]); return; }
  const k = ev.key.toLowerCase();
  if(k === "r"){ ev.preventDefault(); reload(); return; }
  if(k === "p" && loaded && VIEWS[S.view].paper){ ev.preventDefault(); openPrint(); return; }
  if(k === "s"){ ev.preventDefault(); openSettings(); return; }
  if(ev.key === "ArrowLeft" || ev.key === "ArrowRight"){
    const d = ev.key === "ArrowLeft" ? -1 : 1;
    if(S.view === "course"){ ev.preventDefault(); S.grade = S.grade === 2 ? 3 : 2; draw(); }
    else if(S.view === "klass"){
      const list = bansOf(S.cg);
      if(!list.length) return;
      ev.preventDefault();
      const i = list.indexOf(S.ban);
      S.ban = list[(i < 0 ? 0 : i + d + list.length) % list.length];
      draw();
    }
  }
});

let rt = null;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    document.documentElement.style.setProperty("--top-h", $(".top").offsetHeight + "px");
    if($("#pdlg").open) scaleView();
  }, 150);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(S.theme === "system") applyPrefs(); });
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && Date.now() - lastLoad > CONFIG.POLL_MS) reload();
});
setInterval(() => { if(!document.hidden && !printing) reload(); }, CONFIG.POLL_MS);

/* ============ 시작 ============ */
loadPrefs();
applyPrefs();
loadCache();
loading = true;
draw();
reload();
</script>
</body>
</html>
