<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선택과목 업무 대시보드 V3</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface-hover:#eef1f4;
  --text-main:#171a1f; --text-muted:#5f6770; --border:#c9cfd6; --border-soft:#e7eaee;
  --accent:#228be6; --accent-soft:#e7f5ff; --accent-glow:rgba(34,139,230,.14);
  --live:#2f9e44; --violet:#7950f2; --danger:#c92a2a;
  --shadow:0 12px 30px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text-main);overflow-y:scroll}

.header-wrapper{position:sticky;top:0;background:rgba(248,250,252,0.9);backdrop-filter:blur(10px);z-index:100;border-bottom:1px solid var(--border);padding:12px 20px}
.header{max-width:1500px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.header h1{font-size:22px;font-weight:900;background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:8px}
.header h1 .icon{-webkit-text-fill-color:initial}
.header-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);font-weight:700;flex-wrap:wrap}
.stats-badge{background:var(--surface);border:1px solid var(--border);padding:5px 10px;border-radius:8px;font-size:12px}
.sync-time{font-size:12px;color:var(--text-muted)}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;transition:.2s;padding:0}
.icon-btn:hover{background:var(--surface-hover);transform:rotate(90deg)}

.controls{display:flex;gap:4px;background:var(--surface);padding:5px;border-radius:12px;border:1px solid var(--border);box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);flex-wrap:wrap;justify-content:center}
.btn{background:transparent;color:var(--text-muted);border:none;padding:9px 13px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;transition:.2s;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--surface-hover);color:var(--text-main)}
.btn.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px var(--accent-glow)}
.btn.sub{padding:7px 12px;font-size:13px;border:1px solid var(--border);background:var(--surface)}
.btn.sub.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.container{max-width:1500px;margin:0 auto;padding:32px 20px}
.tab-pane{display:none}
.tab-pane.active{display:block}

.search-wrapper{position:relative;width:100%;max-width:600px;margin:0 auto 24px}
.search-input{width:100%;padding:15px 18px 15px 42px;border-radius:14px;border:2px solid var(--border);font-size:15px;font-family:'Pretendard';font-weight:700;outline:none;transition:.2s;box-shadow:0 4px 10px rgba(0,0,0,0.02);background:var(--surface);color:var(--text-main)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.search-input::placeholder{color:#94a3b8}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text-muted)}

.autocomplete-list{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;max-height:320px;overflow-y:auto;box-shadow:0 15px 35px rgba(0,0,0,0.12);z-index:50;display:none}
.autocomplete-item{padding:12px 18px;cursor:pointer;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;transition:.1s;display:flex;align-items:center;justify-content:space-between;gap:12px}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover,.autocomplete-item.highlight{background:#eff6ff;color:var(--accent)}

.grid-layout{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,0.03)}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,0.08);border-color:#cbd5e1}
.card.clickable{cursor:pointer}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.card-title{font-size:18px;font-weight:800;color:var(--text-main)}
.badge{font-size:12px;padding:4px 9px;border-radius:20px;background:#f1f5f9;color:#475569;font-weight:800;border:1px solid #e2e8f0;display:inline-block;white-space:nowrap}

.data-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
.data-table th,.data-table td{border:1px solid var(--border);padding:10px;text-align:center}
.data-table th{background:#f8fafc;font-weight:800;color:var(--text-main)}
.data-table td{font-weight:700;font-size:14px}
.date-input{width:100%;border:none;border-bottom:2px solid transparent;background:transparent;text-align:center;font-family:'Pretendard';font-weight:800;color:var(--text-main);font-size:14px;padding:4px;outline:none;transition:.2s}
.date-input:focus{border-color:var(--accent)}

.inline-error{color:var(--danger);font-weight:800;font-size:13px;margin-top:8px;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;display:none}
.inline-error.show{display:block}

.slot-subtabs{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.slot-group{margin-bottom:28px}
.slot-group-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.slot-label{font-size:18px;font-weight:900;padding:6px 14px;border-radius:10px;color:#fff}
.slot-summary{font-size:13px;color:var(--text-muted);font-weight:700}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;justify-content:center}
.chip{padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-weight:700;font-size:13px;transition:.15s;font-family:inherit}
.chip:hover{background:var(--surface-hover)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filter-bar label{display:block;font-weight:800;margin-bottom:6px;font-size:13px;color:var(--text-muted)}
.filter-bar select,.filter-bar input[type=text]{padding:11px 14px;border-radius:10px;border:2px solid var(--border);font-weight:700;font-size:14px;outline:none;background:var(--surface);color:var(--text-main);font-family:inherit}
.filter-bar select:focus,.filter-bar input[type=text]:focus{border-color:var(--accent)}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .3s}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

.dist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px}
.dist-cell{padding:10px 12px;background:var(--surface-hover);border-radius:8px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dist-cell .subj{color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist-cell .cnt{color:var(--accent);font-weight:900;flex-shrink:0}

.breakdown{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px;padding:12px;background:var(--surface-hover);border-radius:10px}
.breakdown-item{background:var(--surface);padding:5px 11px;border-radius:6px;font-size:13px;font-weight:700;border:1px solid var(--border)}
.breakdown-item strong{color:var(--accent)}

/* 숨은 하이퍼링크: 커서만 살짝 바꿔서 눌러볼 수 있게 */
[data-nav]{cursor:pointer}
[data-nav]:active{opacity:0.6}

/* 시간표 격자 */
.timetable{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;margin-bottom:22px}
.timetable th,.timetable td{padding:0;vertical-align:top}
.timetable thead th{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 4px;font-weight:800;font-size:14px;color:var(--text-main);text-align:center}
.timetable thead th.day-header{background:linear-gradient(135deg,#eff6ff,#ede9fe);font-size:15px}
.timetable td.period-label{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 4px;font-weight:800;font-size:13px;color:var(--text-muted);text-align:center;width:44px}
.tt-cell{min-height:68px;height:68px;border-radius:8px;padding:7px 8px;font-size:14px;line-height:1.3;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3px;overflow:hidden}
.tt-cell.empty{background:#fafbfc;border-style:dashed;border-color:#e5e7eb}
.tt-cell.has-slot{border-left-width:4px;border-left-style:solid}
.tt-cell .tt-subj{font-weight:800;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px;width:100%;text-align:center}
.tt-cell .tt-sub{font-size:12.5px;color:var(--text-muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:center;align-items:center;gap:6px;width:100%}
.tt-cell .tt-slot-badge{font-size:11px;padding:1px 6px;border-radius:4px;color:#fff;font-weight:900;flex-shrink:0}
.tt-cell.jayul{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.tt-cell.jaseup{background:#e0e7ff;border-color:#a5b4fc;color:#4338ca}
.tt-cell.clickable{cursor:pointer;transition:.15s}
.tt-cell.clickable:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,0.08)}

.tt-section-title{font-size:17px;font-weight:800;margin:18px 0 10px;color:var(--text-main);display:flex;align-items:center;gap:8px}

@media(max-width:640px){
  .timetable{font-size:12px}
  .tt-cell{min-height:60px;height:60px;padding:6px 5px}
  .tt-cell .tt-subj{font-size:13px}
  .tt-cell .tt-sub{font-size:11px}
}

/* 모바일 전용: 요일 탭 + 세로 리스트 */
.tt-mobile{display:none}
@media(max-width:640px){
  .timetable{display:none}
  .tt-mobile{display:block}
  .tt-day-tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface);padding:5px;border-radius:12px;border:1px solid var(--border);box-shadow:0 2px 6px rgba(0,0,0,.04)}
  .tt-day-tab{flex:1;background:transparent;border:none;padding:10px 0;border-radius:8px;font-weight:800;font-size:15px;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:.15s}
  .tt-day-tab.active{background:var(--accent);color:#fff;box-shadow:0 4px 10px var(--accent-glow)}
  .tt-day-list{display:flex;flex-direction:column;gap:6px}
  .tt-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);min-height:44px}
  .tt-row.empty{background:#fafbfc;border-style:dashed;border-color:#e5e7eb;color:#9ca3af;font-weight:700;font-size:13px;min-height:36px}
  .tt-row.has-slot{border-left-width:4px;border-left-style:solid}
  .tt-row.jayul{background:#fef3c7;border-color:#fcd34d;color:#92400e}
  .tt-row.jaseup{background:#e0e7ff;border-color:#a5b4fc;color:#4338ca}
  .tt-row-period{font-weight:900;font-size:13px;color:var(--text-muted);min-width:36px;flex-shrink:0}
  .tt-row.jayul .tt-row-period,.tt-row.jaseup .tt-row-period{color:inherit}
  .tt-row-body{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
  .tt-row-subj{font-weight:800;font-size:15px;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-row.jayul .tt-row-subj,.tt-row.jaseup .tt-row-subj{color:inherit}
  .tt-row-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .tt-row-teacher{font-size:13px;color:var(--text-muted);font-weight:700}
  .tt-row-slot{font-size:11px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:900}
}

@media(max-width:640px){
  .header h1{font-size:19px}
  .container{padding:20px 14px}
  .card-title{font-size:17px}
}

/* ============================================================
   교사용 업무 UI 초안
   ============================================================ */
html{background:var(--bg)}
body{min-height:100%;background:var(--bg);color:var(--text-main);font-size:14px;font-weight:400}
button,input,select{font:inherit}

.header-wrapper{
  position:sticky;top:0;z-index:500;padding:0;background:var(--surface);
  border-bottom:1px solid var(--border-soft);backdrop-filter:none;box-shadow:none
}
.header{
  width:100%;max-width:1680px;min-height:52px;margin:0 auto;padding:0 20px;
  display:grid;grid-template-columns:auto minmax(320px,1fr) auto;gap:24px;align-items:center;flex-wrap:nowrap
}
.brand-block{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand-title{font-size:15px;font-weight:750;letter-spacing:-.25px}
.teacher-badge{padding:2px 6px;border:1px solid var(--border);border-radius:4px;color:var(--text-muted);font-size:10.5px;font-weight:650}
.primary-nav{height:52px;display:flex;align-items:stretch;justify-content:center;gap:22px}
.primary-tab{
  position:relative;min-height:52px;padding:0 2px;border:0;background:transparent;color:var(--text-muted);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap
}
.primary-tab:hover{color:var(--text-main)}
.primary-tab.active{color:var(--accent)}
.primary-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.primary-tab:focus-visible,.subnav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.header-tools{display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap}
.header-meta{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:11.5px;font-weight:500;flex-wrap:nowrap}
.stats-badge{padding:3px 7px;border:0;border-radius:5px;background:var(--bg);font-size:11.5px;font-weight:550}
.sync-time{font-size:11px;color:var(--text-muted)}
.icon-btn{
  width:auto;height:32px;min-width:32px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);color:var(--text-main);font-size:12px;font-weight:600
}
.icon-btn:hover{background:var(--surface-hover);transform:none;border-color:var(--border)}

.subnav-shell{background:color-mix(in srgb,var(--bg) 96%,transparent);border-top:1px solid var(--border-soft)}
.subnav-inner{
  width:100%;max-width:1680px;min-height:44px;margin:0 auto;padding:6px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px
}
.view-context{display:flex;align-items:center;gap:8px;min-width:0}
.view-group-label{font-size:13px;font-weight:700;white-space:nowrap}
.view-description{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:3px;padding:3px;border:1px solid var(--border);border-radius:7px;background:var(--surface);box-shadow:none;flex-wrap:nowrap}
.subnav-btn{
  min-height:29px;padding:4px 9px;border:0;border-radius:5px;background:transparent;color:var(--text-muted);
  font-size:12px;font-weight:550;cursor:pointer;white-space:nowrap
}
.subnav-btn:hover{background:var(--surface-hover);color:var(--text-main)}
.subnav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.subnav-btn[hidden]{display:none}
.subnav-shell.roster-mode .controls{display:none}

.container{width:100%;max-width:1680px;margin:0 auto;padding:16px 20px 36px}
.tab-pane>div[style*="text-align:center"]{text-align:left!important;margin-bottom:14px!important}
.tab-pane>div[style*="text-align:center"]>h2,
.tab-pane h2{margin:0 0 10px!important;font-size:18px!important;font-weight:700!important;letter-spacing:-.2px}
.tab-pane>div[style*="text-align:center"]>p{margin:0 0 10px!important;font-size:12px!important;font-weight:450!important}

.search-wrapper{width:100%;max-width:560px;margin:0 0 18px}
.search-input{height:38px;padding:7px 11px 7px 36px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;font-weight:450;box-shadow:none}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.search-icon{left:11px;font-size:15px}
.autocomplete-list{top:calc(100% + 4px);border:1px solid var(--border);border-radius:7px;box-shadow:0 10px 25px rgba(0,0,0,.1)}
.autocomplete-item{padding:9px 11px;border-bottom:1px solid var(--border-soft);font-size:13px;font-weight:500}

.grid-layout{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.card{padding:12px;border:1px solid var(--border-soft);border-radius:7px;background:var(--surface);box-shadow:none;transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease}
.card:hover{transform:none;border-color:var(--border);box-shadow:none}
.card.clickable:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.card-header{margin-bottom:8px}
.card-title{font-size:15px!important;font-weight:650!important;letter-spacing:-.1px}
.badge{padding:2px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface-hover);color:var(--text-main);font-size:11px;font-weight:600}

.slot-subtabs{justify-content:flex-start;gap:3px;margin-bottom:10px;padding:3px;border:1px solid var(--border);border-radius:7px;background:var(--surface);width:max-content}
.btn,.btn.sub{min-height:30px;padding:4px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text-main);font-size:12px;font-weight:600;box-shadow:none}
.btn:hover,.btn.sub:hover{background:var(--surface-hover)}
.btn.active,.btn.sub.active{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:none}
.slot-subtabs .btn{border:0;background:transparent;color:var(--text-muted)}
.slot-subtabs .btn.active{background:var(--accent-soft);color:var(--accent)}
.slot-group{margin-bottom:20px}
.slot-group-header{gap:8px;margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--border-soft)}
.slot-label{padding:3px 8px;border-radius:5px;font-size:13px;font-weight:700}
.slot-summary{font-size:11.5px;font-weight:550}

.chip-row{justify-content:flex-start;gap:4px;margin-bottom:12px}
.chip{min-height:30px;padding:4px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12px;font-weight:550}
.chip:hover{background:var(--surface-hover)}
.chip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.filter-bar{gap:8px;align-items:flex-end;margin-bottom:10px}
.filter-bar label{margin-bottom:4px;font-size:11.5px;font-weight:600;color:var(--text-muted)}
.filter-bar select,.filter-bar input[type=text]{height:36px;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12.5px;font-weight:500}
.filter-bar select:focus,.filter-bar input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}

.tt-section-title{margin:16px 0 7px;font-size:14px;font-weight:650}
.timetable{border-spacing:2px;margin-bottom:18px}
.timetable thead th{padding:6px 4px;border:1px solid var(--border-soft);border-radius:5px;background:var(--surface-hover);font-size:12px;font-weight:600;color:var(--text-muted)}
.timetable thead th.day-header{background:var(--surface-hover);font-size:12px}
.timetable td.period-label{width:42px;padding:6px 4px;border:1px solid var(--border-soft);border-radius:5px;font-size:11.5px;font-weight:600}
.tt-cell{height:62px;min-height:62px;padding:6px;border:1px solid var(--border-soft);border-radius:5px;font-size:12px;gap:2px}
.tt-cell.clickable:hover{transform:none;box-shadow:none;border-color:var(--accent)}
.tt-cell .tt-subj{font-size:12.5px;font-weight:600}
.tt-cell .tt-sub{font-size:10.5px;font-weight:450}
.tt-cell .tt-slot-badge{font-size:9.5px;font-weight:650}

/* ============================================================

:root{
  --bg:#f5f6f8;

  --border-soft:#e5e9ed;
  --accent:#228be6;

  --row-h:39px;
  --header-h:52px;
  --subnav-h:45px;
}
html,body{height:100%;overflow:hidden}
body{
  display:flex;flex-direction:column;min-height:0;font-size:14px;line-height:1.45;font-weight:400;
  letter-spacing:-.12px;font-feature-settings:"tnum" 1,"kern" 1;background:var(--bg)

.header-wrapper{position:relative;top:auto;flex:0 0 auto;z-index:500}

.icon-btn{height:32px;min-height:32px;padding:3px 9px;font-size:12px;font-weight:600}

.subnav-inner{height:var(--subnav-h);min-height:var(--subnav-h);padding:6px 18px}
.view-group-label{font-size:14px;font-weight:700}.view-description{font-size:12px;font-weight:450}

.container{

<body>

</div>

<div class="header-wrapper no-print">
  <div class="header">

  <div id="tab_location" class="tab-pane"></div>

<script>
/* ============================================================
   상수 & 유틸
   ============================================================ */
const SHEET_ID = '1ZwOdHmsFGbCNTDJtUvLk5ExLxgLCAXyTVglkULv99lQ';
const SC = {"A":"#ef4444","B":"#f97316","C":"#eab308","D":"#22c55e","E":"#3b82f6","F":"#ef4444","G":"#f97316","H":"#8b5cf6","I":"#06b6d4","J":"#14b8a6","K":"#a855f7","L":"#ec4899","M":"#6366f1","N":"#0ea5e9","O":"#dc2626","P":"#ea580c","Q":"#ca8a04","R":"#16a34a","S":"#0891b2","T":"#2563eb","U":"#7c3aed","V":"#c026d3","W":"#db2777"};

function escapeHtml(str){
  if(str==null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function splitTeachers(value){
  return String(value || '').split(/[\/／]/).map(name=>name.trim()).filter(Boolean);
}
function hasTeacher(value, teacher){
  return splitTeachers(value).some(name=>name === teacher);
}
function teachersOverlap(a, b){
  const right = new Set(splitTeachers(b));
  return splitTeachers(a).some(name=>right.has(name));
}
function renderTeacherLinks(value){
  const names = splitTeachers(value);
  if(!names.length || (names.length === 1 && names[0] === '미정')) return '미정';
  return names.map(name=>`<span data-nav="teacher" data-arg1="${escapeHtml(name)}">${escapeHtml(name)}</span>`).join('<span class="teacher-separator"> / </span>');
}
function debounce(fn, ms){
  let t;
  return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); };
}
function slotColor(s){ return SC[s] || SC[(s||'').charAt(0)] || 'var(--accent)'; }
function findClassroom(grade, slot, subject){
  return classroomData.find(c => c.grade===grade && c.slot===slot && c.subject===subject);
}
function formatRelativeTime(ts){
  if(!ts) return '';
  const diff = Math.floor((Date.now()-ts)/1000);
  if(diff < 10) return '방금 전';
  if(diff < 60) return diff+'초 전';
  if(diff < 3600) return Math.floor(diff/60)+'분 전';
  return Math.floor(diff/3600)+'시간 전';
}

/* ============================================================
   상태
   ============================================================ */
let allStudents = [];
let classroomData = [];
let scheduleData = [];     // 반별시간표: {grade, ban, day, period, subject, teacher, slot}
let slotTimeMap = [];      // 슬롯시간매핑: {grade, slot, day, period}
let dataLoaded = 0;
let lastLoadTime = null;
let errorTimeout = null;
const TOTAL = 6;
const renderedTabs = new Set();

/* ============================================================
   파싱 (원본 유지)
   ============================================================ */
function getGvizValue(row, index) {
  const cell = row?.c?.[index];
  if (!cell || cell.v === null || cell.v === undefined) return '';
  return String(cell.f ?? cell.v).trim();
}

function normalizeSlot(value) {
  return String(value || '').trim().replace(/\s+/g, '').toUpperCase();
}

function normalizeSubject(value) {
  return String(value || '').trim().replace(/\s+/g, '');
}

function parseTargetBans(value) {
  return [...new Set(String(value || '')
    .split(/[,，/\s]+/)
    .map(v => parseInt(v, 10))
    .filter(Number.isFinite))];
}

function inferTargetBans(grade, ban, subject) {
  const key = normalizeSubject(subject);
  const b = String(ban || '');
  if ((grade === 1 && key === '공통수학2') || (grade === 2 && key === '미적분Ⅰ')) {
    if (['1','6'].includes(b)) return [1];
    if (['2','3','7'].includes(b)) return [2,3];
    if (['4','5','8'].includes(b)) return [4,5];
  }
  if ((grade === 1 && key === '공통영어2') || (grade === 2 && key === '영어Ⅱ')) {
    if (['1','2','6'].includes(b)) return [1,2];
    if (['3','4','7'].includes(b)) return [3,4];
    if (['5','8'].includes(b)) return [5];
  }
  return [];
}

function rowMatchesClass(row, ban) {
  return row.targetBans?.length ? row.targetBans.includes(Number(ban)) : row.ban === Number(ban);
}

function normalizeRoom(value, gradeStr, banValue) {
  const room = String(value || '').trim().replace(/\s+/g, ' ');
  if (!room) return '';
  const grade = String(gradeStr || '').match(/(\d+)/);
  const ban = parseInt(banValue, 10);
  if (room === '반' && grade && ban) return grade[1] + '학년 ' + ban + '반';
  let match = room.match(/^(\d+)\s*[-–]\s*(\d+)$/);
  if (match) return match[1] + '학년 ' + parseInt(match[2], 10) + '반';
  match = room.match(/^(\d+)\s*학년\s*(\d+)\s*반$/);
  if (match) return match[1] + '학년 ' + parseInt(match[2], 10) + '반';
  match = room.match(/^(\d+)\s*반$/);
  if (match && grade) return grade[1] + '학년 ' + parseInt(match[1], 10) + '반';
  return room;
}

function parseStudentSheet(data, gradeStr) {
  if (!data?.table) return;
  const cols = data.table.cols || [];
  const rows = data.table.rows || [];
  const headers = cols.map(column => String(column.label || '').trim());
  let idIndex = headers.findIndex(header => header.includes('학번'));
  let nameIndex = headers.findIndex(header => header.includes('이름') || header.includes('성명'));
  if (idIndex === -1) idIndex = 0;
  if (nameIndex === -1) nameIndex = 1;

  const subjectCols = headers
    .map((name, index) => ({ name, index }))
    .filter(item => item.index !== idIndex && item.index !== nameIndex && item.name);

  for (const row of rows) {
    const id = getGvizValue(row, idIndex);
    const name = getGvizValue(row, nameIndex);
    if (!id || !name) continue;
    let homeroom = '미정';
    const matched = id.match(/^(\d)(\d{2})(\d{2})$/);
    if (matched) homeroom = matched[1] + '학년 ' + parseInt(matched[2], 10) + '반';

    const subjects = {};
    for (const subject of subjectCols) {
      const slot = getGvizValue(row, subject.index);
      if (slot && slot !== '-' && slot !== '0') subjects[subject.name] = slot;
    }
    if (Object.keys(subjects).length) allStudents.push({ id, name, grade: gradeStr, homeroom, subjects });
  }
}

function parseSchedule(data) {
  if (!data?.table) return;
  const cols = data.table.cols || [];
  const rows = data.table.rows || [];
  const labels = cols.map(column => String(column.label || '').trim());
  const indexOf = name => labels.findIndex(label => label === name);
  const gradeIndex = indexOf('학년');
  const banIndex = indexOf('반');
  const dayIndex = indexOf('요일');
  const periodIndex = indexOf('교시');
  const subjectIndex = indexOf('과목');
  const teacherIndex = indexOf('교사');
  const slotIndex = indexOf('슬롯');
  const foundRoomIndex = indexOf('수업장소');
  const roomIndex = foundRoomIndex >= 0 ? foundRoomIndex : 7;
  const targetIndex = indexOf('대상반');

  for (const row of rows) {
    const grade = parseInt(getGvizValue(row, gradeIndex), 10);
    const day = getGvizValue(row, dayIndex);
    const period = parseInt(getGvizValue(row, periodIndex), 10);
    const subject = getGvizValue(row, subjectIndex);
    const teacher = getGvizValue(row, teacherIndex);
    const slot = normalizeSlot(getGvizValue(row, slotIndex));
    const ban = slot ? null : parseInt(getGvizValue(row, banIndex), 10);
    let targetBans = slot || targetIndex < 0 ? [] : parseTargetBans(getGvizValue(row, targetIndex));
    if(!slot && !targetBans.length) targetBans = inferTargetBans(grade, ban, subject);
    const room = normalizeRoom(getGvizValue(row, roomIndex), grade, ban);
    if (grade && day && period && subject && (slot || ban)) {
      scheduleData.push({ grade, ban, targetBans, day, period, subject, teacher, slot, room });
    }
  }
}

function parseSlotTimes(data) {
  if (!data?.table) return;
  const cols = data.table.cols || [];
  const rows = data.table.rows || [];
  const labels = cols.map(column => String(column.label || '').trim());
  const indexOf = name => labels.findIndex(label => label === name);
  const gradeIndex = indexOf('학년');
  const slotIndex = indexOf('슬롯');
  const dayIndex = indexOf('요일');
  const periodIndex = indexOf('교시');

  for (const row of rows) {
    const grade = parseInt(getGvizValue(row, gradeIndex), 10);
    const slot = getGvizValue(row, slotIndex);
    const day = getGvizValue(row, dayIndex);
    const period = parseInt(getGvizValue(row, periodIndex), 10);
    if (grade && slot && day && period) slotTimeMap.push({ grade, slot, day, period });
  }
}

function ensureClassroom(grade, slot, subject) {
  let course = classroomData.find(item => item.grade === grade && item.slot === slot && item.subject === subject);
  if (!course) {
    course = { grade, slot, subject, teacher: '', room: '', count: 0 };
    classroomData.push(course);
  }
  return course;
}

function loadGvizTable({ gid, range = '', headers = true }) {
  return new Promise((resolve, reject) => {
    const callback = '__choiceDashboard_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timeout = setTimeout(() => finish(new Error('시트 응답 시간이 초과되었습니다.')), 20000);
    const finish = result => {
      clearTimeout(timeout);
      delete window[callback];
      script.remove();
      result instanceof Error ? reject(result) : resolve(result);
    };
    window[callback] = data => finish(data);
    script.onerror = () => finish(new Error('시트 데이터를 읽지 못했습니다.'));
    let url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json;responseHandler:' + callback + '&gid=' + gid;
    if (range) url += '&range=' + encodeURIComponent(range);
    url += '&headers=' + (headers ? '1' : '0') + '&_=' + Date.now();
    script.src = url;
    document.body.appendChild(script);
  });
}

async function loadClassroomSheet(gradeStr, gid, lastRow, lastColumn) {
  const [headerData, metaData] = await Promise.all([
    loadGvizTable({ gid, range: 'A1:' + lastColumn + '1', headers: false }),
    loadGvizTable({ gid, range: 'A2:B' + lastRow, headers: false }),
  ]);
  const headerRow = (headerData.table?.rows || [])[0];
  const headers = (headerRow?.c || []).map((_, index) => getGvizValue(headerRow, index));
  const groups = [];
  let slot = '';
  for (let index = 0; index < (metaData.table?.rows || []).length; index++) {
    const row = metaData.table.rows[index];
    const foundSlot = getGvizValue(row, 0);
    const rowType = getGvizValue(row, 1);
    if (foundSlot) slot = foundSlot;
    if (slot && rowType === '학생수') groups.push({ slot, rowNumber: index + 2 });
  }

  const courseData = await Promise.all(groups.map(group =>
    loadGvizTable({ gid, range: 'C' + (group.rowNumber + 1) + ':' + lastColumn + (group.rowNumber + 2), headers: false })
      .then(data => ({ group, data })),
  ));

  for (const item of courseData) {
    const teacherRow = (item.data.table?.rows || [])[0];
    const roomRow = (item.data.table?.rows || [])[1];
    const fieldCount = Math.max(teacherRow?.c?.length || 0, roomRow?.c?.length || 0);
    for (let field = 0; field < fieldCount; field++) {
      const subject = headers[field + 2];
      const teacher = getGvizValue(teacherRow, field);
      const room = normalizeRoom(getGvizValue(roomRow, field), gradeStr);
      if (!subject || (!teacher && !room)) continue;
      const course = ensureClassroom(gradeStr, item.group.slot, subject);
      if (teacher) course.teacher = teacher;
      if (room) course.room = room;
    }
  }
}

function calculateClassroomCounts() {
  const counts = new Map();
  for (const student of allStudents) {
    for (const [subject, slot] of Object.entries(student.subjects)) {
      const key = [student.grade, normalizeSlot(slot), normalizeSubject(subject)].join('\u0000');
      counts.set(key, (counts.get(key) || 0) + 1);
    }
  }
  for (const course of classroomData) {
    const key = [course.grade, normalizeSlot(course.slot), normalizeSubject(course.subject)].join('\u0000');
    course.count = counts.get(key) || 0;
  }
}

function applyScheduleRoomsToClassrooms() {
  for (const course of classroomData) {
    const grade = parseInt(course.grade, 10);
    const courseSlot = normalizeSlot(course.slot);
    const baseSlot = courseSlot.charAt(0);
    const subject = normalizeSubject(course.subject);
    let rows = scheduleData
      .filter(row => row.grade === grade && row.slot && row.room
        && normalizeSubject(row.subject) === subject
        && (normalizeSlot(row.slot) === courseSlot || normalizeSlot(row.slot) === baseSlot));
    if(course.teacher){
      const teacherRows = rows.filter(row=>teachersOverlap(row.teacher, course.teacher));
      if(teacherRows.length) rows = teacherRows;
    }
    if(course.room){
      const roomRows = rows.filter(row=>row.room === course.room);
      if(roomRows.length) rows = roomRows;
    }
    const rooms = [...new Set(rows.map(row=>row.room))];
    if (rooms.length) course.room = rooms.join(' · ');
  }
}

function applyClassroomTeachersToSchedule() {
  for (const row of scheduleData) {
    if(!row.slot) continue;
    const slot = normalizeSlot(row.slot);
    const candidates = classroomData.filter(item => parseInt(item.grade, 10) === row.grade
      && normalizeSubject(item.subject) === normalizeSubject(row.subject)
      && (normalizeSlot(item.slot) === slot || normalizeSlot(item.slot).charAt(0) === slot.charAt(0)));
    let course = candidates.find(item=>normalizeSlot(item.slot) === slot);
    if(!course && row.teacher) course = candidates.find(item=>teachersOverlap(item.teacher, row.teacher));
    if(!course && row.room) course = candidates.find(item=>item.room === row.room);
    if(!course && candidates.length === 1) course = candidates[0];
    if(course?.teacher) row.teacher = course.teacher;
  }
}

function checkReady() {
  if (dataLoaded < TOTAL) return;
  applyClassroomTeachersToSchedule();
  applyScheduleRoomsToClassrooms();
  calculateClassroomCounts();
  lastLoadTime = Date.now();
  document.getElementById('loadingOverlay').style.opacity = '0';
  setTimeout(() => { document.getElementById('loadingOverlay').style.display = 'none'; }, 300);
  allStudents.sort((a, b) => a.id.localeCompare(b.id));
  updateStatsBadge();
  updateSyncTime();
  renderedTabs.clear();
  switchTab('student');
}

let loadVersion = 0;

async function fetchAllData() {
  const version = ++loadVersion;
  document.getElementById('loadingMsg').textContent = '스프레드시트에서 데이터를 불러오는 중…';
  document.getElementById('loadingOverlay').style.display = 'flex';
  document.getElementById('loadingOverlay').style.opacity = '1';
  try {
    const [secondStudents, thirdStudents, schedule, slotMap] = await Promise.all([
      loadGvizTable({ gid: '0' }),
      loadGvizTable({ gid: '1935968761' }),
      loadGvizTable({ gid: '1926478023' }),
      loadGvizTable({ gid: '863995751' }),
    ]);
    if (version !== loadVersion) return;
    parseStudentSheet(secondStudents, '2학년');
    parseStudentSheet(thirdStudents, '3학년');
    parseSchedule(schedule);
    parseSlotTimes(slotMap);
    await Promise.all([
      loadClassroomSheet('2학년', '606989081', 16, 'P'),
      loadClassroomSheet('3학년', '44867740', 40, 'AF'),
    ]);
    if (version !== loadVersion) return;
    dataLoaded = TOTAL;
    checkReady();
  } catch (error) {
    if (version !== loadVersion) return;
    console.error(error);
    document.getElementById('loadingMsg').innerHTML = '<span style="color:var(--danger);">데이터를 불러오지 못했습니다.</span><br><br><span style="font-size:14px;font-weight:600;color:var(--text-muted);">' + escapeHtml(error.message || '시트 공유 권한과 네트워크 연결을 확인해 주세요.') + '</span>';
  }
}

function reloadData() {
  allStudents = [];
  classroomData = [];
  scheduleData = [];
  slotTimeMap = [];
  dataLoaded = 0;
  renderedTabs.clear();
  ['student', 'slot', 'class', 'roster', 'teacher', 'location'].forEach(id => {
    const element = document.getElementById('tab_' + id);
    if (element) element.innerHTML = '';
  });
  fetchAllData();
}

fetchAllData();

/* ============================================================
   헤더 메타
   ============================================================ */
function updateStatsBadge(){
  const badge = document.getElementById('statsBadge');
  if(!badge) return;
  const g2s = allStudents.filter(s=>s.grade==='2학년').length;
  const g3s = allStudents.filter(s=>s.grade==='3학년').length;
  const crs = classroomData.length;
  badge.textContent =
    `학생 ${g2s+g3s}명 (2년 ${g2s}·3년 ${g3s}) · 강좌 ${crs}개`;
}
function updateSyncTime(){
  document.getElementById('syncTime').textContent = lastLoadTime ? '🕒 '+formatRelativeTime(lastLoadTime) : '';
}
setInterval(updateSyncTime, 30000);

/* ============================================================
   탭 전환 (display 토글, 상태 보존)
   ============================================================ */
const TAB_RENDERERS = {
  student: renderStudentTab,
  slot: renderSlotTab,
  class: renderClassTab,
  roster: renderRosterTab,
  teacher: renderTeacherTab,
  location: renderLocationTab,
};
const TAB_GROUPS = {
  student: 'enrollment', slot: 'enrollment',
  class: 'timetable', teacher: 'timetable', location: 'timetable',
  roster: 'roster',
};
const GROUP_DEFAULTS = { enrollment: 'student', timetable: 'class', roster: 'roster' };
const GROUP_LABELS = {
  enrollment: ['수강 현황', '학생 또는 슬롯을 기준으로 수강 배정을 확인합니다.'],
  timetable: ['시간표', '반·교사·장소 기준으로 주간 수업을 확인합니다.'],
  roster: ['명렬표·출석부', '강좌를 선택하고 출력 형식과 열 수를 설정합니다.'],
};
const lastTabByGroup = { ...GROUP_DEFAULTS };
let activeTab = 'student';

function syncNavigation(id){
  const group = TAB_GROUPS[id] || 'enrollment';
  activeTab = id;
  lastTabByGroup[group] = id;

  document.querySelectorAll('.primary-tab').forEach(button => {
    button.classList.toggle('active', button.dataset.group === group);
  });
  document.querySelectorAll('.subnav-btn').forEach(button => {
    button.hidden = button.dataset.group !== group;
    button.classList.toggle('active', button.dataset.tab === id);
  });

  const shell = document.getElementById('subnavShell');
  const label = document.getElementById('viewGroupLabel');
  const description = document.getElementById('viewDescription');
  shell?.classList.toggle('roster-mode', group === 'roster');
  if(label) label.textContent = GROUP_LABELS[group][0];
  if(description) description.textContent = GROUP_LABELS[group][1];
}

function switchTab(id){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  const pane = document.getElementById('tab_'+id);
  if(pane) pane.classList.add('active');
  syncNavigation(id);
  if(!renderedTabs.has(id) && TAB_RENDERERS[id]){
    TAB_RENDERERS[id](pane);
    renderedTabs.add(id);
  }
  window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
}

/* 전역 업무와 하위 보기 바인딩 */
document.querySelectorAll('.primary-tab').forEach(button=>{
  button.addEventListener('click', ()=>{
    const group = button.dataset.group;
    switchTab(button.dataset.tab || lastTabByGroup[group] || GROUP_DEFAULTS[group]);
  });
});
document.querySelectorAll('.subnav-btn').forEach(button=>{
  button.addEventListener('click', ()=>switchTab(button.dataset.tab));
});
document.getElementById('refreshBtn').addEventListener('click', reloadData);

/* ============================================================
   전역 네비게이션 (숨은 하이퍼링크)
   ============================================================ */
const NAV = {
  student(id){
    if(!id) return;
    switchTab('student');
    // 탭이 처음 열릴 때 DOM 준비 대기
    setTimeout(()=>selectStudent(id), 0);
  },
  teacher(name){
    if(!name) return;
    teacherTabSelected = name;
    switchTab('teacher');
    setTimeout(()=>{
      const sel = document.getElementById('teacherSelect');
      if(sel){ sel.value = name; sel.dispatchEvent(new Event('change')); }
    }, 0);
  },
  slot(grade, slot){
    // grade: "2학년" or "3학년" (classroomData 형식) / 숫자도 허용
    if(!slot) return;
    const gStr = (typeof grade === 'number') ? `${grade}학년` : grade;
    slotTabGrade = gStr === '3학년' ? '3학년' : '2학년';
    switchTab('slot');
    setTimeout(()=>{
      const pane = document.getElementById('tab_slot');
      if(!pane) return;
      // 서브탭 버튼 동기화
      pane.querySelectorAll('.slot-subtabs .btn').forEach(b=>{
        b.classList.toggle('active', b.dataset.grade === slotTabGrade);
      });
      renderSlotContent();
      // 해당 슬롯 그룹으로 스크롤
      setTimeout(()=>{
        const target = pane.querySelector(`.slot-group[data-slot="${CSS.escape(slot)}"]`);
        if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
      }, 30);
    }, 0);
  },
  roster(grade, slot, subject){
    const gStr = (typeof grade === 'number') ? `${grade}학년` : grade;
    jumpToRoster(gStr, slot, subject);
  },
  class(grade, ban){
    if(!grade || !ban) return;
    const gStr = (typeof grade === 'number') ? `${grade}학년` : grade;
    classTabGrade = gStr;
    classTabRoom = `${gStr} ${ban}반`;
    switchTab('class');
    setTimeout(()=>{
      const pane = document.getElementById('tab_class');
      if(!pane) return;
      pane.querySelectorAll('.slot-subtabs .btn').forEach(b=>{
        b.classList.toggle('active', b.dataset.grade === classTabGrade);
      });
      renderClassChips();
      renderClassContent();
    }, 0);
  },
};

/* 전역 클릭 위임: data-nav 있는 요소는 네비게이트, 이벤트 버블링 차단
   - 요일 탭(.tt-day-tab)처럼 기존 기능 있는 것은 제외 */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-nav]');
  if(!el) return;
  // 카드/링크 안에 또 다른 nav가 중첩될 수 있으므로 가장 가까운 것만
  const nav = el.dataset.nav;
  if(!NAV[nav]) return;
  e.stopPropagation();
  e.preventDefault();
  const args = [];
  for(let i=1; i<=4; i++){
    const v = el.dataset['arg'+i];
    if(v === undefined) break;
    args.push(v);
  }
  NAV[nav](...args);
}, true);  // capture 단계에서 먼저 처리

/* 모바일 요일 탭 이벤트 위임 (한 번만 등록) */
document.addEventListener('click', e => {
  const tab = e.target.closest('.tt-day-tab');
  if(!tab) return;
  const wrap = tab.closest('.tt-mobile');
  if(!wrap) return;
  const day = tab.dataset.day;
  wrap.querySelectorAll('.tt-day-tab').forEach(b => b.classList.toggle('active', b === tab));
  wrap.querySelectorAll('[data-day-list]').forEach(list => {
    list.style.display = (list.dataset.dayList === day) ? '' : 'none';
  });
});

/* ============================================================
   학생 조회 탭
   ============================================================ */
function renderStudentTab(c){
  c.innerHTML = `
    <div class="view-filter-row no-print">
      <div class="search-wrapper" style="margin:0;">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchStudent" class="search-input" placeholder="학생 이름 또는 학번 검색" autocomplete="off">
        <div id="studentDropdown" class="autocomplete-list"></div>
      </div>
    </div>
    <div id="studentResult">
      <div class="empty-state">
        학생 이름이나 학번을 검색하면 수강 과목과 주간 시간표를 확인할 수 있습니다.
      </div>
    </div>`;

  const input = document.getElementById('searchStudent');
  const dd = document.getElementById('studentDropdown');
  let currentMatches = [];
  let highlightIdx = -1;

  const doSearch = debounce((val)=>{
    val = val.trim().toLowerCase();
    if(!val){ dd.style.display='none'; currentMatches=[]; highlightIdx=-1; return; }
    currentMatches = allStudents.filter(s => s.name.toLowerCase().includes(val) || s.id.includes(val)).slice(0,20);
    highlightIdx = -1;
    renderDropdown();
  }, 120);

  function renderDropdown(){
    if(!currentMatches.length){
      dd.innerHTML = `<div class="autocomplete-item" style="color:var(--text-muted);cursor:default;">일치하는 학생 없음</div>`;
    } else {
      dd.innerHTML = currentMatches.map((m,i)=>`
        <div class="autocomplete-item${i===highlightIdx?' highlight':''}" data-id="${escapeHtml(m.id)}">
          <div><span class="badge" style="margin-right:8px;font-size:12px;background:#eff6ff;border-color:#bfdbfe;color:#2563eb;">${escapeHtml(m.id)}</span>${escapeHtml(m.name)}</div>
          <span style="font-size:12px;color:var(--text-muted);">${escapeHtml(m.homeroom)}</span>
        </div>`).join('');
    }
    dd.style.display = 'block';
  }

  input.addEventListener('input', e=>doSearch(e.target.value));
  input.addEventListener('keydown', e=>{
    if(!currentMatches.length && e.key!=='Escape') return;
    if(e.key==='ArrowDown'){ e.preventDefault(); highlightIdx=Math.min(highlightIdx+1, currentMatches.length-1); renderDropdown(); scrollHL(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); highlightIdx=Math.max(highlightIdx-1, 0); renderDropdown(); scrollHL(); }
    else if(e.key==='Enter'){ e.preventDefault(); const pick = currentMatches[highlightIdx>=0?highlightIdx:0]; if(pick) selectStudent(pick.id); }
    else if(e.key==='Escape'){ dd.style.display='none'; }
  });
  function scrollHL(){
    const el = dd.querySelector('.autocomplete-item.highlight');
    if(el) el.scrollIntoView({block:'nearest'});
  }

  dd.addEventListener('click', e=>{
    const item = e.target.closest('.autocomplete-item[data-id]');
    if(item) selectStudent(item.dataset.id);
  });

  document.addEventListener('click', e=>{
    if(e.target !== input && !dd.contains(e.target)) dd.style.display='none';
  });
}

function selectStudent(id){
  const s = allStudents.find(x=>x.id===id);
  if(!s) return;
  const input = document.getElementById('searchStudent');
  const dd = document.getElementById('studentDropdown');
  if(input) input.value = `${s.name} (${s.id})`;
  if(dd) dd.style.display = 'none';

  const pairs = Object.entries(s.subjects).map(([subj,slot])=>{
    const ci = findClassroom(s.grade, slot, subj);
    return { subj, slot, teacher: ci?.teacher||'미정', room: ci?.room||'미정' };
  }).sort((a,b)=>a.slot.localeCompare(b.slot));

  // 반 번호 추출 (예: "3학년 1반" → 1)
  const banMatch = s.homeroom.match(/(\d+)반/);
  const ban = banMatch ? parseInt(banMatch[1]) : null;
  const gradeNum = parseInt(s.grade);  // "3학년" → 3

  // 시간표 격자 (공통은 반별시간표, 선택과목은 학생 subjects + slotTimeMap)
  const timetableHtml = (gradeNum && ban) ? buildStudentTimetable(s) : '';

  let h = `
    <div class="entity-summary">
      <div>
        <div class="entity-name">${escapeHtml(s.name)}</div>
        <div class="entity-meta">
          <span data-nav="class" data-arg1="${escapeHtml(s.grade)}" data-arg2="${ban||''}">${escapeHtml(s.homeroom)}</span>
          · 학번 ${escapeHtml(s.id)} · 수강과목 ${pairs.length}개
        </div>
      </div>
    </div>
    ${timetableHtml}
    <div class="section-head">
      <div class="section-head-title">선택과목</div>
      <div class="section-head-meta">${pairs.length}개 강좌</div>
    </div>
    <div class="compact-table-wrap">
      <table class="compact-table">
        <thead><tr><th class="col-slot">슬롯</th><th>과목</th><th class="col-person">담당 교사</th><th class="col-room">수업 장소</th><th class="action-cell">이동</th></tr></thead>
        <tbody>`;

  if(!pairs.length){
    h += `<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:24px;">선택과목 데이터가 없습니다.</td></tr>`;
  }
  pairs.forEach(p=>{
    const col = slotColor(p.slot);
    h += `
      <tr data-nav="roster" data-arg1="${escapeHtml(s.grade)}" data-arg2="${escapeHtml(p.slot)}" data-arg3="${escapeHtml(p.subj)}">
        <td class="col-slot" data-label="슬롯"><span class="slot-token" style="--slot-color:${col}" data-nav="slot" data-arg1="${escapeHtml(s.grade)}" data-arg2="${escapeHtml(p.slot)}">${escapeHtml(p.slot)}</span></td>
        <td class="subject-cell" data-label="과목">${escapeHtml(p.subj)}</td>
        <td class="col-person muted-cell" data-label="담당 교사">${renderTeacherLinks(p.teacher)}</td>
        <td class="col-room" data-label="수업 장소">${escapeHtml(p.room)}</td>
        <td class="action-cell" data-label="이동">명렬표</td>
      </tr>`;
  });
  h += `</tbody></table></div>`;
  document.getElementById('studentResult').innerHTML = h;
}

/* ============================================================
   시간표 격자 헬퍼
   ============================================================ */
const DAYS = ['월','화','수','목','금'];

function maxPeriodOf(entries){
  let max = 5;
  entries.forEach(e => { if(e.period > max) max = e.period; });
  if(max < 5) max = 5;
  if(max > 9) max = 9;
  return max;
}

function renderTimetableGrid(entries, opts){
  // entries: [{day, period, subject, teacher, slot, ...}, ...]
  opts = opts || {};
  const maxP = maxPeriodOf(entries);
  const grid = {};
  entries.forEach(e=>{
    const k = `${e.day}|${e.period}`;
    if(!grid[k]) grid[k] = [];
    grid[k].push(e);
  });

  const pick = (cells) => {
    if(!cells || !cells.length) return [];
    if(opts.highlightStudentSubjects){
      return cells.filter(e=>{
        if(!e.slot) return true;
        return opts.highlightStudentSubjects[e.subject] === e.slot;
      });
    }
    return cells;
  };

  // === 데스크톱: 격자 ===
  let h = `<table class="timetable"><thead><tr><th></th>`;
  DAYS.forEach(d => { h += `<th class="day-header">${d}</th>`; });
  h += `</tr></thead><tbody>`;
  for(let p=1; p<=maxP; p++){
    h += `<tr><td class="period-label">${p}교시</td>`;
    DAYS.forEach(d=>{
      const chosen = pick(grid[`${d}|${p}`]);
      if(!chosen.length){ h += `<td><div class="tt-cell empty"></div></td>`; return; }
      if(canCombineDivisionEntries(chosen)){
        h += `<td>${renderCombinedTimetableCell(chosen)}</td>`;
        return;
      }
      const cells = chosen.map(e=>renderTimetableCell(e, opts)).join('');
      h += `<td>${chosen.length>1?`<div class="tt-cell-stack">${cells}</div>`:cells}</td>`;
    });
    h += `</tr>`;
  }
  h += `</tbody></table>`;

  // === 모바일: 요일 탭 + 세로 리스트 ===
  const tabId = 'ttm_' + Math.random().toString(36).slice(2, 8);
  let m = `<div class="tt-mobile" data-tab-id="${tabId}">`;
  m += `<div class="tt-day-tabs">`;
  DAYS.forEach((d, i) => {
    m += `<button class="tt-day-tab${i===0?' active':''}" data-day="${d}">${d}</button>`;
  });
  m += `</div>`;
  DAYS.forEach((d, i) => {
    m += `<div class="tt-day-list" data-day-list="${d}" style="${i===0?'':'display:none'}">`;
    let anyRow = false;
    for(let p=1; p<=maxP; p++){
      const chosen = pick(grid[`${d}|${p}`]);
      if(!chosen.length){
        m += `<div class="tt-row empty"><span class="tt-row-period">${p}교시</span><span>—</span></div>`;
        continue;
      }
      anyRow = true;
      if(canCombineDivisionEntries(chosen)){
        m += renderCombinedTimetableRow(p, chosen);
        continue;
      }
      const rows = chosen.map((e,i)=>renderTimetableRow(p, e, { ...opts, suppressPeriod:i>0 })).join('');
      m += chosen.length>1 ? `<div class="tt-row-stack">${rows}</div>` : rows;
    }
    if(!anyRow){
      // 전체가 empty인 요일은 간단히 표시
    }
    m += `</div>`;
  });
  m += `</div>`;

  return h + m;
}

function renderClassLinks(e){
  const bans = e.targetBans?.length ? e.targetBans : (e.ban ? [e.ban] : []);
  return bans.map(b=>`<span data-nav="class" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(b)}">${escapeHtml(e.grade)}-${escapeHtml(b)}반</span>`).join('·');
}

function divisionNumber(e){
  if(!e.targetBans?.length || !e.ban) return e.ban || '';
  const targetKey = [...e.targetBans].sort((a,b)=>a-b).join(',');
  const subject = normalizeSubject(e.subject);
  let order = [];
  if(subject === '공통수학2' || subject === '미적분Ⅰ'){
    if(targetKey === '1') order = [1,6];
    else if(targetKey === '2,3') order = [2,3,7];
    else if(targetKey === '4,5') order = [4,5,8];
  } else if(subject === '공통영어2' || subject === '영어Ⅱ'){
    if(targetKey === '1,2') order = [1,2,6];
    else if(targetKey === '3,4') order = [3,4,7];
    else if(targetKey === '5') order = [5,8];
  }
  const index = order.indexOf(Number(e.ban));
  return index >= 0 ? index + 1 : e.ban;
}

function canCombineDivisionEntries(entries){
  return entries.length > 0
    && entries.every(e=>!e.slot && e.targetBans?.length)
    && entries.every(e=>normalizeSubject(e.subject) === normalizeSubject(entries[0].subject));
}

function renderDivisionLines(entries){
  return [...entries]
    .sort((a,b)=>Number(divisionNumber(a))-Number(divisionNumber(b)))
    .map(e=>`
      <div class="tt-division-line">
        <span class="tt-group-badge">분반 ${escapeHtml(divisionNumber(e))}</span>
        <span class="tt-division-teacher">${e.teacher?renderTeacherLinks(e.teacher):'—'}</span>
        <span class="tt-division-room" title="${escapeHtml(e.room||'')}">${escapeHtml(e.room||'')}</span>
      </div>`).join('');
}

function renderCombinedTimetableCell(entries){
  return `<div class="tt-cell tt-combined"><div class="tt-subj">${escapeHtml(entries[0].subject)}</div><div class="tt-divisions">${renderDivisionLines(entries)}</div></div>`;
}

function renderCombinedTimetableRow(period, entries){
  return `<div class="tt-row tt-combined-row"><span class="tt-row-period">${period}교시</span><div class="tt-row-body"><span class="tt-row-subj">${escapeHtml(entries[0].subject)}</span><div class="tt-divisions">${renderDivisionLines(entries)}</div></div></div>`;
}

function renderGroupBadge(e){
  return e.targetBans?.length && e.ban ? `<span class="tt-group-badge">분반 ${escapeHtml(divisionNumber(e))}</span>` : '';
}

function renderSpecialTimetableMeta(e){
  const parts = [];
  const ownRoom = e.grade && e.ban && e.room === `${e.grade}학년 ${e.ban}반`;
  if(e.grade && e.ban){
    parts.push(`<span data-nav="class" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(e.ban)}">${escapeHtml(e.grade)}-${escapeHtml(e.ban)}반</span>`);
  }
  if(e.teacher) parts.push(renderTeacherLinks(e.teacher));
  if(e.room && !ownRoom) parts.push(`<span class="tt-room">${escapeHtml(e.room)}</span>`);
  return parts.join(' · ');
}

function renderTimetableRow(period, e, opts){
  opts = opts || {};
  const periodText = opts.suppressPeriod ? '' : `${period}교시`;
  if(e.subject === '자율활동'){
    const meta = renderSpecialTimetableMeta(e);
    return `<div class="tt-row jayul"><span class="tt-row-period">${periodText}</span><div class="tt-row-body"><span class="tt-row-subj">자율활동</span>${meta?`<span class="tt-row-teacher">${meta}</span>`:''}</div></div>`;
  }
  if(e.subject === '자습'){
    const meta = renderSpecialTimetableMeta(e);
    return `<div class="tt-row jaseup"><span class="tt-row-period">${periodText}</span><div class="tt-row-body"><span class="tt-row-subj">자습</span>${meta?`<span class="tt-row-teacher">${meta}</span>`:''}</div></div>`;
  }
  const col = e.slot ? slotColor(e.slot) : '#94a3b8';
  const slotClass = e.slot ? ' has-slot' : '';

  const teacherNav = e.teacher
    ? renderTeacherLinks(e.teacher)
    : '';
  const banNav = opts.showBan ? renderClassLinks(e) : '';
  const ownRoom = e.grade && e.ban && e.room === `${e.grade}학년 ${e.ban}반`;
  const roomMeta = e.room && !(opts.showBan && ownRoom) ? `<span class="tt-room">${escapeHtml(e.room)}</span>` : '';
  const metaInner = [renderGroupBadge(e), banNav, teacherNav, roomMeta].filter(Boolean).join(' · ');

  const slotBadgeHtml = e.slot
    ? `<span class="tt-row-slot" style="background:${col}" data-nav="slot" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(e.slot)}">${escapeHtml(e.slot)}</span>`
    : '';

  let subjNav = '';
  if(e.navOverride === 'slot' && e.grade && e.slot){
    subjNav = `data-nav="slot" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(e.slot)}"`;
  } else if(e.slot && e.grade){
    subjNav = `data-nav="roster" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(e.slot)}" data-arg3="${escapeHtml(e.subject)}"`;
  } else if(e.grade && e.ban){
    subjNav = `data-nav="class" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(e.ban)}"`;
  }

  return `
    <div class="tt-row${slotClass}" style="${e.slot?`--slot-color:${col};`:''}">
      <span class="tt-row-period">${periodText}</span>
      <div class="tt-row-body">
        <span class="tt-row-subj" ${subjNav}>${escapeHtml(e.subject)}</span>
        <div class="tt-row-meta">
          ${metaInner?`<span class="tt-row-teacher">${metaInner}</span>`:''}
          ${slotBadgeHtml}
        </div>
      </div>
    </div>`;
}

function renderTimetableCell(e, opts){
  opts = opts || {};
  if(e.subject === '자율활동'){
    const meta = renderSpecialTimetableMeta(e);
    return `<div class="tt-cell jayul"><div class="tt-subj">자율활동</div>${meta?`<div class="tt-sub">${meta}</div>`:''}</div>`;
  }
  if(e.subject === '자습'){
    const meta = renderSpecialTimetableMeta(e);
    return `<div class="tt-cell jaseup"><div class="tt-subj">자습</div>${meta?`<div class="tt-sub">${meta}</div>`:''}</div>`;
  }
  const col = e.slot ? slotColor(e.slot) : '#94a3b8';
  const slotClass = e.slot ? ' has-slot' : '';
  const teacherNav = e.teacher
    ? renderTeacherLinks(e.teacher)
    : '';
  const banNav = opts.showBan ? renderClassLinks(e) : '';
  const ownRoom = e.grade && e.ban && e.room === `${e.grade}학년 ${e.ban}반`;
  const roomMeta = e.room && !(opts.showBan && ownRoom) ? `<span class="tt-room">${escapeHtml(e.room)}</span>` : '';
  const subLine = [renderGroupBadge(e), banNav, teacherNav, roomMeta].filter(Boolean).join(' · ');
  const slotBadgeHtml = e.slot
    ? `<span class="tt-slot-badge" style="background:${col}" data-nav="slot" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(e.slot)}">${escapeHtml(e.slot)}</span>`
    : '';
  // 과목명은 선택과목이면 명렬표로, 공통수업이면 반별 조회로
  let subjNav = '';
  if(e.navOverride === 'slot' && e.grade && e.slot){
    subjNav = `data-nav="slot" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(e.slot)}"`;
  } else if(e.slot && e.grade){
    subjNav = `data-nav="roster" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(e.slot)}" data-arg3="${escapeHtml(e.subject)}"`;
  } else if(e.grade && e.ban){
    subjNav = `data-nav="class" data-arg1="${escapeHtml(e.grade)}" data-arg2="${escapeHtml(e.ban)}"`;
  }
  return `
    <div class="tt-cell${slotClass}" style="${e.slot?`--slot-color:${col};`:''}">
      <div class="tt-subj" ${subjNav}>${escapeHtml(e.subject)}</div>
      <div class="tt-sub"><span>${subLine}</span>${slotBadgeHtml}</div>
    </div>`;
}

function buildStudentTimetable(student){
  const grade = parseInt(student.grade);  // "3학년" → 3
  const banM = student.homeroom.match(/(\d+)반/);
  const ban = banM ? parseInt(banM[1]) : null;
  if(!grade || !ban) return '';

  const entries = [];

  // 1) 공통과목 / 자율 / 자습: 반별시간표에서 슬롯 없는 행만
  scheduleData
    .filter(r => r.grade === grade && rowMatchesClass(r, ban) && !r.slot)
    .forEach(r => entries.push({ ...r }));

  // 2) 선택과목: 학생의 과목·슬롯 + slotTimeMap 시간 조합
  //    슬롯이 'W2' 처럼 숫자 붙어있으면 첫 글자로 시간 조회 (같은 시간대 분반)
  Object.entries(student.subjects).forEach(([subj, slotRaw]) => {
    const normalizedSlot = normalizeSlot(slotRaw);
    const baseSlot = normalizedSlot.charAt(0);
    if(!baseSlot) return;
    const ci = findClassroom(student.grade, slotRaw, subj);
    const teacher = ci?.teacher || '';
    let scheduled = scheduleData.filter(row => row.grade === grade && row.slot
      && normalizeSubject(row.subject) === normalizeSubject(subj)
      && (normalizeSlot(row.slot) === normalizedSlot || normalizeSlot(row.slot) === baseSlot));
    if(ci?.teacher){
      const teacherRows = scheduled.filter(row=>teachersOverlap(row.teacher, ci.teacher));
      if(teacherRows.length) scheduled = teacherRows;
    }
    if(ci?.room){
      const courseRooms = ci.room.split(' · ').map(room=>room.trim()).filter(Boolean);
      const roomRows = scheduled.filter(row=>courseRooms.includes(row.room));
      if(roomRows.length) scheduled = roomRows;
    }
    if(scheduled.length){
      scheduled.forEach(row => entries.push({ ...row, slot: slotRaw }));
    } else {
      slotTimeMap
        .filter(t => t.grade === grade && t.slot === baseSlot)
        .forEach(t => {
          entries.push({
            grade, ban:null,
            day: t.day, period: t.period,
            subject: subj, teacher, slot: slotRaw, room:ci?.room || ''
          });
        });
    }
  });

  if(!entries.length){
    return `<div style="margin:14px 0;padding:14px;background:#fef3c7;border:1px solid #fde68a;border-radius:10px;font-weight:700;color:#92400e;">⚠️ 시간표 데이터 없음 (${grade}학년 ${ban}반)</div>`;
  }
  const grid = renderTimetableGrid(entries, {});
  return `<div class="tt-section-title">주간 시간표</div>${grid}`;
}

function renderSlotContent(){
  const container = document.getElementById('slotContent');
  if(!container) return;
  const grade = slotTabGrade;
  const gradeNum = parseInt(grade);
  const items = classroomData.filter(c=>c.grade===grade);
  if(!items.length){
    container.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px;font-weight:700;">${escapeHtml(grade)} 데이터 없음</div>`;
    return;
  }
  const bySlot = {};
  items.forEach(it=>{
    if(!bySlot[it.slot]) bySlot[it.slot] = [];
    bySlot[it.slot].push(it);
  });
  const slots = Object.keys(bySlot).sort();
  const dayOrder = {'월':0,'화':1,'수':2,'목':3,'금':4};

  let h = '';
  slots.forEach(slot=>{
    const col = slotColor(slot);
    const list = bySlot[slot];
    const total = list.reduce((sum,x)=>sum+(x.count||0), 0);
    // 슬롯 시간 조회
    const times = slotTimeMap
      .filter(t => t.grade === gradeNum && t.slot === slot)
      .sort((a,b) => (dayOrder[a.day] - dayOrder[b.day]) || (a.period - b.period))
      .map(t => `${t.day}${t.period}`);
    const timesHtml = times.length
      ? `<span class="slot-summary" style="background:${col}15;color:${col};padding:3px 9px;border-radius:6px;">${times.join(' · ')}</span>`
      : '';
    h += `
      <section class="slot-group" data-slot="${escapeHtml(slot)}">
        <div class="slot-group-header">
          <span class="slot-token" style="--slot-color:${col}">슬롯 ${escapeHtml(slot)}</span>
          <span class="slot-summary">${list.length}개 강좌 · 총 ${total}명</span>
          ${timesHtml}
        </div>
        <div class="compact-table-wrap">
          <table class="compact-table">
            <thead><tr><th>과목</th><th class="col-person">담당 교사</th><th class="col-room">수업 장소</th><th class="col-count">인원</th><th class="action-cell">이동</th></tr></thead>
            <tbody>`;
    list.forEach(it=>{
      h += `
        <tr data-nav="roster" data-arg1="${escapeHtml(it.grade)}" data-arg2="${escapeHtml(it.slot)}" data-arg3="${escapeHtml(it.subject)}">
          <td class="subject-cell" data-label="과목">${escapeHtml(it.subject)}</td>
          <td class="col-person muted-cell" data-label="담당 교사">${renderTeacherLinks(it.teacher)}</td>
          <td class="col-room" data-label="수업 장소">${escapeHtml(it.room||'미정')}</td>
          <td class="col-count" data-label="인원">${it.count||0}명</td>
          <td class="action-cell" data-label="이동">명렬표</td>
        </tr>`;
    });
    h += `</tbody></table></div></section>`;
  });
  container.innerHTML = h;
}

function renderClassChips(){
  let rooms = [...new Set(allStudents.filter(s=>s.grade===classTabGrade).map(s=>s.homeroom))];

    const gradeNum = parseInt(classTabGrade);
    rooms = [...new Set(scheduleData

      .flatMap(r=>(r.targetBans?.length?r.targetBans:(r.ban?[r.ban]:[])))
      .map(b=>`${classTabGrade} ${b}반`))];
  }
  rooms.sort((a,b)=>{
    const na = parseInt(a.match(/(\d+)반/)?.[1]||0);

  });
  const host = document.getElementById('classRoomChips');
  if(!host) return;
  host.innerHTML = rooms.map(r=>`<button class="chip${r===classTabRoom?' active':''}" data-room="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join('');

function generateRoster(){
  const sel = document.getElementById('rosterSelect');
  const colsEl = document.getElementById('rosterCols');
  const hdrEl = document.getElementById('rosterHeaderType');
  const err = document.getElementById('rosterError');
  const out = document.getElementById('rosterResult');
  if(!sel || !out) return;
  err.classList.remove('show');

  if(!sel.value){ out.innerHTML = ''; return; }

  const [g, sl, sj] = sel.value.split('::');
  let cols = parseInt(colsEl.value);
  if(isNaN(cols) || cols < 1) cols = 1;
  if(cols > 30) cols = 30;
  const hdrType = hdrEl.value;

  const sts = allStudents.filter(s=>s.grade===g && s.subjects[sj]===sl).sort((a,b)=>a.id.localeCompare(b.id));
  const ci = findClassroom(g, sl, sj) || {};

  const byRoom = {};
  sts.forEach(s=>{ byRoom[s.homeroom] = (byRoom[s.homeroom]||0)+1; });
  const roomEntries = Object.entries(byRoom).sort();

  function hdrCell(i){
    if(hdrType === 'date') return `<input type="text" class="date-input" placeholder="연도-월-일">`;
    if(hdrType === 'perf') return `<input type="text" class="date-input" value="수행${i+1}">`;
    if(hdrType === 'unit') return `<input type="text" class="date-input" value="${i+1}단원">`;
    return `<input type="text" class="date-input" placeholder="항목명">`;
  }

  let h = `
    <div class="card" style="padding:0;overflow-x:auto;">
      <div class="print-header" style="text-align:center;margin-bottom:12px;padding-top:10px;">
        <h2 style="font-size:22px;font-weight:900;margin-bottom:6px;">[${escapeHtml(g)}] ${escapeHtml(sj)} 출석부 (슬롯 ${escapeHtml(sl)})</h2>
        <div style="font-size:15px;font-weight:800;color:var(--text-main);margin-bottom:8px;">${renderTeacherLinks(ci.teacher)} 선생님</div>
        <div style="display:inline-flex;gap:12px;background:var(--surface-hover);padding:7px 18px;border-radius:12px;font-weight:700;color:var(--text-muted);font-size:13px;" class="no-print">
          <span>장소 ${escapeHtml(ci.room||'미정')}</span>
          <span style="color:var(--accent);">총 ${sts.length}명</span>
        </div>
      </div>
      <div class="breakdown no-print">
        <span style="font-weight:800;color:var(--text-muted);margin-right:4px;">반별 분포:</span>
        ${roomEntries.map(([room,cnt])=>{
          const bMatch = room.match(/(\d+)반/);
          const bNum = bMatch ? bMatch[1] : '';
          return `<span class="breakdown-item" data-nav="class" data-arg1="${escapeHtml(g)}" data-arg2="${bNum}">${escapeHtml(room)} <strong>${cnt}명</strong></span>`;
        }).join('') || '<span style="color:var(--text-muted)">—</span>'}
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:40px;font-size:13px;">연번</th>
            <th style="width:65px;font-size:13px;">학번</th>
            <th style="width:80px;font-size:13px;">이름</th>`;
  for(let i=0;i<cols;i++) h += `<th style="padding:2px;">${hdrCell(i)}</th>`;
  h += `</tr></thead><tbody>`;
  if(!sts.length){
    h += `<tr><td colspan="${cols+3}" style="padding:30px;color:var(--text-muted);">수강생 없음</td></tr>`;
  } else {
    sts.forEach((s,i)=>{
      h += `<tr>
        <td style="font-size:12px;color:var(--text-muted);">${i+1}</td>
        <td style="font-size:12px;">${escapeHtml(s.id)}</td>
        <td style="font-weight:900;font-size:14px;text-align:center;" data-nav="student" data-arg1="${escapeHtml(s.id)}">${escapeHtml(s.name)}</td>`;
      for(let j=0;j<cols;j++) h += `<td></td>`;
      h += `</tr>`;
    });
  }
  h += `</tbody></table></div>`;
  out.innerHTML = h;
}

function renderTeacherTimetable(teacher){
  const out = document.getElementById('teacherResult');
  const entries = scheduleData.filter(row => hasTeacher(row.teacher, teacher));
  if(!entries.length){
    out.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted);font-weight:700;">해당 교사의 시간표 데이터가 없습니다.</div>`;
    return;
  }

  // 요약 통계
  const classesTaught = [...new Set(entries.flatMap(e=>{
    const bans = e.targetBans?.length ? e.targetBans : (e.ban ? [e.ban] : []);
    return bans.map(b=>`${e.grade}-${b}`);
  }))].sort();
  const subjects = [...new Set(entries.map(e=>e.subject))].sort();
  const rooms = [...new Set(entries.map(e=>e.room).filter(Boolean))].sort();
  const totalHours = entries.length;

  // 격자
  const grid = renderTimetableGrid(entries, { showBan: true });

  out.innerHTML = `
    <div class="entity-summary">
      <div style="flex:1;">
        <div class="entity-name">${escapeHtml(teacher)} 선생님</div>
        <div class="entity-meta">
          주 ${totalHours}시간 · ${classesTaught.length}개 학급 · ${subjects.length}개 과목 · ${rooms.length}개 장소
        </div>
      </div>
    </div>
    <div class="breakdown">
      <span style="font-weight:800;color:var(--text-muted);margin-right:4px;">담당 학급:</span>
      ${classesTaught.map(key=>{
        const [g,b] = key.split('-');
        return `<span class="breakdown-item" data-nav="class" data-arg1="${escapeHtml(g)}" data-arg2="${escapeHtml(b)}">${escapeHtml(key)}반</span>`;
      }).join('')}
    </div>
    <div class="breakdown">
      <span style="font-weight:800;color:var(--text-muted);margin-right:4px;">과목:</span>
      ${subjects.map(s=>`<span class="breakdown-item">${escapeHtml(s)}</span>`).join('')}
    </div>
    <div class="breakdown">
      <span style="font-weight:800;color:var(--text-muted);margin-right:4px;">수업 장소:</span>
      ${rooms.map(room=>`<span class="breakdown-item">${escapeHtml(room)}</span>`).join('') || '<span style="color:var(--text-muted)">미입력</span>'}
    </div>
    ${grid}`;
}

function renderLocationTab(c){
  // 선택과목 교사(classroomData) + 공통수업 교사(scheduleData) 합집합
  const teacherSet = new Set();
  classroomData.forEach(course => splitTeachers(course.teacher).forEach(name=>teacherSet.add(name)));
  scheduleData.forEach(row => splitTeachers(row.teacher).forEach(name=>teacherSet.add(name)));
  const teachers = [...teacherSet].filter(name=>name && name !== '미정').sort();
  const rooms = [...new Set([
    ...classroomData.map(c=>c.room),
    ...scheduleData.map(row=>row.room),
  ].filter(Boolean))].sort();

  c.innerHTML = `
    <div class="view-filter-row no-print">
      <div class="search-wrapper" style="margin:0;min-width:300px;flex:1;">
        <span class="search-icon">⌕</span>
        <input type="text" id="locSearch" class="search-input" placeholder="교사·과목·학생 검색">
      </div>
      <div class="filter-bar">
        <div>
        <label>교사</label>
          <select id="locTeacher">
            <option value="">— 선택 —</option>
            ${teachers.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>수업 장소</label>
          <select id="locRoom">
            <option value="">— 선택 —</option>
            ${rooms.map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div id="locResult"></div>`;

  const qEl = document.getElementById('locSearch');
  const tEl = document.getElementById('locTeacher');
  const rEl = document.getElementById('locRoom');

  const runFree = debounce(()=>{ tEl.value=''; rEl.value=''; doLocSearch(qEl.value.trim().toLowerCase(), 'free'); }, 150);
  qEl.addEventListener('input', runFree);
  tEl.addEventListener('change', ()=>{ if(tEl.value){ qEl.value=''; rEl.value=''; doLocSearch(tEl.value.toLowerCase(), 'teacher'); } });
  rEl.addEventListener('change', ()=>{ if(rEl.value){ qEl.value=''; tEl.value=''; doLocSearch(rEl.value.toLowerCase(), 'room'); } });
}

function doLocSearch(q, mode){
  const rd = document.getElementById('locResult');
  if(!rd) return;
  if(!q){ rd.innerHTML = ''; return; }
  let results = [];

  if(mode === 'free' || !mode){
    allStudents.filter(s=>s.name.toLowerCase().includes(q) || s.id.includes(q)).forEach(s=>{
      Object.entries(s.subjects).forEach(([sj,sl])=>{
        const ci = findClassroom(s.grade, sl, sj) || {};
        results.push({
          key:`S|${s.id}|${sl}|${sj}`,
          badge:`학생 ${s.name} (${s.id}·${s.grade})`,
          slot:sl, subj:sj,
          teacher:ci.teacher||'미정', room:ci.room||'미정',
          color:'var(--accent)',
          _grade: s.grade, _studentId: s.id
        });
      });
    });
  }

  classroomData.filter(c=>{
    const teacher = (c.teacher||'').toLowerCase();
    const subject = (c.subject||'').toLowerCase();
    const room = (c.room||'').toLowerCase();
    if(mode==='teacher') return splitTeachers(c.teacher).some(name=>name.toLowerCase() === q);
    if(mode==='room') return room === q;
    return teacher.includes(q) || subject.includes(q) || room.includes(q);
  }).forEach(c=>{
    const k = `C|${c.grade}|${c.slot}|${c.subject}`;
    if(!results.find(r=>r.key===k)){
      results.push({
        key:k,
        badge:`강좌 [${c.grade}] · ${c.count||0}명`,
        slot:c.slot, subj:c.subject,
        teacher:c.teacher||'미정', room:c.room||'미정',
        color:'var(--violet)',
        _grade: c.grade
      });
    }
  });

  // 공통수업 검색: 반과 H열 수업장소를 함께 보존한다.
  const commonMap = new Map();
  scheduleData.filter(r=>{
    if(r.slot) return false;  // 선택과목은 classroomData에서 이미 처리
    if(!r.subject || r.subject === '자율활동' || r.subject === '자습') return false;
    const teacher = (r.teacher||'').toLowerCase();
    const subject = (r.subject||'').toLowerCase();
    const room = (r.room||'').toLowerCase();
    if(mode==='teacher') return splitTeachers(r.teacher).some(name=>name.toLowerCase() === q);
    if(mode==='room') return room === q;
    return teacher.includes(q) || subject.includes(q) || room.includes(q);
  }).forEach(r=>{
    const targetKey = r.targetBans?.length ? r.targetBans.join(',') : String(r.ban||'');
    const key = `K|${r.grade}|${r.ban}|${targetKey}|${r.subject}|${r.teacher}|${r.room}`;
    if(!commonMap.has(key)){
      commonMap.set(key, { grade:r.grade, ban:r.ban, targetBans:r.targetBans||[], subject:r.subject, teacher:r.teacher, room:r.room, hours:1 });
    } else {
      commonMap.get(key).hours++;
    }
  });
  [...commonMap.values()].forEach(c=>{
    const displayBans = c.targetBans.length ? c.targetBans : [c.ban];
    const classLabel = `${c.grade}학년 ${displayBans.join('·')}반`;
    results.push({
      key: `K|${c.grade}-${c.ban}|${c.subject}|${c.teacher}|${c.room}`,
      badge: `공통 [${classLabel}]${c.targetBans.length?` · 분반 ${c.ban}`:''} · 주 ${c.hours}시간`,
      slot: '공통',
      subj: c.subject,
      teacher: c.teacher || '미정',
      room: c.room || '미정',
      color: '#10b981',
      _grade: c.grade, _ban: displayBans[0]
    });
  });

  if(!results.length){
    rd.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px;background:var(--surface);border-radius:16px;font-weight:800;color:var(--text-muted);border:1px solid var(--border);">😢 "${escapeHtml(q)}" 결과 없음</div>`;
    return;
  }

  let h = `<div class="section-head"><div class="section-head-title">수업 검색 결과</div><div class="section-head-meta">${results.length}건</div></div>
    <div class="compact-table-wrap"><table class="compact-table">
      <thead><tr><th>구분</th><th>과목</th><th class="col-person">담당 교사</th><th class="col-room">수업 장소</th><th class="col-slot">슬롯</th></tr></thead><tbody>`;
  results.forEach(r=>{
    const isCommon = r.slot === '공통';
    const slotLabel = isCommon
      ? `<span class="badge">공통</span>`
      : `<span class="slot-token" style="--slot-color:${r.color}" data-nav="slot" data-arg1="${escapeHtml(r.grade||'')}" data-arg2="${escapeHtml(r.slot)}">${escapeHtml(r.slot)}</span>`;

    // 과목 네비: 선택과목은 명렬표, 공통은 해당 반별 조회
    let subjAttrs = '';
    if(isCommon && r._grade && r._ban){
      subjAttrs = `data-nav="class" data-arg1="${escapeHtml(r._grade)}" data-arg2="${escapeHtml(r._ban)}"`;
    } else if(!isCommon && r._grade && r.slot){
      subjAttrs = `data-nav="roster" data-arg1="${escapeHtml(r._grade)}" data-arg2="${escapeHtml(r.slot)}" data-arg3="${escapeHtml(r.subj)}"`;
    }
    // 학생 배지 네비
    let badgeAttrs = '';
    if(r._studentId) badgeAttrs = `data-nav="student" data-arg1="${escapeHtml(r._studentId)}"`;
    else if(isCommon && r._grade && r._ban) badgeAttrs = `data-nav="class" data-arg1="${escapeHtml(r._grade)}" data-arg2="${escapeHtml(r._ban)}"`;

    h += `<tr>
      <td class="muted-cell" data-label="구분"><span ${badgeAttrs}>${escapeHtml(r.badge)}</span></td>
      <td class="subject-cell" data-label="과목"><span ${subjAttrs}>${escapeHtml(r.subj)}</span></td>
      <td class="col-person" data-label="담당 교사">${renderTeacherLinks(r.teacher)}</td>
      <td class="col-room" data-label="수업 장소">${escapeHtml(r.room)}</td>
      <td class="col-slot" data-label="슬롯">${slotLabel}</td>
    </tr>`;
  });
  h += `</tbody></table></div>`;
  rd.innerHTML = h;
}
</script>
</body>
